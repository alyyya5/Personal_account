<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Для преподавателя</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --text: #1e2a3a;
            --muted: #5a6b82;
            --accent: #4a6fa5;
            --accent-light: #e8eff9;
            --mint-light: #e6f5f0;
            --surface: rgba(255, 255, 255, 0.78);
            --surface-strong: rgba(255, 255, 255, 0.92);
            --border: rgba(74, 111, 165, 0.12);
            --shadow: 0 12px 40px rgba(30, 42, 58, 0.08);
            --radius: 20px;
            --transition: 0.2s ease;
        }

        body {
            min-height: 100vh;
            padding: 24px 16px;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: var(--text);
            background: radial-gradient(circle at 10% 8%, rgba(74, 111, 165, 0.06) 0%, transparent 35%),
                        radial-gradient(circle at 92% 15%, rgba(74, 165, 130, 0.06) 0%, transparent 30%),
                        linear-gradient(135deg, #f0f4fc 0%, #f7f9fc 50%, #f0f7f5 100%);
            background-attachment: fixed;
        }

        /* ========== ОБЩИЙ КОНТЕЙНЕР ========== */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 28px 30px 32px;
            background: var(--surface);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 32px;
            box-shadow: var(--shadow);
        }

        /* ========== ШАПКА ========== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-icon {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            background: linear-gradient(135deg, #e8eff9, #e6f5f0);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            border: 1px solid var(--border);
        }

        .header-title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: #1e2a3a;
        }

        .header-sub {
            font-size: 0.85rem;
            color: var(--muted);
            margin-top: 2px;
        }

        .logout-btn {
            padding: 8px 18px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.6);
            color: var(--muted);
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .logout-btn:hover {
            background: #fff;
            color: var(--text);
            box-shadow: 0 4px 12px rgba(30, 42, 58, 0.06);
            transform: translateY(-1px);
        }

        /* ========== СТАТИСТИКА ========== */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-card {
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid var(--border);
            border-radius: 16px;
            text-align: center;
            transition: var(--transition);
        }

        .stat-card:hover {
            background: #fff;
            box-shadow: 0 4px 12px rgba(30, 42, 58, 0.04);
        }

        .stat-number {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent);
            line-height: 1.2;
        }

        .stat-label {
            font-size: 0.7rem;
            color: var(--muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        /* ========== КАЛЕНДАРЬ ========== */
        .calendar-section {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 16px 16px;
            margin-bottom: 20px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }

        .calendar-header .month-year {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1e2a3a;
        }

        .calendar-header .nav-buttons {
            display: flex;
            gap: 6px;
        }

        .calendar-header .nav-buttons button {
            width: 34px;
            height: 34px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.8);
            color: var(--muted);
            cursor: pointer;
            font-size: 0.8rem;
            transition: var(--transition);
        }

        .calendar-header .nav-buttons button:hover {
            background: var(--accent-light);
            color: var(--accent);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .calendar-grid .weekday {
            text-align: center;
            padding: 4px 0 6px;
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #8a9aaa;
        }

        .calendar-grid .day {
            min-height: 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid transparent;
            color: #3e4e62;
            font-size: 0.8rem;
            font-weight: 550;
            cursor: default;
            transition: var(--transition);
        }

        .calendar-grid .day.other-month {
            background: transparent;
            color: #c5ced9;
        }

        .calendar-grid .day.has-lesson {
            cursor: pointer;
            background: linear-gradient(135deg, rgba(74, 111, 165, 0.08), rgba(74, 165, 130, 0.08));
            border-color: rgba(74, 111, 165, 0.15);
            color: #2e4a7a;
            font-weight: 600;
        }

        .calendar-grid .day.has-lesson:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(74, 111, 165, 0.10);
            border-color: rgba(74, 111, 165, 0.3);
        }

        .calendar-grid .day .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--accent);
            margin-top: 2px;
        }

        .calendar-grid .day.today {
            border: 2px solid var(--accent);
        }

        /* ========== СПИСОК УРОКОВ ========== */
        .lessons-list {
            background: var(--surface-strong);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 14px 18px;
            max-height: 540px;
            overflow-y: auto;
        }

        .lessons-list h3 {
            font-size: 0.9rem;
            font-weight: 700;
            color: #1e2a3a;
            margin-bottom: 10px;
        }

        .lessons-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 4px;
            font-size: 0.72rem;
            table-layout: fixed;
        }

        .lessons-table th {
            text-align: left;
            padding: 4px 8px 6px;
            color: #8a9aaa;
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            font-weight: 700;
        }

        .lessons-table td {
            padding: 8px 8px;
            vertical-align: middle;
            background: rgba(244, 247, 252, 0.6);
            color: #3e4e62;
            line-height: 1.4;
            border-radius: 0;
        }

        .lessons-table td:first-child {
            border-radius: 12px 0 0 12px;
        }

        .lessons-table td:last-child {
            border-radius: 0 12px 12px 0;
        }

        .lessons-table tr:hover td {
            background: rgba(232, 239, 249, 0.7);
        }

        .col-date { width: 50px; }
        .col-day { width: 44px; }
        .col-student { width: 62px; }
        .col-time { width: 76px; }
        .col-topic { width: auto; }
        .col-links { width: 72px; text-align: center; }
        .col-done { width: 92px; text-align: center; }

        .topic-cell {
            word-wrap: break-word;
            overflow-wrap: break-word;
            hyphens: auto;
            font-size: 0.7rem;
        }

        .inner-flex {
            display: flex;
            gap: 4px;
            align-items: center;
            justify-content: center;
            flex-wrap: nowrap;
        }

        /* ========== ССЫЛКИ ========== */
        .links-cell a {
            width: 26px;
            height: 26px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            background: #eef1fb;
            color: #4a6fa5;
            border-radius: 8px;
            font-size: 0.7rem;
            transition: var(--transition);
            flex-shrink: 0;
        }

        .links-cell a:hover {
            background: #dce5f5;
            transform: translateY(-1px);
        }

        /* ========== ГАЛОЧКИ ========== */
        .check-cell {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .check-cell label {
            display: flex;
            align-items: center;
            gap: 3px;
            color: #6a7b90;
            font-size: 0.6rem;
            cursor: pointer;
            white-space: nowrap;
        }

        .check-cell input[type="checkbox"] {
            width: 14px;
            height: 14px;
            cursor: pointer;
            accent-color: var(--accent);
            flex-shrink: 0;
        }

        .no-lessons-msg {
            padding: 12px 4px;
            color: #8a9aaa;
            font-style: italic;
            font-size: 0.8rem;
        }

        /* ========== МОДАЛКА ========== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            padding: 20px;
            background: rgba(30, 42, 58, 0.25);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            position: relative;
            width: 100%;
            max-width: 540px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px 28px 28px;
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 28px;
            box-shadow: 0 24px 60px rgba(30, 42, 58, 0.12);
            animation: modalFade 0.2s ease-out;
        }

        @keyframes modalFade {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .modal-card .close-btn {
            position: absolute;
            top: 12px;
            right: 14px;
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: #8a9aaa;
            font-size: 1.4rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .modal-card .close-btn:hover {
            background: #f1f3f8;
            color: #1e2a3a;
            transform: rotate(90deg);
        }

        .modal-card .modal-date {
            padding-bottom: 12px;
            margin-bottom: 16px;
            padding-right: 35px;
            border-bottom: 1px solid #e8ebf2;
            font-size: 0.95rem;
            font-weight: 600;
            color: #3e4e62;
        }

        .modal-student-card {
            padding: 14px 16px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #f5f8fd, #f2f8f6);
            border: 1px solid rgba(74, 111, 165, 0.08);
            border-radius: 16px;
            transition: var(--transition);
        }

        .modal-student-card:last-child {
            margin-bottom: 0;
        }

        .modal-student-card:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(30, 42, 58, 0.05);
        }

        .modal-student-card .student-name {
            font-size: 0.95rem;
            font-weight: 700;
            color: #1e2a3a;
        }

        .modal-student-card .student-time {
            margin-top: 3px;
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 600;
        }

        .modal-student-card .student-topic {
            margin: 6px 0 10px;
            color: #3e4e62;
            font-size: 0.85rem;
            line-height: 1.45;
        }

        .modal-student-card .student-links {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .modal-student-card .student-links a {
            padding: 6px 14px;
            border-radius: 12px;
            text-decoration: none;
            background: linear-gradient(135deg, #4a6fa5, #3d5f8f);
            color: #fff;
            font-size: 0.7rem;
            font-weight: 600;
            transition: var(--transition);
        }

        .modal-student-card .student-links a:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(74, 111, 165, 0.15);
        }

        .modal-student-card .student-links a.secondary {
            background: #e6f5f0;
            color: #2d6b5a;
        }

        .modal-student-card .student-links a.secondary:hover {
            background: #d4ede6;
            box-shadow: none;
        }

        /* ========== АДАПТИВ ========== */
        @media (max-width: 768px) {
            .container { padding: 18px 14px 22px; border-radius: 24px; }
            .header-title { font-size: 1.2rem; }
            .header-icon { width: 42px; height: 42px; font-size: 1.2rem; }
            .stats-row { grid-template-columns: repeat(3, 1fr); gap: 8px; }
            .stat-number { font-size: 1.4rem; }
            .calendar-grid .day { min-height: 38px; font-size: 0.7rem; border-radius: 10px; }
            .calendar-grid .weekday { font-size: 0.5rem; }
            .lessons-list { padding: 12px 8px; max-height: 400px; }
            .lessons-table { font-size: 0.6rem; }
            .col-date { width: 38px; }
            .col-day { width: 34px; }
            .col-student { width: 48px; }
            .col-time { width: 60px; }
            .col-links { width: 56px; }
            .col-done { width: 72px; }
            .lessons-table td { padding: 6px 4px; }
            .topic-cell { font-size: 0.6rem; }
            .links-cell a { width: 22px; height: 22px; font-size: 0.6rem; }
            .check-cell label { font-size: 0.5rem; }
            .check-cell input[type="checkbox"] { width: 12px; height: 12px; }
            .modal-card { padding: 18px 16px; border-radius: 22px; max-width: 400px; }
        }

        @media (max-width: 480px) {
            body { padding: 12px 6px; }
            .container { padding: 14px 10px 18px; border-radius: 20px; }
            .header { flex-direction: column; align-items: stretch; gap: 12px; }
            .header-left { gap: 10px; }
            .header-title { font-size: 1rem; }
            .header-sub { font-size: 0.7rem; }
            .logout-btn { align-self: flex-end; padding: 6px 14px; font-size: 0.7rem; }
            .stats-row { grid-template-columns: repeat(3, 1fr); gap: 6px; }
            .stat-card { padding: 10px 8px; }
            .stat-number { font-size: 1.2rem; }
            .stat-label { font-size: 0.55rem; }
            .calendar-grid .day { min-height: 32px; font-size: 0.6rem; border-radius: 8px; }
            .calendar-grid .day .dot { width: 4px; height: 4px; }
            .col-date { width: 30px; }
            .col-day { width: 26px; }
            .col-student { width: 38px; }
            .col-time { width: 48px; }
            .col-links { width: 44px; }
            .col-done { width: 60px; }
            .lessons-list { max-height: 320px; }
            .lessons-table td { padding: 4px 3px; font-size: 0.55rem; }
            .links-cell a { width: 18px; height: 18px; font-size: 0.5rem; }
            .check-cell { gap: 4px; }
            .check-cell label { font-size: 0.45rem; }
            .check-cell input[type="checkbox"] { width: 10px; height: 10px; }
            .modal-card { padding: 14px 12px; max-width: 320px; }
            .modal-student-card { padding: 10px 12px; }
            .modal-student-card .student-name { font-size: 0.85rem; }
            .modal-student-card .student-topic { font-size: 0.75rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="mainContent" style="display: none;">

        <!-- ===== ШАПКА ===== -->
        <div class="header">
            <div class="header-left">
                <div class="header-icon">👩‍🏫</div>
                <div>
                    <div class="header-title">Преподаватель</div>
                    <div class="header-sub">Все занятия всех учеников</div>
                </div>
            </div>
            <button class="logout-btn" id="logoutBtn">🚪 Выйти</button>
        </div>

        <!-- ===== СТАТИСТИКА ===== -->
        <div class="stats-row" id="statsRow">
            <div class="stat-card">
                <div class="stat-number" id="statTotalLessons">0</div>
                <div class="stat-label">Всего уроков</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="statStudents">0</div>
                <div class="stat-label">Учеников</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="statDone">0</div>
                <div class="stat-label">ДЗ выполнено</div>
            </div>
        </div>

        <!-- ===== КАЛЕНДАРЬ ===== -->
        <div class="calendar-section">
            <div class="calendar-header">
                <span class="month-year" id="monthYear"></span>
                <div class="nav-buttons">
                    <button id="prevMonth">◀</button>
                    <button id="nextMonth">▶</button>
                </div>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>

        <!-- ===== СПИСОК УРОКОВ ===== -->
        <div class="lessons-list">
            <h3>📋 Все уроки на месяц</h3>
            <div id="lessonsTableContainer"></div>
        </div>

    </div>
</div>

<!-- ===== МОДАЛКА ===== -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
        <button class="close-btn" id="modalClose">&times;</button>
        <div class="modal-date" id="modalDate"></div>
        <div id="modalStudentsContainer"></div>
    </div>
</div>

<script>
    // ============================================================
    //  📥  СПИСОК УЧЕНИКОВ (добавьте нового сюда!)
    // ============================================================
    const studentList = ['valeriya', 'amina', 'denis', 'sanie'];

    // ============================================================
    //  🖥  ПРОВЕРКА СЕССИИ
    // ============================================================
    const sessionData = localStorage.getItem('teacherSession');
    if (sessionData) {
        try {
            const data = JSON.parse(sessionData);
            if (data && data.name === 'alina') {
                document.getElementById('mainContent').style.display = 'block';
            }
        } catch (e) {}
    }

    let currentDate = new Date();
    let currentMonth = currentDate.getMonth();
    let currentYear = currentDate.getFullYear();
    let lessonsData = [];

    // DOM
    const mainContent = document.getElementById('mainContent');
    const lessonsTableContainer = document.getElementById('lessonsTableContainer');
    const logoutBtn = document.getElementById('logoutBtn');
    const monthYear = document.getElementById('monthYear');
    const calendarGrid = document.getElementById('calendarGrid');
    const prevMonthBtn = document.getElementById('prevMonth');
    const nextMonthBtn = document.getElementById('nextMonth');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalClose = document.getElementById('modalClose');
    const modalDate = document.getElementById('modalDate');
    const modalStudentsContainer = document.getElementById('modalStudentsContainer');
    const statTotalLessons = document.getElementById('statTotalLessons');
    const statStudents = document.getElementById('statStudents');
    const statDone = document.getElementById('statDone');

    // ============================================================
    //  ИМЯ УЧЕНИКА
    // ============================================================
    function getStudentName(id) {
        const names = {
            'valeriya': 'Валерия',
            'amina': 'Амина',
            'denis': 'Денис',
            'sanie': 'Сание'
        };
        return names[id] || id;
    }

    // ============================================================
    //  ГАЛОЧКИ
    // ============================================================
    function getCheckKey(studentId, dateStr, type) {
        return `checked_${studentId}_${dateStr}_${type}`;
    }

    function saveCheck(studentId, dateStr, type, value) {
        localStorage.setItem(getCheckKey(studentId, dateStr, type), value);
    }

    function loadCheck(studentId, dateStr, type) {
        return localStorage.getItem(getCheckKey(studentId, dateStr, type)) === 'true';
    }

    // ============================================================
    //  ЗАГРУЗКА ВСЕХ УРОКОВ
    // ============================================================
    async function loadAllLessons() {
        let all = [];
        for (let s of studentList) {
            try {
                const response = await fetch(`config/${s}.json`);
                if (response.ok) {
                    const data = await response.json();
                    data.forEach(item => {
                        all.push({
                            ...item,
                            student: s,
                            studentName: getStudentName(s)
                        });
                    });
                } else {
                    console.warn(`⚠️ Не удалось загрузить ${s}`);
                }
            } catch (e) {
                console.warn(`⚠️ Не удалось загрузить ${s}`);
            }
        }
        lessonsData = all;
        updateStats();
    }

    // ============================================================
    //  СТАТИСТИКА
    // ============================================================
    function updateStats() {
        const total = lessonsData.length;
        const uniqueStudents = new Set(lessonsData.map(l => l.student)).size;

        let doneCount = 0;
        const today = new Date();
        const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
        lessonsData.forEach(l => {
            if (l.date <= todayStr && l.hwStatus && l.hwStatus.includes('Проверено')) {
                doneCount++;
            }
        });

        statTotalLessons.textContent = total;
        statStudents.textContent = uniqueStudents;
        statDone.textContent = doneCount;
    }

    // ============================================================
    //  УРОКИ НА ДАТУ / МЕСЯЦ
    // ============================================================
    function getLessonsForDate(dateStr) {
        return lessonsData.filter(item => item.date === dateStr);
    }

    function getLessonsForMonth(year, month) {
        const result = [];
        const days = new Date(year, month + 1, 0).getDate();
        for (let d = 1; d <= days; d++) {
            const dateObj = new Date(year, month, d);
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            const dayLessons = lessonsData.filter(item => item.date === dateStr);
            if (dayLessons.length) {
                result.push({ date: dateObj, lessons: dayLessons });
            }
        }
        return result;
    }

    // ============================================================
    //  КАЛЕНДАРЬ
    // ============================================================
    function renderCalendar(year, month) {
        const firstDay = new Date(year, month, 1).getDay();
        const startDay = (firstDay === 0) ? 6 : firstDay - 1;
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const today = new Date();
        const monthNames = ['Янв', 'Фев', 'Мар', 'Апр', 'Май', 'Июн', 'Июл', 'Авг', 'Сен', 'Окт', 'Ноя', 'Дек'];
        monthYear.textContent = `${monthNames[month]} ${year}`;
        const lessonDates = new Set(lessonsData.map(item => item.date));
        const weekdays = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
        let html = weekdays.map(w => `<div class="weekday">${w}</div>`).join('');
        for (let i = 0; i < startDay; i++) html += `<div class="day other-month"></div>`;
        for (let d = 1; d <= daysInMonth; d++) {
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            const hasLesson = lessonDates.has(dateStr);
            let cls = 'day';
            if (hasLesson) cls += ' has-lesson';
            if (d === today.getDate() && month === today.getMonth() && year === today.getFullYear()) cls += ' today';
            const attr = hasLesson ? `data-date="${dateStr}"` : '';
            html += `<div class="${cls}" ${attr}>${d}${hasLesson ? '<span class="dot"></span>' : ''}</div>`;
        }
        calendarGrid.innerHTML = html;
        document.querySelectorAll('.day.has-lesson').forEach(el => {
            el.addEventListener('click', function() {
                const dateStr = this.dataset.date;
                const lessons = getLessonsForDate(dateStr);
                if (lessons.length) showModal(dateStr, lessons);
            });
        });
    }

    // ============================================================
    //  МОДАЛКА
    // ============================================================
    function showModal(dateStr, lessons) {
        const [y, m, d] = dateStr.split('-').map(Number);
        const dateObj = new Date(y, m - 1, d);
        modalDate.textContent = dateObj.toLocaleDateString('ru-RU', {
            weekday: 'long',
            day: 'numeric',
            month: 'long',
            year: 'numeric'
        });

        let studentsHtml = '';
        lessons.forEach((l) => {
            let linksHtml = '';
            if (l.material) {
                linksHtml += `<a href="${l.material}" target="_blank" class="secondary">📖 Материал</a>`;
            }
            if (l.homework) {
                const params = new URLSearchParams({
                    student: l.student,
                    date: l.date,
                    topic: l.topic || '',
                    start: l.start || '',
                    end: l.end || ''
                });
                const separator = l.homework.includes('?') ? '&' : '?';
                linksHtml += `<a href="${l.homework}${separator}${params.toString()}" target="_blank">📝 Домашка</a>`;
            }

            studentsHtml += `
                <div class="modal-student-card">
                    <div class="student-name">👤 ${getStudentName(l.student)}</div>
                    <div class="student-time">⏰ ${l.start}–${l.end}</div>
                    <div class="student-topic">📖 ${l.topic || 'Тема не указана'}</div>
                    <div class="student-links">
                        ${linksHtml || '<span style="color:#8a9aaa;font-size:0.75rem;">Нет ссылок</span>'}
                    </div>
                </div>
            `;
        });

        modalStudentsContainer.innerHTML = studentsHtml;
        modalOverlay.classList.add('active');
    }

    modalClose.addEventListener('click', () => modalOverlay.classList.remove('active'));
    modalOverlay.addEventListener('click', e => {
        if (e.target === modalOverlay) modalOverlay.classList.remove('active');
    });

    // ============================================================
    //  ТАБЛИЦА УРОКОВ
    // ============================================================
    function renderLessonsList(year, month) {
        const data = getLessonsForMonth(year, month);
        if (!data.length) {
            lessonsTableContainer.innerHTML = '<div class="no-lessons-msg">На этот месяц уроков нет.</div>';
            return;
        }

        let html = `
            <table class="lessons-table">
                <thead>
                    <tr>
                        <th class="col-date">Дата</th>
                        <th class="col-day">День</th>
                        <th class="col-student">Уч-к</th>
                        <th class="col-time">Время</th>
                        <th class="col-topic">Тема</th>
                        <th class="col-links">Ссылки</th>
                        <th class="col-done">Готово</th>
                    </tr>
                </thead>
                <tbody>
        `;

        data.forEach(item => {
            const dateObj = item.date;
            const day = String(dateObj.getDate()).padStart(2, '0');
            const monthNum = String(dateObj.getMonth() + 1).padStart(2, '0');
            const displayDate = `${day}.${monthNum}`;
            const dayName = dateObj.toLocaleDateString('ru-RU', { weekday: 'short' });

            item.lessons.forEach((l, idx) => {
                const studentId = l.student;
                const rowspan = idx === 0 ? item.lessons.length : 0;

                const hwChecked = loadCheck(studentId, l.date, 'homework');
                const matChecked = loadCheck(studentId, l.date, 'material');

                const checkHtml = `
                    <td class="col-done">
                        <div class="inner-flex check-cell">
                            <label>
                                <input type="checkbox" class="check-done" data-student="${studentId}" data-date="${l.date}" data-type="homework" ${hwChecked ? 'checked' : ''} />
                                ДЗ
                            </label>
                            <label>
                                <input type="checkbox" class="check-done" data-student="${studentId}" data-date="${l.date}" data-type="material" ${matChecked ? 'checked' : ''} />
                                📚
                            </label>
                        </div>
                    </td>
                `;

                let links = '';
                if (l.material) links += `<a href="${l.material}" target="_blank" title="Материал">📖</a>`;
                if (l.homework) {
                    const params = new URLSearchParams({
                        student: studentId,
                        date: l.date,
                        topic: l.topic || '',
                        start: l.start || '',
                        end: l.end || ''
                    });
                    const separator = l.homework.includes('?') ? '&' : '?';
                    links += `<a href="${l.homework}${separator}${params.toString()}" target="_blank" title="Домашка">📝</a>`;
                }

                html += `<tr>
                    ${rowspan ? `<td rowspan="${rowspan}" class="col-date">${displayDate}</td><td rowspan="${rowspan}" class="col-day">${dayName}</td>` : ''}
                    <td class="col-student">${getStudentName(studentId)}</td>
                    <td class="col-time">${l.start}–${l.end}</td>
                    <td class="col-topic topic-cell">${l.topic || '—'}</td>
                    <td class="col-links links-cell">
                        <div class="inner-flex">${links || '—'}</div>
                    </td>
                    ${checkHtml}
                </tr>`;
            });
        });

        html += '</tbody></table>';
        lessonsTableContainer.innerHTML = html;

        document.querySelectorAll('.check-done').forEach(cb => {
            cb.addEventListener('change', function() {
                const student = this.dataset.student;
                const date = this.dataset.date;
                const type = this.dataset.type;
                saveCheck(student, date, type, this.checked);
            });
        });
    }

    // ============================================================
    //  ПЕРЕКЛЮЧЕНИЕ МЕСЯЦА
    // ============================================================
    function changeMonth(delta) {
        currentMonth += delta;
        if (currentMonth < 0) { currentMonth = 11; currentYear--; }
        if (currentMonth > 11) { currentMonth = 0; currentYear++; }
        renderCalendar(currentYear, currentMonth);
        renderLessonsList(currentYear, currentMonth);
    }

    prevMonthBtn.addEventListener('click', () => changeMonth(-1));
    nextMonthBtn.addEventListener('click', () => changeMonth(1));

    // ============================================================
    //  ЗАПУСК
    // ============================================================
    async function initTeacherPage() {
        await loadAllLessons();
        renderCalendar(currentYear, currentMonth);
        renderLessonsList(currentYear, currentMonth);
    }

    // ============================================================
    //  ВЫХОД
    // ============================================================
    logoutBtn.addEventListener('click', () => {
        localStorage.removeItem('teacherSession');
        for (let key in localStorage) {
            if (key.startsWith('checked_')) {
                localStorage.removeItem(key);
            }
        }
        window.location.href = 'index.html';
    });

    // ============================================================
    //  АВТОВХОД
    // ============================================================
    if (localStorage.getItem('teacherSession')) {
        mainContent.style.display = 'block';
        initTeacherPage();
    } else {
        window.location.href = 'index.html';
    }
</script>
</body>
</html>
