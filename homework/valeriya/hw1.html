<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Таблица умножения</title>
    <style>
        :root {
            --bg: #f0f4f8;
            --card: #ffffff;
            --primary: #5a67d8;
            --primary-light: #ebf4ff;
            --success: #48bb78;
            --error: #f56565;
            --text: #2d3748;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh; /* Fallback */
            height: 100dvh; /* Dynamic viewport height для мобильных */
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            width: 100%;
            max-width: 500px;
            height: 100%;
            background: var(--card);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        /* --- Экраны --- */
        .screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
            background: var(--card);
            z-index: 20;
            transition: opacity 0.3s ease;
        }
        .screen.hidden { opacity: 0; pointer-events: none; z-index: -1; }

        h1 { font-size: 1.8rem; margin-bottom: 1rem; color: var(--primary); }
        p { margin-bottom: 2rem; line-height: 1.6; color: #4a5568; }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            border-radius: 12px;
            cursor: pointer;
            min-height: 50px;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.98); }

        /* --- Игровой интерфейс --- */
        .game-header {
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            color: #718096;
            z-index: 5;
        }

        .progress-container {
            height: 6px;
            background: #edf2f7;
            width: 100%;
            z-index: 5;
        }
        .progress-bar {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Зона падения - критически важно для видимости */
        .fall-zone {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at center, #fff 0%, #f7fafc 100%);
            /* Границы зоны, чтобы пример не улетал в input */
            border-bottom: 1px solid #edf2f7;
        }

        .falling-item {
            position: absolute;
            left: 50%;
            top: 0; /* Начинаем сверху */
            transform: translate(-50%, -100px); /* Центрируем и сдвигаем вверх за экран */
            background: var(--primary-light);
            border: 2px solid var(--primary);
            padding: 1rem 2rem;
            border-radius: 16px;
            font-size: 2.5rem; /* Очень крупно */
            font-weight: 800;
            color: var(--primary);
            white-space: nowrap;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            will-change: transform;
            z-index: 10;
        }

        /* --- Ввод --- */
        .input-area {
            padding: 1rem;
            background: white;
            display: flex;
            gap: 0.5rem;
            z-index: 15;
            padding-bottom: max(1rem, env(safe-area-inset-bottom));
        }

        input[type="number"] {
            flex: 1;
            padding: 0.8rem;
            font-size: 1.5rem;
            border: 2px solid #cbd5e0;
            border-radius: 12px;
            outline: none;
            text-align: center;
            -moz-appearance: textfield;
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button { -webkit-appearance: none; }
        input:focus { border-color: var(--primary); }

        .btn-submit {
            padding: 0 1.5rem;
            font-weight: bold;
        }

        /* --- Эффекты --- */
        @keyframes flashOk { 0% { background-color: var(--success); } 100% { background-color: var(--card); } }
        @keyframes flashErr { 0% { background-color: var(--error); } 100% { background-color: var(--card); } }
        .flash-ok { animation: flashOk 0.3s ease; }
        .flash-err { animation: flashErr 0.3s ease; }

        /* --- Результаты --- */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            width: 100%;
            margin-bottom: 1.5rem;
        }
        .stat-box {
            background: #f7fafc;
            padding: 1rem;
            border-radius: 12px;
        }
        .stat-num { font-size: 2rem; font-weight: bold; color: var(--primary); }
        .stat-label { font-size: 0.9rem; color: #718096; }
        
        .mistakes-list {
            width: 100%;
            text-align: left;
            margin-bottom: 1.5rem;
            max-height: 150px;
            overflow-y: auto;
            color: var(--error);
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="app" id="app">
    <!-- Старт -->
    <div id="screen-start" class="screen">
        <h1>🌟 Таблица умножения</h1>
        <p>Примеры падают сверху.<br>Успей ввести ответ!<br>20 примеров.</p>
        <button onclick="Game.start()">Начать игру</button>
    </div>

    <!-- Игра -->
    <div id="screen-game" class="screen hidden" style="background: transparent; padding: 0;">
        <div class="game-header">
            <span id="ui-counter">0 / 20</span>
        </div>
        <div class="progress-container">
            <div class="progress-bar" id="ui-progress"></div>
        </div>
        
        <div class="fall-zone" id="fall-zone">
            <!-- Сюда падают примеры -->
        </div>

        <div class="input-area">
            <input type="number" id="ui-input" placeholder="?" inputmode="numeric" autocomplete="off">
            <button class="btn-submit" onclick="Game.submit()">OK</button>
        </div>
    </div>

    <!-- Финиш -->
    <div id="screen-end" class="screen hidden">
        <h1>Результат ✨</h1>
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-num" id="res-correct">0</div>
                <div class="stat-label">Верно</div>
            </div>
            <div class="stat-box">
                <div class="stat-num" id="res-missed">0</div>
                <div class="stat-label">Пропущено</div>
            </div>
        </div>
        <div id="res-mistakes" class="mistakes-list"></div>
        <button onclick="Game.start()">Играть снова</button>
    </div>
</div>

<script>
const Game = (() => {
    // Настройки
    const TOTAL_ROUNDS = 20;
    const FALL_DURATION = 6000; // мс (6 секунд на падение - комфортно)
    const SPAWN_DELAY = 1500;   // мс пауза между примерами

    // Состояние
    let questions = [];
    let currentIdx = 0;
    let scoreCorrect = 0;
    let scoreMissed = 0;
    let mistakes = [];
    let activeItem = null; // { el, question, startTime }
    let animFrameId = null;
    let spawnTimerId = null;
    let isPlaying = false;

    // DOM Elements
    const els = {
        app: document.getElementById('app'),
        screens: {
            start: document.getElementById('screen-start'),
            game: document.getElementById('screen-game'),
            end: document.getElementById('screen-end')
        },
        fallZone: document.getElementById('fall-zone'),
        input: document.getElementById('ui-input'),
        progress: document.getElementById('ui-progress'),
        counter: document.getElementById('ui-counter'),
        resCorrect: document.getElementById('res-correct'),
        resMissed: document.getElementById('res-missed'),
        resMistakes: document.getElementById('res-mistakes')
    };

    // Генерация вопросов
    function generateQuestions() {
        const q = [];
        for (let i = 0; i < TOTAL_ROUNDS; i++) {
            const a = Math.floor(Math.random() * 9) + 2; // 2..10
            const b = Math.floor(Math.random() * 9) + 2;
            q.push({ a, b, ans: a * b });
        }
        return q;
    }

    // Управление экранами
    function showScreen(name) {
        Object.values(els.screens).forEach(s => s.classList.add('hidden'));
        els.screens[name].classList.remove('hidden');
    }

    // Обновление прогресса
    function updateUI() {
        const pct = (currentIdx / TOTAL_ROUNDS) * 100;
        els.progress.style.width = `${pct}%`;
        els.counter.textContent = `${Math.min(currentIdx, TOTAL_ROUNDS)} / ${TOTAL_ROUNDS}`;
    }

    // Визуальная обратная связь
    function flash(type) {
        const cls = type === 'ok' ? 'flash-ok' : 'flash-err';
        els.app.classList.remove('flash-ok', 'flash-err');
        void els.app.offsetWidth; // trigger reflow
        els.app.classList.add(cls);
    }

    // Очистка активного элемента
    function clearActive() {
        if (activeItem) {
            if (activeItem.el && activeItem.el.parentNode) {
                activeItem.el.parentNode.removeChild(activeItem.el);
            }
            cancelAnimationFrame(animFrameId);
            activeItem = null;
        }
    }

    // Логика падения
    function spawnItem() {
        if (!isPlaying) return;

        // Если раунды закончились и нет активного элемента -> конец
        if (currentIdx >= TOTAL_ROUNDS) {
            if (!activeItem) endGame();
            return;
        }

        const q = questions[currentIdx];
        const el = document.createElement('div');
        el.className = 'falling-item';
        el.textContent = `${q.a} × ${q.b}`;
        els.fallZone.appendChild(el);

        activeItem = {
            el: el,
            question: q,
            startTime: performance.now()
        };

        currentIdx++;
        updateUI();

        // Анимация
        const animate = (now) => {
            if (!isPlaying || !activeItem || activeItem.el !== el) return;

            const elapsed = now - activeItem.startTime;
            const progress = Math.min(elapsed / FALL_DURATION, 1);
            
            // Получаем высоту зоны падения динамически
            const zoneHeight = els.fallZone.clientHeight;
            // Двигаем от -100px (за экраном) до zoneHeight (вниз)
            const yPos = -100 + (progress * (zoneHeight + 100));

            el.style.transform = `translate(-50%, ${yPos}px)`;

            if (progress >= 1) {
                // Пропуск
                handleMiss(q);
                clearActive();
                scheduleNext();
            } else {
                animFrameId = requestAnimationFrame(animate);
            }
        };

        animFrameId = requestAnimationFrame(animate);
    }

    function scheduleNext() {
        if (currentIdx >= TOTAL_ROUNDS && !activeItem) {
            setTimeout(endGame, 500);
        } else if (currentIdx < TOTAL_ROUNDS) {
            spawnTimerId = setTimeout(spawnItem, SPAWN_DELAY);
        }
    }

    function handleMiss(q) {
        scoreMissed++;
        mistakes.push(q);
        flash('err');
    }

    // Проверка ответа
    function submitAnswer() {
        if (!activeItem || !isPlaying) return;

        const val = parseInt(els.input.value);
        if (isNaN(val)) return;

        if (val === activeItem.question.ans) {
            scoreCorrect++;
            flash('ok');
        } else {
            scoreMissed++;
            mistakes.push(activeItem.question);
            flash('err');
        }

        clearActive();
        els.input.value = '';
        els.input.focus();
        scheduleNext();
    }

    // Конец игры
    function endGame() {
        isPlaying = false;
        clearTimeout(spawnTimerId);
        cancelAnimationFrame(animFrameId);
        clearActive();

        els.resCorrect.textContent = scoreCorrect;
        els.resMissed.textContent = scoreMissed;

        if (mistakes.length > 0) {
            els.resMistakes.innerHTML = '<strong>Ошибки:</strong><br>' + 
                mistakes.map(m => `${m.a} × ${m.b} = ${m.ans}`).join('<br>');
        } else {
            els.resMistakes.innerHTML = '<span style="color: var(--success)">🎉 Всё верно!</span>';
        }

        showScreen('end');
    }

    // Старт
    function startGame() {
        questions = generateQuestions();
        currentIdx = 0;
        scoreCorrect = 0;
        scoreMissed = 0;
        mistakes = [];
        isPlaying = true;

        clearActive();
        els.input.value = '';
        updateUI();
        showScreen('game');

        // Небольшая задержка перед стартом, чтобы анимация экрана прошла
        setTimeout(() => {
            els.input.focus();
            spawnItem();
        }, 300);
    }

    // Слушатели
    els.input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') submitAnswer();
    });

    // Публичный API
    return {
        start: startGame,
        submit: submitAnswer
    };
})();
</script>
</body>
</html>
