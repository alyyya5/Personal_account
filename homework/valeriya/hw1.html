<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таблица умножения: Поймай ответ</title>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --game-bg: #ffffff;
            --text-color: #2d3748;
            --accent: #667eea;
            --success: #48bb78;
            --error: #f56565;
            --falling-item-bg: #ebf8ff;
            --falling-item-border: #bee3f8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            height: 90vh;
            background: var(--game-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Экраны */
        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
            background: var(--game-bg);
            z-index: 10;
            transition: opacity 0.3s;
        }

        .hidden { opacity: 0; pointer-events: none; z-index: -1; }

        h1 { font-size: 1.8rem; margin-bottom: 1rem; color: var(--accent); }
        p { margin-bottom: 1.5rem; line-height: 1.6; color: #4a5568; }
        
        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }
        button:hover { background: #5a67d8; transform: translateY(-2px); }
        button:active { transform: translateY(0); }

        /* Игровое поле */
        #game-area {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at bottom, #ebf8ff 0%, #fff 70%);
        }

        .falling-item {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            background: var(--falling-item-bg);
            border: 2px solid var(--falling-item-border);
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
            white-space: nowrap;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .input-zone {
            padding: 1.5rem;
            background: white;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 0.5rem;
            z-index: 5;
        }

        input[type="number"] {
            flex: 1;
            padding: 1rem;
            font-size: 1.3rem;
            border: 2px solid #cbd5e0;
            border-radius: 12px;
            outline: none;
            text-align: center;
            transition: border-color 0.2s;
            -moz-appearance: textfield;
        }
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input:focus { border-color: var(--accent); }

        .progress-bar {
            height: 6px;
            background: #edf2f7;
            width: 100%;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Анимации обратной связи */
        @keyframes flashGreen { 0% { background: var(--success); } 100% { background: var(--game-bg); } }
        @keyframes flashRed { 0% { background: var(--error); } 100% { background: var(--game-bg); } }
        .flash-success { animation: flashGreen 0.3s ease; }
        .flash-error { animation: flashRed 0.3s ease; }

        /* Результаты */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            width: 100%;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: #f7fafc;
            padding: 1rem;
            border-radius: 12px;
        }
        .stat-value { font-size: 2rem; font-weight: bold; color: var(--accent); }
        .stat-label { font-size: 0.9rem; color: #718096; }

        .mistakes-list {
            width: 100%;
            text-align: left;
            margin-bottom: 1.5rem;
            max-height: 150px;
            overflow-y: auto;
            font-size: 0.95rem;
            color: #e53e3e;
        }
    </style>
</head>
<body>

<div class="container" id="app-container">
    <!-- Стартовый экран -->
    <div id="start-screen" class="screen">
        <h1>🌟 Поймай ответ</h1>
        <p>Примеры будут плавно падать сверху.<br>Введи ответ и нажми Enter.<br>20 примеров в комфортном темпе.</p>
        <button onclick="game.start()">Начать игру</button>
    </div>

    <!-- Игровой экран -->
    <div id="game-screen" class="screen hidden" style="background: transparent; pointer-events: none;">
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        <div id="game-area"></div>
        <div class="input-zone" style="pointer-events: auto;">
            <input type="number" id="answer-input" placeholder="?" autocomplete="off" inputmode="numeric">
        </div>
    </div>

    <!-- Экран результатов -->
    <div id="result-screen" class="screen hidden">
        <h1>Результат ✨</h1>
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="score-correct">0</div>
                <div class="stat-label">Верно</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="score-missed">0</div>
                <div class="stat-label">Пропущено</div>
            </div>
        </div>
        <div id="mistakes-container" class="mistakes-list"></div>
        <button onclick="game.restart()">Играть снова</button>
    </div>
</div>

<script>
class MathGame {
    constructor() {
        this.totalRounds = 20;
        this.fallDuration = 6000; // мс на падение одного примера (комфортная скорость)
        this.spawnDelay = 2500;   // мс между появлением примеров
        
        this.questions = [];
        this.currentRound = 0;
        this.correct = 0;
        this.missed = 0;
        this.mistakes = [];
        this.activeItem = null;
        this.animationFrame = null;
        this.spawnTimeout = null;
        this.isRunning = false;

        // DOM
        this.container = document.getElementById('app-container');
        this.gameArea = document.getElementById('game-area');
        this.input = document.getElementById('answer-input');
        this.progressFill = document.getElementById('progress');
        
        this.input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') this.checkAnswer();
        });
    }

    generateQuestions() {
        const q = [];
        for (let i = 0; i < this.totalRounds; i++) {
            const a = Math.floor(Math.random() * 9) + 2; // 2-10
            const b = Math.floor(Math.random() * 9) + 2;
            q.push({ a, b, answer: a * b });
        }
        return q;
    }

    start() {
        this.questions = this.generateQuestions();
        this.currentRound = 0;
        this.correct = 0;
        this.missed = 0;
        this.mistakes = [];
        this.isRunning = true;

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        
        this.updateProgress();
        this.spawnNext();
        this.input.focus();
    }

    restart() {
        this.start();
    }

    spawnNext() {
        if (!this.isRunning || this.currentRound >= this.totalRounds) {
            // Ждём пока последний пример упадёт
            if (!this.activeItem) this.endGame();
            return;
        }

        const q = this.questions[this.currentRound];
        const el = document.createElement('div');
        el.className = 'falling-item';
        el.textContent = `${q.a} × ${q.b}`;
        el.style.top = '-60px';
        this.gameArea.appendChild(el);

        this.activeItem = { el, question: q, startTime: performance.now() };
        this.currentRound++;
        this.updateProgress();

        const animate = (now) => {
            if (!this.isRunning || !this.activeItem || this.activeItem.el !== el) return;
            
            const elapsed = now - this.activeItem.startTime;
            const progress = Math.min(elapsed / this.fallDuration, 1);
            const areaHeight = this.gameArea.clientHeight;
            const y = -60 + progress * (areaHeight + 60);
            
            el.style.top = `${y}px`;

            if (progress >= 1) {
                this.handleMiss(q);
                this.clearActiveItem();
                this.scheduleNext();
            } else {
                this.animationFrame = requestAnimationFrame(animate);
            }
        };
        this.animationFrame = requestAnimationFrame(animate);
    }

    scheduleNext() {
        if (this.currentRound >= this.totalRounds && !this.activeItem) {
            setTimeout(() => this.endGame(), 500);
        } else if (this.currentRound < this.totalRounds) {
            this.spawnTimeout = setTimeout(() => this.spawnNext(), this.spawnDelay);
        }
    }

    checkAnswer() {
        if (!this.activeItem || !this.isRunning) return;

        const val = parseInt(this.input.value);
        if (isNaN(val)) return;

        if (val === this.activeItem.question.answer) {
            this.correct++;
            this.flashFeedback('success');
        } else {
            this.missed++;
            this.mistakes.push(this.activeItem.question);
            this.flashFeedback('error');
        }

        this.clearActiveItem();
        this.input.value = '';
        this.scheduleNext();
    }

    handleMiss(q) {
        this.missed++;
        this.mistakes.push(q);
        this.flashFeedback('error');
    }

    clearActiveItem() {
        if (this.activeItem) {
            this.activeItem.el.remove();
            cancelAnimationFrame(this.animationFrame);
            this.activeItem = null;
        }
    }

    flashFeedback(type) {
        const cls = type === 'success' ? 'flash-success' : 'flash-error';
        this.container.classList.add(cls);
        setTimeout(() => this.container.classList.remove(cls), 300);
    }

    updateProgress() {
        const pct = (this.currentRound / this.totalRounds) * 100;
        this.progressFill.style.width = `${pct}%`;
    }

    endGame() {
        this.isRunning = false;
        clearTimeout(this.spawnTimeout);
        cancelAnimationFrame(this.animationFrame);
        this.clearActiveItem();

        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');

        document.getElementById('score-correct').textContent = this.correct;
        document.getElementById('score-missed').textContent = this.missed;

        const mistakesContainer = document.getElementById('mistakes-container');
        if (this.mistakes.length > 0) {
            mistakesContainer.innerHTML = '<strong>Повторить:</strong><br>' + 
                this.mistakes.map(m => `${m.a} × ${m.b} = ${m.answer}`).join('<br>');
        } else {
            mistakesContainer.innerHTML = '<span style="color: var(--success)">🎉 Все верно! Отличная работа!</span>';
        }
    }
}

const game = new MathGame();
</script>
</body>
</html>
