<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Домашнее задание</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #a1c4fd, #c2e9fb);
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .box {
            background: rgba(255, 255, 255, 0.85);
            padding: 50px 70px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
        }
        .box p {
            font-size: 24px;
            color: #2c5f8a;
            margin: 0;
            font-weight: 600;
        }
        .smile {
            font-size: 48px;
            display: block;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="box">
        <span class="smile">😊</span>
        <p>Здесь пусто, дз уже выполнено</p>
    </div>
</body>
</html>
