<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Домашнее задание</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #eef2fa;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 30px 20px;
            color: #1a2a3a;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 40px;
            padding: 30px 35px 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        }
        h1 {
            font-size: 2rem;
            color: #0b2a44;
            border-left: 8px solid #3b82f6;
            padding-left: 20px;
            margin-bottom: 12px;
        }
        .info-line {
            color: #4a627a;
            margin-bottom: 20px;
            padding-left: 28px;
            font-size: 1.05rem;
        }
        .info-line strong {
            color: #1f4970;
        }
        .task {
            background: #f8fafc;
            border-radius: 24px;
            padding: 18px 22px;
            margin-bottom: 16px;
            border-left: 4px solid #3b82f6;
        }
        .task .question {
            font-weight: 500;
            margin-bottom: 8px;
        }
        .task input {
            width: 100%;
            padding: 10px 16px;
            border: 2px solid #dce5ef;
            border-radius: 30px;
            font-size: 0.95rem;
            background: white;
            outline: none;
            transition: 0.2s;
        }
        .task input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59,130,246,0.12);
        }
        .task .result {
            margin-top: 8px;
            font-weight: 500;
            font-size: 0.95rem;
        }
        .task .result.correct {
            color: #16a34a;
        }
        .task .result.wrong {
            color: #dc2626;
        }
        .button-group {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin: 20px 0 10px;
        }
        .btn {
            background: #1e4663;
            border: none;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            padding: 12px 30px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover {
            background: #0f3550;
            transform: scale(1.02);
        }
        .btn-secondary {
            background: #e9eff6;
            color: #1f4970;
        }
        .btn-secondary:hover {
            background: #dce5ef;
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        #status {
            margin-top: 14px;
            font-size: 0.95rem;
            color: #4a627a;
        }

        /* Модалка отчёта */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10,25,45,0.35);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-card {
            background: white;
            border-radius: 36px;
            max-width: 500px;
            width: 100%;
            padding: 28px 30px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.12);
            animation: modalFade 0.25s ease-out;
        }
        @keyframes modalFade {
            0% { opacity: 0; transform: translateY(16px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .modal-card h3 {
            font-size: 1.3rem;
            color: #0b2a44;
            margin-bottom: 10px;
        }
        .modal-card textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #dce5ef;
            border-radius: 30px;
            font-size: 0.95rem;
            font-family: inherit;
            resize: vertical;
            outline: none;
            transition: 0.2s;
        }
        .modal-card textarea:focus {
            border-color: #3b82f6;
        }
        .modal-card .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .modal-card .modal-buttons .btn {
            flex: 1;
        }
        #modalStatus {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #4a627a;
        }
        @media (max-width: 600px) {
            .container { padding: 18px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 Домашнее задание</h1>
    <div class="info-line">
        <strong>Ученик:</strong> <span id="studentName"></span> &nbsp;|&nbsp;
        <strong>Дата:</strong> <span id="lessonDate"></span> &nbsp;|&nbsp;
        <strong>Тема:</strong> <span id="lessonTopic"></span>
    </div>

    <div id="tasksContainer"></div>

    <div class="button-group">
        <button class="btn" id="checkBtn">✅ Проверить</button>
        <button class="btn btn-secondary" id="reportBtn">📤 Отправить отчёт</button>
    </div>
    <div id="status"></div>
</div>

<!-- Модалка для отчёта -->
<div class="modal-overlay" id="reportModal">
    <div class="modal-card">
        <h3>📤 Отправить отчёт</h3>
        <p style="color: #4a627a; margin-bottom: 12px; font-size: 0.95rem;">
            Добавьте комментарий (Было сложно? Какие вопросы возникли?).
        </p>
        <textarea id="reportComment" rows="4" placeholder="Ваш комментарий..."></textarea>
        <div class="modal-buttons">
            <button class="btn" id="sendReportBtn">✅ Отправить</button>
            <button class="btn btn-secondary" id="cancelReportBtn">Отмена</button>
        </div>
        <div id="modalStatus"></div>
    </div>
</div>

<script src="/config.js"></script>
<script>
    // ============================================================
    //  ⚙️  ЗАДАНИЯ (меняйте здесь для каждого урока)
    // ============================================================
    const tasks = [
        {
            question: "Решите уравнение: 2x + 5 = 13",
            correct: "4"
        },
        {
            question: "Вычислите: √64 + 3²",
            correct: "17"
        },
        {
            question: "Найдите площадь прямоугольника со сторонами 5 и 7",
            correct: "35"
        }
    ];

    // ============================================================
    //  КОД (не трогайте, если не уверены)
    // ============================================================

    // Получаем параметры из URL
    const params = getUrlParams();
    const student = params.student;
    const date = params.date;
    const topic = params.topic;

    // Сохраняем имя в localStorage для удобства
    localStorage.setItem('studentName', student);

    document.getElementById('studentName').textContent = student;
    document.getElementById('lessonDate').textContent = date;
    document.getElementById('lessonTopic').textContent = topic;

    // Рендерим задания
    const container = document.getElementById('tasksContainer');
    tasks.forEach((task, index) => {
        const div = document.createElement('div');
        div.className = 'task';
        div.innerHTML = `
            <div class="question">${index+1}. ${task.question}</div>
            <input type="text" id="input_${index}" placeholder="Введите ответ" />
            <div class="result" id="result_${index}"></div>
        `;
        container.appendChild(div);
    });

    // Проверка ответов
    document.getElementById('checkBtn').addEventListener('click', function() {
        let allCorrect = true;
        tasks.forEach((task, index) => {
            const input = document.getElementById(`input_${index}`);
            const resultDiv = document.getElementById(`result_${index}`);
            const userAnswer = input.value.trim();
            const correct = task.correct.trim();

            const isCorrect = normalizeAnswer(userAnswer) === normalizeAnswer(correct);

            if (isCorrect) {
                resultDiv.textContent = '✅ Правильно';
                resultDiv.className = 'result correct';
            } else {
                resultDiv.textContent = `❌ Неправильно. Правильный ответ: ${correct}`;
                resultDiv.className = 'result wrong';
                allCorrect = false;
            }
        });
        document.getElementById('status').textContent = allCorrect ? '🎉 Все задания выполнены верно!' : '⚠️ Есть ошибки. Исправьте их.';
        document.getElementById('status').style.color = allCorrect ? '#16a34a' : '#dc2626';
    });

    // Открытие модалки отчёта
    document.getElementById('reportBtn').addEventListener('click', function() {
        document.getElementById('reportModal').classList.add('active');
        document.getElementById('reportComment').value = '';
        document.getElementById('modalStatus').textContent = '';
    });

    // Закрытие модалки
    document.getElementById('cancelReportBtn').addEventListener('click', function() {
        document.getElementById('reportModal').classList.remove('active');
    });
    document.getElementById('reportModal').addEventListener('click', function(e) {
        if (e.target === this) this.classList.remove('active');
    });

    // Отправка отчёта (использует функцию createGitHubIssue из config.js)
    document.getElementById('sendReportBtn').addEventListener('click', async function() {
        const comment = document.getElementById('reportComment').value.trim();
        const statusDiv = document.getElementById('modalStatus');
        if (!comment) {
            statusDiv.textContent = '⚠️ Напишите комментарий.';
            statusDiv.style.color = '#dc2626';
            return;
        }

        // Собираем ответы ученика
        let answersText = '';
        tasks.forEach((task, index) => {
            const input = document.getElementById(`input_${index}`);
            const userAnswer = input.value.trim() || '(пусто)';
            const correct = task.correct.trim();
            const isCorrect = normalizeAnswer(userAnswer) === normalizeAnswer(correct);
            answersText += `${index+1}. ${task.question}\n   Ваш ответ: ${userAnswer}\n   Правильный: ${correct}  ${isCorrect ? '✅' : '❌'}\n\n`;
        });

        const title = `Отчёт: ${student} — ${topic} (${date})`;
        const body = `**Ученик:** ${student}\n**Дата:** ${date}\n**Тема:** ${topic}\n\n**Результаты:**\n${answersText}\n**Комментарий:**\n${comment}`;

        const btn = this;
        btn.disabled = true;
        btn.textContent = '⏳ Отправка...';
        statusDiv.textContent = '';
        statusDiv.style.color = '#4a627a';

        try {
            const issueUrl = await createGitHubIssue(title, body);
            statusDiv.innerHTML = `✅ Отчёт отправлен! <a href="${issueUrl}" target="_blank" style="color: #3b82f6; text-decoration: underline;">Посмотреть Issue</a>`;
            statusDiv.style.color = '#16a34a';
            setTimeout(() => {
                document.getElementById('reportModal').classList.remove('active');
            }, 3000);
        } catch (error) {
            statusDiv.textContent = `❌ Ошибка: ${error.message}`;
            statusDiv.style.color = '#dc2626';
        } finally {
            btn.disabled = false;
            btn.textContent = '✅ Отправить';
        }
    });
</script>
</body>
</html>
