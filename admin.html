<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Панель учителя</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#eef1fb;color:#263247;padding:20px}
.w{max-width:1200px;margin:0 auto}.c{background:#fff;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 4px 14px #38486e14}
h1{margin:0 0 14px}h2{margin:0 0 12px;font-size:1.1rem}
input,select{padding:8px 10px;border:1px solid #cfd6ea;border-radius:10px;font:inherit;max-width:100%}
button{padding:9px 16px;border:0;border-radius:10px;background:linear-gradient(135deg,#3567c9,#6d54c7);color:#fff;font-weight:700;cursor:pointer}
button.g{background:#e8ecf8;color:#3567c9}button.r{background:#d85c5c}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.tabs button{opacity:.55}.tabs button.on{opacity:1}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.88rem}td,th{padding:4px;text-align:left}
td input,td select{width:100%;min-width:90px}.t{min-width:260px}
#msg{position:fixed;bottom:16px;right:16px;background:#263247;color:#fff;padding:10px 16px;border-radius:12px;display:none}
.sg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.sg>b{text-align:center}.dc{min-height:70px;background:#f4f6fd;border-radius:10px;padding:6px}.dc.td{outline:2px solid #3567c9}.dc.ot{opacity:.4}.ls{font-size:.78rem;background:#e8ecf8;border-radius:6px;padding:2px 5px;margin-top:3px}
</style></head><body><div class="w">
<h1>🛠 Панель учителя <small style="font-size:.5em;opacity:.6">версия 6</small></h1>

<div class="c" id="setup">
 <h2>Подключение к GitHub</h2>
 <div class="row">
  <input id="repo" placeholder="логин/репозиторий">
  <input id="branch" placeholder="ветка" value="main" size="8">
  <input id="token" type="password" placeholder="токен (Contents: read/write)">
  <button onclick="connect()">Подключиться</button>
 </div>
 <small>Токен хранится только в этом браузере.</small>
</div>

<div id="app" style="display:none">
 <div class="row tabs"><button id="b1" class="on" onclick="tab(1)">👥 Ученики</button><button id="b2" onclick="tab(2)">📅 Занятия</button><button id="b3" onclick="tab(3)">📬 Домашки <span id="bd"></span></button><button id="b4" onclick="tab(4)">📎 Файлы</button><button id="b5" onclick="tab(5)">🗓 Моё расписание</button></div>

 <div id="t1" class="c">
  <h2>Ученики</h2>
  <div class="tw"><table id="stT"></table></div>
  <h2 style="margin-top:18px">Добавить ученика</h2>
  <div class="row">
   <input id="nName" placeholder="Имя (Иван)"><input id="nId" placeholder="id латиницей (ivan)"><input id="nPass" placeholder="пароль">
   <button onclick="addStudent()">Добавить</button>
  </div>
 </div>

 <div id="t5" class="c" style="display:none">
  <div class="row"><button class="g" onclick="sc.m='w';sc.off=0;renderSch()">Неделя</button><button class="g" onclick="sc.m='m';sc.off=0;renderSch()">Месяц</button>
   <button class="g" onclick="sc.off--;renderSch()">◀</button><b id="scTitle"></b><button class="g" onclick="sc.off++;renderSch()">▶</button></div>
  <div class="sg" id="scG"></div></div>

 <div id="t4" class="c" style="display:none"><h2>Загрузить домашку или материал урока</h2>
  <div class="row"><select id="fS" onchange="fillL()"></select><select id="fL"></select>
   <select id="fT"><option value="homework">Домашка</option><option value="material">Материал</option></select></div>
  <div class="row">Файл с компьютера: <input type="file" id="fF" accept=".html,.htm"></div>
  <p style="margin:6px 0">…или вставьте HTML-код целиком:</p>
  <textarea id="fC" rows="8" style="width:100%;border:1px solid #cfd6ea;border-radius:10px;padding:8px"></textarea>
  <div class="row" style="margin-top:8px"><button onclick="upload()">⬆ Загрузить</button></div>
 </div>

 <div id="t3" class="c" style="display:none"><h2>Присланные домашки</h2><div id="isT">Загрузка…</div></div>

 <div id="t2" class="c" style="display:none">
  <div class="row"><h2 style="margin:0">Занятия ученика:</h2><select id="sel" onchange="pick(this.value)"></select>
   <button onclick="saveLessons()">💾 Сохранить</button><button class="g" onclick="addLesson()">+ Урок</button><button class="g" onclick="addLesson(4)">+ 4 урока</button></div>
  <div class="tw"><table id="lsT"></table></div>
 </div>
</div>
<div id="msg"></div></div>

<script>
if(sessionStorage.getItem('teacher')!=='1'){document.querySelector('.w').innerHTML='<div class="c"><h2>Доступ закрыт</h2><p>Войдите через <a href="index.html">главную страницу</a> под именем учителя.</p></div>';throw new Error('no access')}
const $=s=>document.querySelector(s);
let cfg=JSON.parse(localStorage.getItem('gh')||'{}'),students=[],lessons=[],cur=null;
const enc=s=>btoa(unescape(encodeURIComponent(s))),dec=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
function msg(t){const m=$('#msg');m.textContent=t;m.style.display='block';setTimeout(()=>m.style.display='none',3000)}
const url=p=>`https://api.github.com/repos/${cfg.repo}/contents/${p}`;
const H=()=>({Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json'});
async function get(p){const r=await fetch(url(p)+`?ref=${cfg.branch}&t=${Date.now()}`,{headers:H()});
 if(r.status===404)return{data:null};if(!r.ok)throw new Error('GitHub '+r.status);
 const j=await r.json();return{data:JSON.parse(dec(j.content)),sha:j.sha}}
async function put(p,data,m){const o=await get(p);const b={message:m,branch:cfg.branch,content:enc(JSON.stringify(data,null,2))};
 if(o.sha)b.sha=o.sha;const r=await fetch(url(p),{method:'PUT',headers:H(),body:JSON.stringify(b)});if(!r.ok)throw new Error('Ошибка сохранения '+r.status)}
async function del(p){const r=await fetch(url(p)+`?ref=${cfg.branch}`,{headers:H()});if(!r.ok)return;const j=await r.json();
 await fetch(url(p),{method:'DELETE',headers:H(),body:JSON.stringify({message:'delete '+p,sha:j.sha,branch:cfg.branch})})}

async function connect(){
 cfg={repo:$('#repo').value.trim(),branch:$('#branch').value.trim()||'main',token:$('#token').value.trim()};
 try{await init();localStorage.setItem('gh',JSON.stringify(cfg))}catch(e){msg('❌ '+e.message)}}
async function init(){
 let r=await get('config/students.json');students=r.data;
 if(!students){students=[
  {id:'valeriya',name:'Валерия',aliases:['валерия','лера','valeriya'],password:'der44'},
  {id:'amina',name:'Амина',aliases:['амина','amina'],password:'5678'},
  {id:'denis',name:'Денис',aliases:['денис','ден','denis'],password:'1234'},
  {id:'sanie',name:'Сание',aliases:['сание','sanie'],password:'1122'}];
  await put('config/students.json',students,'create students.json');msg('Создан students.json')}
 if(!students.some(x=>x.role==='teacher')){students.unshift({id:'alina',name:'Алина',role:'teacher',aliases:['алина','alina'],password:'1111'});await put('config/students.json',students,'add teacher')}
 $('#setup').style.display='none';$('#app').style.display='block';renderStudents();loadIssues();setInterval(loadIssues,60000)}

function preview(i){sessionStorage.setItem('preview',students[i].id);location.href='index.html'}
let seen=-1;
async function loadIssues(){
 try{const r=await fetch(`https://api.github.com/repos/${cfg.repo}/issues?state=open&per_page=50&t=${Date.now()}`,{headers:H()});
 if(!r.ok)throw new Error('Issues '+r.status);
 const a=(await r.json()).filter(i=>!i.pull_request&&i.title.startsWith('ДЗ:'));
 $('#bd').textContent=a.length?'('+a.length+')':'';document.title=(a.length?`(${a.length}) `:'')+'Панель учителя';
 if(seen>=0&&a.length>seen)msg('📬 Пришла новая домашка!');seen=a.length;
 $('#isT').innerHTML=a.length?a.map(i=>{const b=i.body||'',g=re=>(b.match(re)||[])[1]||'';
  const st=g(/\*\*Ученик:\*\*\s*([\w-]+)/),d=g(/\*\*Дата:\*\*\s*(\d{4}-\d{2}-\d{2})/),res=g(/\*\*Результат:\*\*\s*([^\n]+)/),pc=g(/\((\d+)%\)/);
  return `<div class="row" style="border-bottom:1px solid #eef;padding:8px 0"><div style="flex:1;min-width:220px"><b>${esc(i.title)}</b><br><small>${esc(res)} · ${new Date(i.created_at).toLocaleString('ru-RU')}</small></div>
  <a href="${i.html_url}" target="_blank"><button class="g">Открыть отчёт</button></a>
  <button onclick="grade(${i.number},'${st}','${d}','${pc}')">✅ Поставить балл</button>
  <button class="g" onclick="closeIssue(${i.number})">Скрыть</button></div>`}).join(''):'Новых домашек нет 🎉'}
 catch(e){$('#isT').textContent='❌ '+e.message+' — проверьте, что у токена есть право Issues'}}
async function closeIssue(n){
 try{const r=await fetch(`https://api.github.com/repos/${cfg.repo}/issues/${n}`,{method:'PATCH',headers:H(),body:JSON.stringify({state:'closed'})});
 if(!r.ok){msg(r.status===403||r.status===404?'❌ Нет права закрывать отчёты: у токена в Issues нужно «Read and write»':'❌ Ошибка '+r.status);return false}
 await loadIssues();return true}catch(e){msg('❌ '+e.message);return false}}
async function grade(n,st,d,pc){
 const v=prompt('Балл за домашку (можно изменить):',pc?pc+'%':'');if(v===null)return;
 try{const r=await get('config/'+st+'.json');const l=(r.data||[]).find(x=>x.date===d&&x.homework);
 if(!l)return msg('Урок на '+d+' не найден — поставьте балл вручную во вкладке «Занятия»');
 l.hwScore=v;l.hwStatus='Проверено';await put('config/'+st+'.json',r.data,'score '+st+' '+d);
 if(cur===st)pick(st);await closeIssue(n);msg('✅ Балл поставлен')}catch(e){msg('❌ '+e.message)}}
const DN={пн:1,вт:2,ср:3,чт:4,пт:5,сб:6,вс:0},DR=['вс','пн','вт','ср','чт','пт','сб'];
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmtSch=s=>(s.schedule||[]).map(x=>`${DR[x.d]} ${x.start}-${x.end}`).join(', ');
function setSch(i,v){students[i].schedule=[...v.matchAll(/(пн|вт|ср|чт|пт|сб|вс)\s*(\d{1,2}:\d{2})\s*[-–]\s*(\d{1,2}:\d{2})/gi)].map(m=>({d:DN[m[1].toLowerCase()],start:m[2].padStart(5,'0'),end:m[3].padStart(5,'0')}));saveSt();renderStudents()}
function nextSlot(sch,after){if(!sch.length)return null;const d=new Date(after+'T12:00:00');
 for(let k=0;k<400;k++){d.setDate(d.getDate()+1);const sl=sch.filter(x=>x.d===d.getDay()).sort((a,b)=>a.start.localeCompare(b.start))[0];if(sl)return{date:iso(d),start:sl.start,end:sl.end}}return null}
let sc={all:[],m:'w',off:0};
async function loadSch(){try{sc.all=(await Promise.all(students.filter(s=>s.role!=='teacher').map(async s=>((await get('config/'+s.id+'.json')).data||[]).map(l=>({...l,n:s.name}))))).flat();renderSch()}catch(e){msg('❌ '+e.message)}}
function renderSch(){const t=new Date(),days=[],W=sc.m==='w',f=new Date(t.getFullYear(),t.getMonth()+sc.off,1);let a;
 if(W){a=new Date(t);a.setDate(t.getDate()-((t.getDay()+6)%7)+sc.off*7);for(let i=0;i<7;i++){const d=new Date(a);d.setDate(a.getDate()+i);days.push(d)}}
 else{const e=new Date(f.getFullYear(),f.getMonth()+1,0),off=(f.getDay()+6)%7;a=new Date(f);a.setDate(1-off);for(let i=0;i<Math.ceil((off+e.getDate())/7)*7;i++){const d=new Date(a);d.setDate(a.getDate()+i);days.push(d)}}
 $('#scTitle').textContent=W?days[0].toLocaleDateString('ru-RU')+' – '+days[6].toLocaleDateString('ru-RU'):f.toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
 $('#scG').innerHTML=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<b>${x}</b>`).join('')+days.map(d=>{const k=iso(d),ls=sc.all.filter(l=>l.date===k).sort((x,y)=>x.start.localeCompare(y.start));
  return `<div class="dc${k===iso(t)?' td':''}${!W&&d.getMonth()!==f.getMonth()?' ot':''}"><small>${d.getDate()}</small>${ls.map(l=>`<div class="ls" title="${esc(l.topic)}"><b>${l.start}${W?'–'+l.end:''}</b> ${esc(l.n)}${W&&l.topic?'<br><small>'+esc(l.topic)+'</small>':''}</div>`).join('')}</div>`}).join('')}
let fLs=[];
async function putFile(p,text,m){const r=await fetch(url(p)+`?ref=${cfg.branch}&t=${Date.now()}`,{headers:H()});
 const b={message:m,branch:cfg.branch,content:enc(text)};if(r.ok)b.sha=(await r.json()).sha;
 const w=await fetch(url(p),{method:'PUT',headers:H(),body:JSON.stringify(b)});if(!w.ok)throw new Error('Ошибка '+w.status)}
function initF(){$('#fS').innerHTML=students.filter(s=>s.role!=='teacher').map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');fillL()}
async function fillL(){const id=$('#fS').value;if(!id)return;
 try{fLs=((await get('config/'+id+'.json')).data||[]).sort((a,b)=>a.date.localeCompare(b.date));
 $('#fL').innerHTML=fLs.map((l,i)=>`<option value="${i}">${l.date} — ${esc(l.topic||'без темы')}</option>`).join('')}catch(e){msg('❌ '+e.message)}}
async function upload(){
 const id=$('#fS').value,i=+$('#fL').value,t=$('#fT').value,l=fLs[i];if(!l)return msg('Выберите урок');
 let text=$('#fC').value;const f=$('#fF').files[0];if(f)text=await f.text();
 if(!text.trim())return msg('Выберите файл или вставьте код');
 const path=l[t]||(t==='homework'?`homework/${id}/hw${i+1}.html`:`students/${id}/les${i+1}.html`);
 if(!confirm('Загрузить в '+path+'? Если файл уже есть, он будет заменён.'))return;
 try{if(!l[t]){l[t]=path;await put('config/'+id+'.json',fLs,'link '+path)}
 await putFile(path,text,'upload '+path);$('#fC').value='';$('#fF').value='';msg('✅ Загружено, появится на сайте через 1–2 минуты')}catch(e){msg('❌ '+e.message)}}
function tab(n){[1,2,3,4,5].forEach(i=>{$('#t'+i).style.display=i==n?'block':'none';$('#b'+i).classList.toggle('on',i==n)});if(n==2)renderSel();if(n==3)loadIssues();if(n==4)initF();if(n==5)loadSch()}
function renderStudents(){
 $('#stT').innerHTML='<tr><th>Имя</th><th>id</th><th>Пароль</th><th>Расписание (пн 16:45-17:45, пт 17:15-18:15)</th><th></th></tr>'+students.map((s,i)=>s.role==='teacher'?'':
 `<tr><td><input value="${esc(s.name)}" onchange="students[${i}].name=this.value;saveSt()"></td><td>${esc(s.id)}</td>
 <td><input value="${esc(s.password)}" onchange="students[${i}].password=this.value;saveSt()"></td>
 <td><input class="t" value="${esc(fmtSch(s))}" onchange="setSch(${i},this.value)"></td>
 <td><button class="g" onclick="preview(${i})">👁 Как ученик</button> <button class="r" onclick="rmStudent(${i})">Удалить</button></td></tr>`).join('')}
async function saveSt(){try{await put('config/students.json',students,'update students');msg('✅ Сохранено')}catch(e){msg('❌ '+e.message)}}
async function addStudent(){
 const name=$('#nName').value.trim(),id=$('#nId').value.trim().toLowerCase(),password=$('#nPass').value.trim();
 if(!name||!/^[a-z0-9_]+$/.test(id)||!password)return msg('Заполните имя, id (латиница) и пароль');
 if(students.some(s=>s.id===id))return msg('Такой id уже есть');
 try{students.push({id,name,aliases:[name.toLowerCase(),id],password});
  await put('config/'+id+'.json',[],'add '+id);await put('config/'+id+'_tests.json',[],'add tests '+id);
  await saveSt();renderStudents();['#nName','#nId','#nPass'].forEach(s=>$(s).value='')}catch(e){msg('❌ '+e.message)}}
async function rmStudent(i){const s=students[i];
 if(!confirm('Удалить '+s.name+'? Файлы расписания тоже будут удалены.'))return;
 try{students.splice(i,1);await saveSt();await del('config/'+s.id+'.json');await del('config/'+s.id+'_tests.json');renderStudents()}catch(e){msg('❌ '+e.message)}}

function renderSel(){$('#sel').innerHTML='<option value="">— выберите —</option>'+students.filter(s=>s.role!=='teacher').map(s=>`<option value="${s.id}"${s.id===cur?' selected':''}>${esc(s.name)}</option>`).join('')}
async function pick(id){cur=id;if(!id){lessons=[];return renderLessons()}
 try{lessons=(await get('config/'+id+'.json')).data||[];renderLessons()}catch(e){msg('❌ '+e.message)}}
const K=['date','start','end','topic','material','homework','zoomLink','boardLink'];
function renderLessons(){
 lessons.sort((a,b)=>a.date.localeCompare(b.date));
 $('#lsT').innerHTML='<tr><th>Дата</th><th>С</th><th>До</th><th>Тема</th><th>Материал</th><th>Домашка</th><th>Звонок</th><th>Доска</th><th>Статус ДЗ</th><th>Балл</th><th></th></tr>'+
 lessons.map((l,i)=>`<tr>`+K.map(k=>`<td><input class="${k=='topic'?'t':''}" ${k=='date'?'type="date"':''} value="${esc(l[k])}" oninput="lessons[${i}].${k}=this.value"></td>`).join('')+
 `<td><select onchange="lessons[${i}].hwStatus=this.value">${['Не решено','Не проверено','Проверено'].map(o=>`<option${o==l.hwStatus?' selected':''}>${o}</option>`).join('')}</select></td>
 <td><input size="6" value="${esc(l.hwScore)}" oninput="lessons[${i}].hwScore=this.value||null"></td>
 <td><button class="r" onclick="lessons.splice(${i},1);renderLessons()">✕</button></td></tr>`).join('')}
function addLesson(k=1){if(!cur)return msg('Выберите ученика');
 const sch=(students.find(x=>x.id===cur)||{}).schedule||[];
 for(let j=0;j<k;j++){
  const so=[...lessons].sort((a,b)=>a.date.localeCompare(b.date)),p=so[so.length-1]||{};
  const n=Math.max(0,...lessons.map(l=>+((l.homework||'').match(/hw(\d+)/)||[])[1]||0))+1,last=p.date||iso(new Date());
  const ns=nextSlot(sch,last)||{date:iso(new Date(new Date(last+'T12:00:00').getTime()+7*864e5)),start:p.start||'16:00',end:p.end||'17:00'};
  lessons.push({...ns,topic:'',material:`students/${cur}/les${n}.html`,homework:`homework/${cur}/hw${n}.html`,zoomLink:p.zoomLink||'',boardLink:p.boardLink||'',hwStatus:'Не решено',hwScore:null})}
 renderLessons()}
async function saveLessons(){if(!cur)return;try{await put('config/'+cur+'.json',lessons,'update lessons '+cur);msg('✅ Сохранено')}catch(e){msg('❌ '+e.message)}}

if(cfg.token){$('#repo').value=cfg.repo;$('#branch').value=cfg.branch;$('#token').value=cfg.token;init().catch(e=>msg('❌ '+e.message))}
</script></body></html>
