<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Для преподавателя</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(145deg, #f0f5fe 0%, #e8eefa 100%);
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            min-height: 100vh;
            padding: 20px 16px;
            color: #1a2a3a;
        }
        .container {
            max-width: 960px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            box-shadow: 0 16px 32px rgba(0, 20, 40, 0.06);
            padding: 24px 24px 28px;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #0b2a44;
            margin-bottom: 4px;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: #4a627a;
            font-size: 0.9rem;
            margin-bottom: 16px;
        }

        .login-area {
            max-width: 360px;
            margin: 0 auto 16px;
            background: white;
            padding: 18px 22px 22px;
            border-radius: 28px;
            border: 1px solid #e9eff6;
        }
        .login-area label {
            font-weight: 600;
            font-size: 0.95rem;
            color: #1f4970;
            display: block;
            margin-bottom: 4px;
        }
        .login-area input {
            width: 100%;
            padding: 8px 14px;
            border: 2px solid #dce5ef;
            border-radius: 24px;
            font-size: 0.95rem;
            background: #f9fcff;
            outline: none;
            text-align: center;
            margin-bottom: 6px;
        }
        .login-area input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.08);
        }
        .login-area button {
            background: #1e4663;
            border: none;
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 8px 24px;
            border-radius: 24px;
            cursor: pointer;
            width: 100%;
        }
        .login-area button:hover {
            background: #0f3550;
        }
        .login-error {
            color: #dc2626;
            font-size: 0.8rem;
            margin-top: 4px;
            min-height: 1.2em;
        }
        .login-hint {
            color: #6c86a3;
            font-size: 0.75rem;
            margin-top: 2px;
        }

        .logout-btn {
            background: #e9eff6;
            border: none;
            color: #1f4970;
            font-weight: 600;
            font-size: 0.85rem;
            padding: 4px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.15s;
            float: right;
            margin-top: -30px;
        }
        .logout-btn:hover {
            background: #dce5ef;
        }

        /* ----- Календарь (большой) ----- */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0 0 8px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .calendar-header .month-year {
            font-size: 1.2rem;
            font-weight: 700;
            color: #0b2a44;
        }
        .calendar-header .nav-buttons {
            display: flex;
            gap: 6px;
        }
        .calendar-header .nav-buttons button {
            background: white;
            border: 1px solid #dce5ef;
            border-radius: 20px;
            padding: 4px 14px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            color: #1f4970;
            transition: 0.15s;
        }
        .calendar-header .nav-buttons button:hover {
            background: #f0f7ff;
            border-color: #3b82f6;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            background: #f8fafc;
            border-radius: 14px;
            padding: 10px 8px;
            border: 1px solid #e9eff6;
            margin-bottom: 16px;
        }
        .calendar-grid .weekday {
            font-weight: 600;
            font-size: 0.65rem;
            text-align: center;
            color: #4a627a;
            padding: 4px 0 2px;
            border-bottom: 1.5px solid #e2e8f0;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .calendar-grid .day {
            aspect-ratio: 1/0.85;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            font-size: 0.85rem;
            font-weight: 500;
            background: white;
            cursor: default;
            border: 1px solid transparent;
            position: relative;
            transition: 0.15s;
        }
        .calendar-grid .day.other-month {
            color: #b8c8da;
            background: transparent;
            box-shadow: none;
        }
        .calendar-grid .day.has-lesson {
            background: #dbeafe;
            border-color: #3b82f6;
            cursor: pointer;
            font-weight: 600;
        }
        .calendar-grid .day.has-lesson:hover {
            background: #bfdbfe;
            transform: scale(1.04);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.12);
        }
        .calendar-grid .day .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #3b82f6;
            margin-top: 2px;
        }
        .calendar-grid .day.today {
            border: 2px solid #1e4663;
        }

        /* ----- Список с прокруткой ----- */
        .lessons-list {
            margin-top: 8px;
            background: white;
            border-radius: 14px;
            padding: 10px 12px 12px;
            border: 1px solid #e9eff6;
            max-height: 500px; /* Немного увеличил высоту окна прокрутки */
            overflow-y: auto;
        }
        .lessons-list h3 {
            font-size: 0.9rem;
            font-weight: 600;
            color: #0b2a44;
            margin-bottom: 4px;
            border-bottom: 1.5px solid #e2e8f0;
            padding-bottom: 4px;
        }

        .lessons-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.75rem;
            table-layout: fixed;
        }
        .lessons-table th {
            text-align: left;
            padding: 4px 4px 3px 0;
            font-weight: 600;
            color: #4a627a;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .lessons-table td {
            padding: 8px 4px; /* Увеличил вертикальный отступ для красоты */
            border-bottom: 1px solid #f0f4fa;
            vertical-align: middle;
            line-height: 1.4;
        }
        .lessons-table tr:last-child td {
            border-bottom: none;
        }

        .col-date { width: 48px; }
        .col-day { width: 42px; }
        .col-student { width: 54px; }
        .col-time { width: 76px; }
        .col-topic { width: auto; }
        .col-links { width: 70px; text-align: center; }
        .col-done { width: 90px; text-align: center; }

        /* ИСПРАВЛЕНИЕ: Убрано обрезание текста. Теперь тема видна полностью */
        .topic-cell {
            font-size: 0.75rem;
            line-height: 1.4;
            word-wrap: break-word;
            overflow-wrap: break-word;
            hyphens: auto;
            color: #1a2a3a;
        }

        /* Flex внутри div, а не в td */
        .inner-flex {
            display: flex;
            gap: 4px;
            align-items: center;
            justify-content: center;
            flex-wrap: nowrap;
        }

        .links-cell a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #e6f0ff;
            color: #1e4a76;
            width: 26px;
            height: 26px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.8rem;
            transition: 0.15s;
            flex-shrink: 0;
        }
        .links-cell a:hover {
            background: #bfdbfe;
        }

        .check-cell label {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.65rem;
            color: #1f4970;
            cursor: pointer;
            white-space: nowrap;
        }
        .check-cell input[type="checkbox"] {
            width: 14px;
            height: 14px;
            cursor: pointer;
            accent-color: #3b82f6;
            flex-shrink: 0;
        }

        .no-lessons-msg {
            color: #6c86a3;
            font-style: italic;
            padding: 8px 0;
            font-size: 0.8rem;
        }

        @media (max-width: 700px) {
            .container { padding: 14px 12px 18px; }
            .col-date { width: 38px; }
            .col-day { width: 34px; }
            .col-student { width: 44px; }
            .col-time { width: 60px; }
            .col-links { width: 60px; }
            .col-done { width: 80px; }
            .lessons-table { font-size: 0.65rem; }
            .topic-cell { font-size: 0.65rem; }
            .check-cell label { font-size: 0.55rem; }
            .check-cell input[type="checkbox"] { width: 12px; height: 12px; }
            .links-cell a { width: 22px; height: 22px; font-size: 0.7rem; }
            .lessons-list { max-height: 400px; }
            .calendar-grid { gap: 3px; padding: 8px 6px; }
            .calendar-grid .day { font-size: 0.7rem; border-radius: 12px; aspect-ratio: 1/0.8; }
            .calendar-grid .weekday { font-size: 0.55rem; }
            .calendar-header .month-year { font-size: 1rem; }
            .calendar-header .nav-buttons button { padding: 3px 10px; font-size: 0.75rem; }
        }
        @media (max-width: 450px) {
            .col-date { width: 32px; }
            .col-day { width: 28px; }
            .col-student { width: 38px; }
            .col-time { width: 52px; }
            .col-links { width: 50px; }
            .col-done { width: 70px; }
            .check-cell label { font-size: 0.5rem; }
            .check-cell input[type="checkbox"] { width: 10px; height: 10px; }
            .lessons-list { max-height: 350px; }
            .calendar-grid .day { font-size: 0.6rem; border-radius: 10px; }
            .calendar-grid .weekday { font-size: 0.5rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>👩‍ Преподаватель</h1>
    <div class="subtitle">Все занятия всех учеников</div>

    <div class="login-area" id="loginArea">
        <label for="nameInput">👤 Имя</label>
        <input type="text" id="nameInput" placeholder="Алина" />
        <label for="passwordInput">🔑 Пароль</label>
        <input type="password" id="passwordInput" placeholder="Введите пароль" />
        <button id="loginBtn">Войти</button>
        <div class="login-error" id="loginError"></div>
        <div class="login-hint" id="loginHint"></div>
    </div>

    <div id="mainContent" style="display: none;">
        <button class="logout-btn" id="logoutBtn">🚪 Выйти</button>

        <!-- Большой календарь -->
        <div class="calendar-header">
            <span class="month-year" id="monthYear"></span>
            <div class="nav-buttons">
                <button id="prevMonth">◀</button>
                <button id="nextMonth">▶</button>
            </div>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>

        <!-- Список с галочками -->
        <div class="lessons-list" id="lessonsList">
            <h3>📋 Все уроки на месяц</h3>
            <div id="lessonsTableContainer"></div>
        </div>
    </div>
</div>

<script>
    // ============================================================
    //  🔐  ПАРОЛЬ ДЛЯ АЛИНЫ
    // ============================================================
    const TEACHER_PASSWORD = '12345';

    const studentList = ['valeriya', 'amina', 'aleksey'];
    let currentDate = new Date();
    let currentMonth = currentDate.getMonth();
    let currentYear = currentDate.getFullYear();
    let lessonsData = [];

    const nameInput = document.getElementById('nameInput');
    const passwordInput = document.getElementById('passwordInput');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');
    const loginHint = document.getElementById('loginHint');
    const mainContent = document.getElementById('mainContent');
    const loginArea = document.getElementById('loginArea');
    const lessonsTableContainer = document.getElementById('lessonsTableContainer');
    const logoutBtn = document.getElementById('logoutBtn');
    const monthYear = document.getElementById('monthYear');
    const calendarGrid = document.getElementById('calendarGrid');
    const prevMonthBtn = document.getElementById('prevMonth');
    const nextMonthBtn = document.getElementById('nextMonth');

    function getStudentName(id) {
        const names = { 'valeriya': 'Валерия', 'amina': 'Амина', 'aleksey': 'Алексей' };
        return names[id] || id;
    }

    function getCheckKey(studentId, dateStr, type) {
        return `checked_${studentId}_${dateStr}_${type}`;
    }

    function saveCheck(studentId, dateStr, type, value) {
        localStorage.setItem(getCheckKey(studentId, dateStr, type), value);
    }

    function loadCheck(studentId, dateStr, type) {
        return localStorage.getItem(getCheckKey(studentId, dateStr, type)) === 'true';
    }

    async function loadAllLessons() {
        let all = [];
        for (let s of studentList) {
            try {
                const response = await fetch(`config/${s}.json`);
                if (response.ok) {
                    const data = await response.json();
                    data.forEach(item => {
                        all.push({ ...item, student: s, studentName: getStudentName(s) });
                    });
                }
            } catch (e) {
                console.warn('Не удалось загрузить', s);
            }
        }
        lessonsData = all;
    }

    function getLessonsForDate(dateStr) {
        return lessonsData.filter(item => item.date === dateStr);
    }

    function getLessonsForMonth(year, month) {
        const result = [];
        const days = new Date(year, month + 1, 0).getDate();
        for (let d = 1; d <= days; d++) {
            const dateObj = new Date(year, month, d);
            const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const dayLessons = lessonsData.filter(item => item.date === dateStr);
            if (dayLessons.length) {
                result.push({ date: dateObj, lessons: dayLessons });
            }
        }
        return result;
    }

    function renderCalendar(year, month) {
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const today = new Date();
        const monthNames = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
        monthYear.textContent = `${monthNames[month]} ${year}`;
        const lessonDates = new Set(lessonsData.map(item => item.date));
        const weekdays = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
        let html = weekdays.map(w => `<div class="weekday">${w}</div>`).join('');
        for (let i = 0; i < firstDay; i++) html += `<div class="day other-month"></div>`;
        for (let d = 1; d <= daysInMonth; d++) {
            const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const hasLesson = lessonDates.has(dateStr);
            let cls = 'day';
            if (hasLesson) cls += ' has-lesson';
            if (d === today.getDate() && month === today.getMonth() && year === today.getFullYear()) cls += ' today';
            const attr = hasLesson ? `data-date="${dateStr}"` : '';
            html += `<div class="${cls}" ${attr}>${d}${hasLesson ? '<span class="dot"></span>' : ''}</div>`;
        }
        calendarGrid.innerHTML = html;
    }

    function renderLessonsList(year, month) {
        const data = getLessonsForMonth(year, month);
        if (!data.length) {
            lessonsTableContainer.innerHTML = '<div class="no-lessons-msg">На этот месяц уроков нет.</div>';
            return;
        }

        let html = `
            <table class="lessons-table">
                <thead>
                    <tr>
                        <th class="col-date">Дата</th>
                        <th class="col-day">День</th>
                        <th class="col-student">Уч-к</th>
                        <th class="col-time">Время</th>
                        <th class="col-topic">Тема</th>
                        <th class="col-links">Ссылки</th>
                        <th class="col-done">Готово</th>
                    </tr>
                </thead>
                <tbody>
        `;

        data.forEach(item => {
            const dateObj = item.date;
            const day = String(dateObj.getDate()).padStart(2, '0');
            const monthNum = String(dateObj.getMonth() + 1).padStart(2, '0');
            const displayDate = `${day}.${monthNum}`;
            const dayName = dateObj.toLocaleDateString('ru-RU', { weekday: 'short' });

            item.lessons.forEach((l, idx) => {
                const studentId = l.student;
                const rowspan = idx === 0 ? item.lessons.length : 0;

                // === ГАЛОЧКИ ===
                const hwChecked = loadCheck(studentId, l.date, 'homework');
                const matChecked = loadCheck(studentId, l.date, 'material');

                const checkHtml = `
                    <td class="col-done">
                        <div class="inner-flex check-cell">
                            <label>
                                <input type="checkbox" class="check-done" data-student="${studentId}" data-date="${l.date}" data-type="homework" ${hwChecked ? 'checked' : ''} />
                                ДЗ
                            </label>
                            <label>
                                <input type="checkbox" class="check-done" data-student="${studentId}" data-date="${l.date}" data-type="material" ${matChecked ? 'checked' : ''} />
                                📚
                            </label>
                        </div>
                    </td>
                `;

                // === ССЫЛКИ ===
                let links = '';
                if (l.material) links += `<a href="${l.material}" target="_blank" title="Материал">📖</a>`;
                if (l.homework) {
                    const params = new URLSearchParams({
                        student: studentId,
                        date: l.date,
                        topic: l.topic || '',
                        start: l.start || '',
                        end: l.end || ''
                    });
                    const separator = l.homework.includes('?') ? '&' : '?';
                    links += `<a href="${l.homework}${separator}${params.toString()}" target="_blank" title="Домашка">📝</a>`;
                }

                html += `<tr>
                    ${rowspan ? `<td rowspan="${rowspan}" class="col-date">${displayDate}</td><td rowspan="${rowspan}" class="col-day">${dayName}</td>` : ''}
                    <td class="col-student">${getStudentName(studentId)}</td>
                    <td class="col-time">${l.start}–${l.end}</td>
                    <td class="col-topic topic-cell">${l.topic || '—'}</td>
                    <td class="col-links links-cell">
                        <div class="inner-flex">
                            ${links || '—'}
                        </div>
                    </td>
                    ${checkHtml}
                </tr>`;
            });
        });

        html += '</tbody></table>';
        lessonsTableContainer.innerHTML = html;

        // Обработчики для галочек
        document.querySelectorAll('.check-done').forEach(cb => {
            cb.addEventListener('change', function() {
                const student = this.dataset.student;
                const date = this.dataset.date;
                const type = this.dataset.type;
                saveCheck(student, date, type, this.checked);
            });
        });
    }

    function changeMonth(delta) {
        currentMonth += delta;
        if (currentMonth < 0) { currentMonth = 11; currentYear--; }
        if (currentMonth > 11) { currentMonth = 0; currentYear++; }
        renderCalendar(currentYear, currentMonth);
        renderLessonsList(currentYear, currentMonth);
    }

    prevMonthBtn.addEventListener('click', () => changeMonth(-1));
    nextMonthBtn.addEventListener('click', () => changeMonth(1));

    async function handleLogin() {
        const name = nameInput.value.trim();
        const password = passwordInput.value.trim();

        if (name.toLowerCase() !== 'алина') {
            loginError.textContent = '❌ Только для Алины';
            return;
        }
        if (password !== TEACHER_PASSWORD) {
            loginError.textContent = '❌ Неверный пароль';
            return;
        }

        loginError.textContent = '';
        await loadAllLessons();
        loginArea.style.display = 'none';
        mainContent.style.display = 'block';
        renderCalendar(currentYear, currentMonth);
        renderLessonsList(currentYear, currentMonth);
    }

    loginBtn.addEventListener('click', handleLogin);
    nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
    passwordInput.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });

    logoutBtn.addEventListener('click', () => {
        localStorage.clear();
        location.reload();
    });
</script>
</body>
</html>
