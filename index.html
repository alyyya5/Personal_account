<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вход</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(145deg, #f0f5fe 0%, #e8eefa 100%);
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px 12px;
            color: #1a2a3a;
        }

        /* ---------- Основной контейнер ---------- */
        .container {
            max-width: 400px;
            width: 100%;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            box-shadow: 0 16px 32px rgba(0, 20, 40, 0.06), 0 4px 12px rgba(0, 0, 0, 0.03);
            padding: 30px 28px 34px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            text-align: center;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #0b2a44;
            margin-bottom: 24px;
        }

        /* ---------- Форма входа ---------- */
        .login-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .login-area label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #1f4970;
            margin-bottom: 4px;
            width: 100%;
            text-align: left;
        }
        .login-area input {
            width: 100%;
            padding: 10px 16px;
            border: 2px solid #dce5ef;
            border-radius: 24px;
            font-size: 0.95rem;
            background: #f9fcff;
            outline: none;
            transition: 0.2s;
            text-align: center;
            margin-bottom: 14px;
        }
        .login-area input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.08);
        }
        .login-area button {
            background: #1e4663;
            border: none;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            padding: 10px 24px;
            border-radius: 24px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            margin-top: 4px;
        }
        .login-area button:hover { background: #0f3550; }
        .login-error {
            color: #dc2626;
            font-size: 0.85rem;
            margin-top: 10px;
            min-height: 1.2em;
        }

        /* ---------- Сайдбар (скрыт до входа) ---------- */
        .sidebar,
        .menu-btn,
        .main-content,
        .quick-links-container,
        .page {
            display: none;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🔐 Вход</h1>

    <div class="login-area" id="loginArea">
        <label for="nameInput">Имя</label>
        <input type="text" id="nameInput" placeholder="" />
        <label for="passwordInput">Пароль</label>
        <input type="password" id="passwordInput" placeholder="Введите пароль" />
        <button id="loginBtn">Войти</button>
        <span class="login-error" id="loginError"></span>
    </div>
</div>

<!-- Скрытый контент (появляется после входа) -->
<div id="hiddenContent" style="display: none;">
    <!-- Сайдбар -->
    <div class="sidebar" id="sidebar">
        <button class="close-btn" id="closeSidebar">&times;</button>
        <div class="logo">📅 Личный <span>кабинет</span></div>
        <button class="nav-item active" data-page="schedule">📋 Расписание</button>
        <button class="nav-item" data-page="materials">📚 Материалы</button>
        <button class="nav-item" data-page="homework">📝 Домашки</button>
        <button class="nav-item" data-page="progress">📊 Прогресс</button>
        <div class="user-info" id="sidebarUser">👤 <strong id="sidebarName">Загрузка...</strong></div>
    </div>

    <div class="overlay" id="overlay"></div>

    <div class="main-wrapper" id="mainWrapper">
        <div class="container main-content" id="mainContent">
            <button class="menu-btn" id="menuBtn">☰ Меню</button>
            <h1 id="pageTitle">📅 Личный кабинет</h1>

            <div class="quick-links-container">
                <a href="#" id="zoomBtn" target="_blank" class="quick-link-btn zoom-btn">📞 Звонок</a>
                <a href="#" id="boardBtn" target="_blank" class="quick-link-btn board-btn">📝 Доска</a>
            </div>

            <!-- Страницы -->
            <div class="page active" id="page-schedule">
                <div class="calendar-header">
                    <span class="month-year" id="monthYear"></span>
                    <div class="nav-buttons">
                        <button id="prevMonth">◀</button>
                        <button id="nextMonth">▶</button>
                    </div>
                </div>
                <div class="calendar-grid" id="calendarGrid"></div>
                <div class="lessons-list" id="lessonsList">
                    <h3>📋 Все уроки на месяц</h3>
                    <div id="lessonsTableContainer"></div>
                </div>
            </div>

            <div class="page" id="page-materials">
                <div class="materials-list">
                    <h3>📚 Все материалы</h3>
                    <div id="materialsContainer"></div>
                </div>
            </div>

            <div class="page" id="page-homework">
                <div class="homework-list">
                    <h3>📝 Все домашние задания</h3>
                    <div id="homeworkContainer"></div>
                </div>
            </div>

            <div class="page" id="page-progress">
                <div class="progress-page" id="progressPage">
                    <h3>📊 Мой прогресс</h3>
                    <div id="progressContainer"></div>
                </div>
                <div class="tests-page" id="testsPage">
                    <h3>📊 Результаты пробников</h3>
                    <div id="testsContainer"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Модалка -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
        <button class="close-btn" id="modalClose">&times;</button>
        <div class="modal-date" id="modalDate"></div>
        <div class="modal-time" id="modalTime"></div>
        <div class="modal-topic" id="modalTopic"></div>
        <div class="modal-links" id="modalLinks"></div>
    </div>
</div>

<script>
    // ============================================================
    //  🔐  ПАРОЛИ УЧЕНИКОВ
    // ============================================================
    const passwords = {
        'valeriya': 'der44',
        'amina': '5678',
        'denis': '1234',
        'alina': '121212'
    };

    const nameMap = {
        'валерия': 'valeriya',
        'лера': 'valeriya',
        'амина': 'amina',
        'денис': 'denis',
        'ден': 'denis',
        'алина': 'alina'
    };

    let currentStudentId = null;
    let currentStudentName = '';
    let currentDate = new Date();
    let currentMonth = currentDate.getMonth();
    let currentYear = currentDate.getFullYear();
    let lessonsData = [];
    let currentPage = 'schedule';

    // DOM
    const nameInput = document.getElementById('nameInput');
    const passwordInput = document.getElementById('passwordInput');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');
    const hiddenContent = document.getElementById('hiddenContent');
    const mainContent = document.getElementById('mainContent');
    const menuBtn = document.getElementById('menuBtn');
    const sidebar = document.getElementById('sidebar');
    const closeSidebar = document.getElementById('closeSidebar');
    const overlay = document.getElementById('overlay');
    const sidebarName = document.getElementById('sidebarName');
    const monthYear = document.getElementById('monthYear');
    const calendarGrid = document.getElementById('calendarGrid');
    const lessonsTableContainer = document.getElementById('lessonsTableContainer');
    const materialsContainer = document.getElementById('materialsContainer');
    const homeworkContainer = document.getElementById('homeworkContainer');
    const progressContainer = document.getElementById('progressContainer');
    const testsContainer = document.getElementById('testsContainer');
    const prevMonthBtn = document.getElementById('prevMonth');
    const nextMonthBtn = document.getElementById('nextMonth');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalClose = document.getElementById('modalClose');
    const modalDate = document.getElementById('modalDate');
    const modalTime = document.getElementById('modalTime');
    const modalTopic = document.getElementById('modalTopic');
    const modalLinks = document.getElementById('modalLinks');
    const pageTitle = document.getElementById('pageTitle');
    const zoomBtn = document.getElementById('zoomBtn');
    const boardBtn = document.getElementById('boardBtn');

    // ============================================================
    //  📂  САЙДБАР
    // ============================================================
    function toggleSidebar() {
        document.body.classList.toggle('sidebar-open');
        sidebar.classList.toggle('open');
        overlay.classList.toggle('show');
    }

    menuBtn.addEventListener('click', toggleSidebar);
    closeSidebar.addEventListener('click', toggleSidebar);
    overlay.addEventListener('click', toggleSidebar);

    document.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', function() {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            this.classList.add('active');
            switchPage(this.dataset.page);
            if (document.body.classList.contains('sidebar-open')) toggleSidebar();
        });
    });

    function switchPage(page) {
        currentPage = page;
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        const target = document.getElementById(`page-${page}`);
        if (target) target.classList.add('active');

        const titles = {
            'schedule': '📅 Расписание занятий',
            'materials': '📚 Материалы',
            'homework': '📝 Домашние задания',
            'progress': '📊 Мой прогресс'
        };
        pageTitle.textContent = titles[page] || '📅 Личный кабинет';

        if (page === 'materials') renderMaterials();
        if (page === 'homework') renderHomework();
        if (page === 'progress') renderProgressPage();
        if (page === 'schedule') {
            renderCalendar(currentYear, currentMonth);
            renderLessonsList(currentYear, currentMonth);
        }
    }

    // ============================================================
    //  🔗  БЫСТРЫЕ ССЫЛКИ
    // ============================================================
    function updateQuickLinks() {
        if (!currentStudentId || !lessonsData.length) {
            zoomBtn.style.display = 'none';
            boardBtn.style.display = 'none';
            return;
        }
        zoomBtn.style.display = 'inline-flex';
        boardBtn.style.display = 'inline-flex';

        const today = new Date();
        const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
        let todaysLesson = lessonsData.find(l => l.date === todayStr);

        if (!todaysLesson) {
            const pastLessons = lessonsData.filter(l => l.date < todayStr);
            if (pastLessons.length > 0) {
                pastLessons.sort((a, b) => b.date.localeCompare(a.date));
                todaysLesson = pastLessons[0];
            }
        }

        if (todaysLesson) {
            const zoomLink = todaysLesson.zoomLink || '';
            const boardLink = todaysLesson.boardLink || '';
            zoomBtn.href = zoomLink || '#';
            zoomBtn.style.opacity = zoomLink ? '1' : '0.4';
            zoomBtn.style.cursor = zoomLink ? 'pointer' : 'not-allowed';
            boardBtn.href = boardLink || '#';
            boardBtn.style.opacity = boardLink ? '1' : '0.4';
            boardBtn.style.cursor = boardLink ? 'pointer' : 'not-allowed';
        } else {
            zoomBtn.href = '#';
            boardBtn.href = '#';
            zoomBtn.style.opacity = '0.4';
            boardBtn.style.opacity = '0.4';
        }
    }

    // ============================================================
    //  📊  ПРОГРЕСС
    // ============================================================
    function renderProgress() {
        if (!lessonsData || lessonsData.length === 0) {
            progressContainer.innerHTML = '<p style="color:#6c86a3;font-size:0.75rem;">Нет данных об уроках.</p>';
            return;
        }
        const currentMonthStr = String(currentMonth + 1).padStart(2, '0');
        const currentYearStr = String(currentYear);
        const monthLessons = lessonsData.filter(item => {
            const dateParts = item.date.split('-');
            return dateParts[0] === currentYearStr && dateParts[1] === currentMonthStr;
        });
        if (monthLessons.length === 0) {
            progressContainer.innerHTML = '<p style="color:#6c86a3;font-size:0.75rem;">На этот месяц нет уроков.</p>';
            return;
        }
        const total = monthLessons.length;
        const completed = monthLessons.filter(item => item.topic && item.topic.trim() !== '').length;
        const percent = Math.round((completed / total) * 100);
        const topicsList = monthLessons.map((item) => {
            const dateParts = item.date.split('-');
            const day = dateParts[2];
            const topic = item.topic && item.topic.trim() !== '' ? item.topic : '—';
            const isCompleted = item.topic && item.topic.trim() !== '';
            return `
                <div style="display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid #f0f4fa; font-size:0.65rem;">
                    <span style="color:#4a627a;">${day}.${currentMonthStr}</span>
                    <span style="${isCompleted ? 'color:#16a34a;' : 'color:#dc2626;'}">
                        ${isCompleted ? '✅' : '⏳'} ${isCompleted ? topic : 'Тема не указана'}
                    </span>
                </div>
            `;
        }).join('');
        let html = `
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px;">
                <div style="background:#f0f7ff; border-radius:12px; padding:8px 12px;">
                    <div style="font-size:0.6rem; color:#4a627a;">Всего уроков</div>
                    <div style="font-size:1rem; font-weight:700; color:#0b2a44;">${total}</div>
                </div>
                <div style="background:#f0fdf4; border-radius:12px; padding:8px 12px;">
                    <div style="font-size:0.6rem; color:#4a627a;">Пройдено тем</div>
                    <div style="font-size:1rem; font-weight:700; color:#0b2a44;">${completed} / ${total}</div>
                    <div style="width:100%; height:6px; background:#e2e8f0; border-radius:4px; margin-top:4px;">
                        <div style="width:${percent}%; height:6px; background:#3b82f6; border-radius:4px;"></div>
                    </div>
                    <div style="font-size:0.55rem; color:#4a627a; margin-top:2px;">${percent}%</div>
                </div>
            </div>
            <div style="margin-top:6px; max-height:120px; overflow-y:auto; border-top:1px solid #e2e8f0; padding-top:6px;">
                ${topicsList}
            </div>
        `;
        progressContainer.innerHTML = html;
    }

    async function renderTests() {
        if (currentStudentId !== 'denis') {
            testsContainer.innerHTML = '';
            return;
        }
        try {
            const response = await fetch(`config/denis_tests.json?t=${Date.now()}`);
            if (!response.ok) throw new Error('Нет данных');
            const tests = await response.json();
            if (!tests || tests.length === 0) {
                testsContainer.innerHTML = '<p style="color:#6c86a3;font-size:0.75rem;">Пока нет данных о пробниках.</p>';
                return;
            }
            const totalScore = tests.reduce((sum, t) => sum + t.score, 0);
            const avg = Math.round(totalScore / tests.length);
            let html = `
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px;">
                    <div style="background:#f0f7ff; border-radius:12px; padding:8px 12px;">
                        <div style="font-size:0.6rem; color:#4a627a;">Всего пробников</div>
                        <div style="font-size:1rem; font-weight:700; color:#0b2a44;">${tests.length}</div>
                    </div>
                    <div style="background:#f0fdf4; border-radius:12px; padding:8px 12px;">
                        <div style="font-size:0.6rem; color:#4a627a;">Средний балл</div>
                        <div style="font-size:1rem; font-weight:700; color:#0b2a44;">${avg}</div>
                    </div>
                </div>
                <div style="margin-top:6px; max-height:120px; overflow-y:auto; border-top:1px solid #e2e8f0; padding-top:6px;">
                    ${tests.map(t => `
                        <div style="display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid #f0f4fa; font-size:0.65rem;">
                            <span style="color:#4a627a;">${t.name}</span>
                            <span style="font-weight:600; color:#0b2a44;">${t.score} / ${t.max}</span>
                        </div>
                    `).join('')}
                </div>
            `;
            testsContainer.innerHTML = html;
        } catch {
            testsContainer.innerHTML = '<p style="color:#6c86a3;font-size:0.75rem;">Нет данных о пробниках.</p>';
        }
    }

    function renderProgressPage() {
        renderProgress();
        renderTests();
    }

    // ============================================================
    //  📚  МАТЕРИАЛЫ
    // ============================================================
    function renderMaterials() {
        if (!lessonsData || lessonsData.length === 0) {
            materialsContainer.innerHTML = '<p style="color:#6c86a3;font-size:0.75rem;">Нет материалов.</p>';
            return;
        }
        const sorted = [...lessonsData].sort((a, b) => new Date(a.date) - new Date(b.date));
        const items = sorted.filter(l => l.material && l.material.trim() !== '');
        if (items.length === 0) {
            materialsContainer.innerHTML = '<p style="color:#6c86a3;font-size:0.75rem;">Нет материалов.</p>';
            return;
        }
        let html = '';
        items.forEach(l => {
            const dateParts = l.date.split('-');
            const displayDate = `${dateParts[2]}.${dateParts[1]}`;
            html += `
                <div class="material-item">
                    <span class="mat-date">${displayDate}</span>
                    <span class="mat-topic">${l.topic || 'Без темы'}</span>
                    <span class="mat-link"><a href="${l.material}" target="_blank">📖 Открыть</a></span>
                </div>
            `;
        });
        materialsContainer.innerHTML = html;
    }

    // ============================================================
    //  📝  ДОМАШКИ
    // ============================================================
    function renderHomework() {
        if (!lessonsData || lessonsData.length === 0) {
            homeworkContainer.innerHTML = '<p style="color:#6c86a3;font-size:0.75rem;">Нет домашних заданий.</p>';
            return;
        }
        const sorted = [...lessonsData].sort((a, b) => new Date(a.date) - new Date(b.date));
        const items = sorted.filter(l => l.homework && l.homework.trim() !== '');
        if (items.length === 0) {
            homeworkContainer.innerHTML = '<p style="color:#6c86a3;font-size:0.75rem;">Нет домашних заданий.</p>';
            return;
        }
        let html = '';
        items.forEach(l => {
            const dateParts = l.date.split('-');
            const displayDate = `${dateParts[2]}.${dateParts[1]}`;
            const hwKey = `hw_status_${currentStudentId}_${l.date}`;
            const status = localStorage.getItem(hwKey) || 'pending';
            const statusMap = {
                'pending': '<span class="hw-status pending">⏳ Не сделано</span>',
                'done': '<span class="hw-status done">✅ Сделано</span>',
                'checked': '<span class="hw-status checked">📝 Проверено</span>'
            };
            const hwLink = buildHomeworkLink(l.homework, currentStudentId, l);
            html += `
                <div class="hw-item">
                    <span class="hw-date">${displayDate}</span>
                    <span class="hw-topic">${l.topic || 'Без темы'}</span>
                    ${statusMap[status] || statusMap.pending}
                    <span class="hw-link">
                        <a href="${hwLink}" target="_blank">📝 Открыть</a>
                        <span class="hw-status-btns">
                            <button class="status-btn" data-date="${l.date}" data-status="pending" title="Не сделано">⏳</button>
                            <button class="status-btn" data-date="${l.date}" data-status="done" title="Сделано">✅</button>
                            <button class="status-btn" data-date="${l.date}" data-status="checked" title="Проверено">📝</button>
                        </span>
                    </span>
                </div>
            `;
        });
        homeworkContainer.innerHTML = html;

        document.querySelectorAll('.status-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const date = this.dataset.date;
                const status = this.dataset.status;
                const key = `hw_status_${currentStudentId}_${date}`;
                localStorage.setItem(key, status);
                renderHomework();
            });
        });
    }

    // ============================================================
    //  🛠  ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
    // ============================================================
    function buildHomeworkLink(basePath, studentId, lesson) {
        if (!basePath) return '';
        const params = new URLSearchParams({
            student: studentId,
            date: lesson.date,
            topic: lesson.topic || '',
            start: lesson.start || '',
            end: lesson.end || ''
        });
        return basePath + '?' + params.toString();
    }

    async function loadLessons(studentId) {
        try {
            const response = await fetch(`config/${studentId}.json`);
            if (!response.ok) throw new Error('Файл не найден');
            lessonsData = await response.json();
            return true;
        } catch {
            lessonsData = [];
            return false;
        }
    }

    // ============================================================
    //  🔑  ВХОД
    // ============================================================
    async function handleLogin() {
        const raw = nameInput.value.trim();
        const password = passwordInput.value.trim();
        if (!raw) { loginError.textContent = 'Введите имя'; return; }
        if (!password) { loginError.textContent = 'Введите пароль'; return; }
        const id = nameMap[raw.toLowerCase()];
        if (!id) { loginError.textContent = 'Ученик не найден'; return; }
        if (passwords[id] !== password) {
            loginError.textContent = '❌ Неверный пароль';
            return;
        }
        if (id === 'alina') {
            localStorage.setItem('teacherSession', JSON.stringify({ name: 'alina', time: Date.now() }));
            window.location.href = 'teacher.html';
            return;
        }
        loginError.textContent = '';
        currentStudentId = id;
        currentStudentName = raw;
        const ok = await loadLessons(id);
        if (!ok) { loginError.textContent = 'Нет расписания'; return; }

        // Скрываем форму входа, показываем основной контент
        document.querySelector('.container').style.display = 'none';
        hiddenContent.style.display = 'block';
        menuBtn.style.display = 'inline-flex';
        sidebarName.textContent = raw;

        // Инициализируем текущую страницу
        switchPage('schedule');
        updateQuickLinks();
    }

    loginBtn.addEventListener('click', handleLogin);
    nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
    passwordInput.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });

    // ============================================================
    //  📅  КАЛЕНДАРЬ
    // ============================================================
    function getLessonsForDate(dateStr) {
        return lessonsData.filter(item => item.date === dateStr);
    }

    function getLessonsForMonth(year, month) {
        const result = [];
        const days = new Date(year, month + 1, 0).getDate();
        for (let d = 1; d <= days; d++) {
            const dateObj = new Date(year, month, d);
            const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const dayLessons = lessonsData.filter(item => item.date === dateStr);
            if (dayLessons.length) result.push({ date: dateObj, lessons: dayLessons });
        }
        return result;
    }

    function renderCalendar(year, month) {
        const firstDay = new Date(year, month, 1).getDay();
        const startDay = (firstDay === 0) ? 6 : firstDay - 1;
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const today = new Date();
        const monthNames = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
        monthYear.textContent = `${monthNames[month]} ${year}`;
        const lessonDates = new Set(lessonsData.map(item => item.date));
        const weekdays = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
        let html = weekdays.map(w => `<div class="weekday">${w}</div>`).join('');
        for (let i = 0; i < startDay; i++) html += `<div class="day other-month"></div>`;
        for (let d = 1; d <= daysInMonth; d++) {
            const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const hasLesson = lessonDates.has(dateStr);
            let cls = 'day';
            if (hasLesson) cls += ' has-lesson';
            if (d === today.getDate() && month === today.getMonth() && year === today.getFullYear()) cls += ' today';
            const attr = hasLesson ? `data-date="${dateStr}"` : '';
            html += `<div class="${cls}" ${attr}>${d}${hasLesson ? '<span class="dot"></span>' : ''}</div>`;
        }
        calendarGrid.innerHTML = html;
        document.querySelectorAll('.day.has-lesson').forEach(el => {
            el.addEventListener('click', function() {
                const lessons = getLessonsForDate(this.dataset.date);
                if (lessons.length) showModal(this.dataset.date, lessons);
            });
        });
    }

    function showModal(dateStr, lessons) {
        const [y, m, d] = dateStr.split('-').map(Number);
        const dateObj = new Date(y, m-1, d);
        modalDate.textContent = dateObj.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        if (lessons.length === 1) {
            const l = lessons[0];
            modalTime.textContent = `${l.start}–${l.end}`;
            modalTopic.textContent = l.topic;
            let html = '';
            if (l.material) html += `<a href="${l.material}" target="_blank" class="secondary">📖 Материал</a>`;
            if (l.homework) {
                const hwLink = buildHomeworkLink(l.homework, currentStudentId, l);
                html += `<a href="${hwLink}" target="_blank">📝 Домашка</a>`;
            }
            modalLinks.innerHTML = html || '<span style="color:#6c86a3;">Нет ссылок</span>';
        } else {
            let time = '', topic = '', links = '';
            lessons.forEach((l, i) => {
                time += `${l.start}–${l.end}` + (i < lessons.length-1 ? ', ' : '');
                topic += l.topic + (i < lessons.length-1 ? ', ' : '');
                if (l.material) links += `<a href="${l.material}" target="_blank" class="secondary">📖 ${i+1}</a>`;
                if (l.homework) {
                    const hwLink = buildHomeworkLink(l.homework, currentStudentId, l);
                    links += `<a href="${hwLink}" target="_blank">📝 ${i+1}</a>`;
                }
            });
            modalTime.textContent = time;
            modalTopic.textContent = topic;
            modalLinks.innerHTML = links || '<span style="color:#6c86a3;">Нет ссылок</span>';
        }
        modalOverlay.classList.add('active');
    }

    modalClose.addEventListener('click', () => modalOverlay.classList.remove('active'));
    modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) modalOverlay.classList.remove('active'); });

    // ============================================================
    //  📋  СПИСОК УРОКОВ
    // ============================================================
    function renderLessonsList(year, month) {
        const data = getLessonsForMonth(year, month);
        if (!data.length) {
            lessonsTableContainer.innerHTML = '<div class="no-lessons-msg">На этот месяц уроков нет.</div>';
            return;
        }
        let html = `
            <table class="lessons-table">
                <thead>
                    <tr>
                        <th class="col-date">Дата</th>
                        <th class="col-day">День</th>
                        <th class="col-time">Время</th>
                        <th class="col-topic">Тема</th>
                        <th class="col-links">Ссылки</th>
                    </tr>
                </thead>
                <tbody>
        `;
        data.forEach(item => {
            const dateObj = item.date;
            const day = String(dateObj.getDate()).padStart(2, '0');
            const monthNum = String(dateObj.getMonth() + 1).padStart(2, '0');
            const displayDate = `${day}.${monthNum}`;
            const dayName = dateObj.toLocaleDateString('ru-RU', { weekday: 'short' });
            item.lessons.forEach((l, idx) => {
                let links = '';
                if (l.material) links += `<a href="${l.material}" target="_blank" title="Материал">📖</a>`;
                if (l.homework) {
                    const hwLink = buildHomeworkLink(l.homework, currentStudentId, l);
                    links += `<a href="${hwLink}" target="_blank" title="Домашка">📝</a>`;
                }
                const rowspan = idx === 0 ? item.lessons.length : 0;
                html += `<tr>
                    ${rowspan ? `<td rowspan="${rowspan}" class="col-date">${displayDate}</td><td rowspan="${rowspan}" class="col-day">${dayName}</td>` : ''}
                    <td class="col-time">${l.start}–${l.end}</td>
                    <td class="col-topic topic-cell">${l.topic}</td>
                    <td class="col-links links-cell">
                        <div class="inner-flex">
                            ${links || '—'}
                        </div>
                    </td>
                </tr>`;
            });
        });
        html += '</tbody></table>';
        lessonsTableContainer.innerHTML = html;
    }

    function changeMonth(delta) {
        currentMonth += delta;
        if (currentMonth < 0) { currentMonth = 11; currentYear--; }
        if (currentMonth > 11) { currentMonth = 0; currentYear++; }
        if (currentPage === 'schedule') {
            renderCalendar(currentYear, currentMonth);
            renderLessonsList(currentYear, currentMonth);
        }
        if (currentPage === 'progress') renderProgressPage();
    }

    prevMonthBtn.addEventListener('click', () => changeMonth(-1));
    nextMonthBtn.addEventListener('click', () => changeMonth(1));

    window.addEventListener('DOMContentLoaded', async () => {
        const p = new URLSearchParams(window.location.search);
        const s = p.get('student');
        if (s) {
            const id = nameMap[s.toLowerCase()];
            if (id) {
                nameInput.value = s;
            }
        }
    });
</script>
</body>
</html>
