<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Обновление системы</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #0b0d15 0%, #141824 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      padding: 1.5rem;
    }

    .update-card {
      background: rgba(22, 28, 46, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 56px;
      padding: 3.5rem 4rem;
      max-width: 700px;
      width: 100%;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.04) inset;
      text-align: center;
      transition: all 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .icon-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .gear-svg {
      width: 72px;
      height: 72px;
      color: #4f9cf7;
      animation: spin 4s linear infinite;
      filter: drop-shadow(0 0 12px rgba(79, 156, 247, 0.35));
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    h1 {
      font-size: 2.4rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #f0f4ff;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #f0f4ff 0%, #b6cbff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subhead {
      font-size: 1.1rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.65);
      margin-bottom: 2.2rem;
      letter-spacing: 0.3px;
      line-height: 1.5;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 1.8rem;
    }

    .progress-area {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      margin-bottom: 2.5rem;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 40px;
      overflow: hidden;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.4);
    }

    .progress-fill {
      width: 67%;
      height: 100%;
      background: linear-gradient(90deg, #4f9cf7, #7b6cf0, #a855f7);
      border-radius: 40px;
      animation: pulse-width 2.2s ease-in-out infinite alternate;
      box-shadow: 0 0 14px rgba(79, 156, 247, 0.4);
    }

    @keyframes pulse-width {
      0% { width: 58%; }
      100% { width: 82%; }
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 0.2px;
    }

    .status-row span:last-child {
      color: rgba(255, 255, 255, 0.7);
      font-weight: 500;
    }

    .message-block {
      background: rgba(0, 0, 0, 0.25);
      border-radius: 40px;
      padding: 0.9rem 1.6rem;
      margin: 1.8rem 0 2rem;
      border-left: 3px solid #4f9cf7;
      text-align: left;
      backdrop-filter: blur(4px);
    }

    .message-block p {
      color: rgba(255, 255, 255, 0.8);
      font-size: 1rem;
      font-weight: 350;
      line-height: 1.5;
    }

    .message-block strong {
      color: #b6cbff;
      font-weight: 500;
    }

    .dots {
      display: inline-flex;
      gap: 6px;
      margin-left: 6px;
    }

    .dots span {
      width: 8px;
      height: 8px;
      background: #7b9eff;
      border-radius: 50%;
      display: inline-block;
      animation: bounce-dot 1.6s infinite ease-in-out;
    }

    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce-dot {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
      40% { transform: scale(1); opacity: 1; }
    }

    .footer-note {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.2);
      letter-spacing: 0.5px;
      margin-top: 1.2rem;
      text-transform: uppercase;
      font-weight: 400;
    }

    .badge {
      display: inline-block;
      background: rgba(79, 156, 247, 0.12);
      padding: 0.25rem 1rem;
      border-radius: 60px;
      font-size: 0.75rem;
      color: #7b9eff;
      border: 1px solid rgba(79, 156, 247, 0.15);
      margin-bottom: 1.2rem;
      backdrop-filter: blur(2px);
    }

    /* адаптив */
    @media (max-width: 480px) {
      .update-card {
        padding: 2.5rem 1.8rem;
        border-radius: 40px;
      }
      h1 {
        font-size: 1.9rem;
      }
      .gear-svg {
        width: 60px;
        height: 60px;
      }
    }
  </style>
</head>
<body>

<div class="update-card">
  
  <!-- значок шестерёнки (анимированная) -->
  <div class="icon-wrapper">
    <svg class="gear-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2L14.5 4.5L18 3L19 6.5L22 8L20.5 11.5L22 15L19 16.5L18 20L14.5 19L12 21.5L9.5 19L6 20L5 16.5L2 15L3.5 11.5L2 8L5 6.5L6 3L9.5 4.5L12 2Z" />
      <circle cx="12" cy="12" r="3.5" stroke="currentColor" />
    </svg>
  </div>

  <!-- заголовок -->
  <h1>Обновление</h1>
  <div class="badge">стабильная версия</div>
  <div class="subhead">
    Мы работаем над улучшениями<br />
    Скоро всё заработает ещё лучше
  </div>

  <!-- прогресс -->
  <div class="progress-area">
    <div class="progress-track">
      <div class="progress-fill"></div>
    </div>
    <div class="status-row">
      <span>Подготовка данных</span>
      <span>~ 2 мин.</span>
    </div>
  </div>

  <!-- сообщение с анимацией точек -->
  <div class="message-block">
    <p>
      <strong>⏳ Идёт обновление</strong>
      <span class="dots">
        <span></span>
        <span></span>
        <span></span>
      </span>
      <br />
      <span style="font-size: 0.95rem; opacity: 0.7;">Пожалуйста, не закрывайте страницу</span>
    </p>
  </div>

  <!-- доп. подпись -->
  <div class="footer-note">
    Система автоматически перезагрузится
  </div>
</div>

</body>
</html>
