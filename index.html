<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-start: #eaf3ff; --bg-middle: #eef0ff; --bg-end: #e8e1ff;
            --sidebar-bg: rgba(255, 255, 255, 0.78);
            --card-bg: rgba(255, 255, 255, 0.82); --card-hover: rgba(255, 255, 255, 0.95);
            --text-primary: #263247; --text-secondary: #657087; --text-muted: #99a3b5;
            --border-color: rgba(110, 128, 170, 0.16);
            --accent-blue: #3567c9; --accent-purple: #6d54c7;
            --accent-green: #2f9d68; --accent-orange: #d98a26; --accent-red: #d85c5c;
            --shadow-sm: 0 4px 14px rgba(56, 72, 110, 0.08);
            --shadow-md: 0 12px 35px rgba(56, 72, 110, 0.12);
            --shadow-lg: 0 20px 60px rgba(56, 72, 110, 0.16);
            --radius-sm: 14px; --radius-md: 20px; --radius-lg: 28px;
        }
        body.dark-mode {
            --bg-start: #151b2d; --bg-middle: #1c2238; --bg-end: #292040;
            --sidebar-bg: rgba(28, 34, 56, 0.88);
            --card-bg: rgba(38, 47, 72, 0.88); --card-hover: rgba(46, 56, 84, 0.96);
            --text-primary: #edf2ff; --text-secondary: #b9c3d8; --text-muted: #7f8aa3;
            --border-color: rgba(173, 188, 225, 0.12);
            --shadow-sm: 0 5px 18px rgba(0, 0, 0, 0.20);
            --shadow-md: 0 14px 40px rgba(0, 0, 0, 0.28);
            --shadow-lg: 0 25px 70px rgba(0, 0, 0, 0.40);
        }
        body { min-height: 100vh; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color: var(--text-primary); background: radial-gradient(circle at 10% 10%, rgba(103, 157, 255, 0.20), transparent 30%), radial-gradient(circle at 90% 15%, rgba(154, 111, 255, 0.18), transparent 32%), linear-gradient(135deg, var(--bg-start), var(--bg-middle), var(--bg-end)); background-attachment: fixed; overflow-x: hidden; }
        button, input { font: inherit; }
        button { -webkit-tap-highlight-color: transparent; }
        
        /* Математические символы на фоне */
        .math-symbol {
            position: fixed;
            font-weight: 400;
            color: rgba(80, 100, 160, 0.15);
            pointer-events: none;
            z-index: -1;
            font-family: 'Times New Roman', serif;
            user-select: none;
        }
        body.dark-mode .math-symbol {
            color: rgba(130, 150, 200, 0.12);
        }
        .math-1 { top: 3%; left: 3%; font-size: 140px; transform: rotate(-15deg); }
        .math-2 { top: 8%; right: 5%; font-size: 110px; transform: rotate(25deg); }
        .math-3 { top: 25%; left: 15%; font-size: 90px; transform: rotate(-8deg); }
        .math-4 { top: 35%; right: 10%; font-size: 130px; transform: rotate(12deg); }
        .math-5 { top: 50%; left: 5%; font-size: 100px; transform: rotate(-20deg); }
        .math-6 { top: 55%; right: 15%; font-size: 120px; transform: rotate(18deg); }
        .math-7 { bottom: 30%; left: 20%; font-size: 95px; transform: rotate(-12deg); }
        .math-8 { bottom: 25%; right: 8%; font-size: 115px; transform: rotate(22deg); }
        .math-9 { bottom: 15%; left: 10%; font-size: 105px; transform: rotate(-18deg); }
        .math-10 { bottom: 10%; right: 20%; font-size: 125px; transform: rotate(15deg); }
        .math-11 { top: 15%; left: 40%; font-size: 85px; transform: rotate(-5deg); opacity: 0.12; }
        .math-12 { top: 45%; left: 45%; font-size: 95px; transform: rotate(10deg); opacity: 0.10; }
        .math-13 { bottom: 40%; left: 40%; font-size: 110px; transform: rotate(-25deg); opacity: 0.11; }
        
        .sidebar { position: fixed; top: 18px; left: 18px; bottom: 18px; width: 250px; padding: 22px 16px; display: none; flex-direction: column; background: var(--sidebar-bg); backdrop-filter: blur(20px); border: 1px solid var(--border-color); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); z-index: 100; transition: transform 0.3s ease, background 0.3s ease; }
        .sidebar.open { display: flex; }
        .sidebar-logo { display: flex; align-items: center; gap: 12px; padding: 8px 12px 22px; margin-bottom: 18px; border-bottom: 1px solid var(--border-color); }
        .logo-icon { width: 42px; height: 42px; border-radius: 13px; display: flex; align-items: center; justify-content: center; color: white; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); box-shadow: 0 7px 18px rgba(66, 93, 180, 0.25); }
        .logo-icon svg { width: 24px; height: 24px; fill: white; }
        .logo-text { font-size: 1.12rem; font-weight: 800; line-height: 1.2; color: var(--text-primary); }
        .nav-list { display: flex; flex-direction: column; gap: 7px; }
        .nav-item { width: 100%; display: flex; align-items: center; gap: 13px; padding: 13px 14px; border: none; border-radius: 14px; background: transparent; color: var(--text-secondary); text-align: left; font-weight: 650; font-size: 0.96rem; cursor: pointer; transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease; }
        .nav-item:hover { background: rgba(86, 116, 190, 0.08); color: var(--accent-blue); }
        .nav-item.active { color: white; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); box-shadow: 0 8px 20px rgba(65, 88, 180, 0.22); }
        .nav-icon { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }
        .nav-icon svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .sidebar-bottom { margin-top: auto; }
        .theme-toggle { width: 100%; display: flex; align-items: center; justify-content: center; gap: 9px; padding: 13px; border: 1px solid var(--border-color); border-radius: 14px; background: rgba(100, 125, 185, 0.07); color: var(--text-secondary); font-weight: 650; cursor: pointer; transition: all 0.2s ease; }
        .theme-toggle:hover { transform: translateY(-2px); color: var(--accent-blue); background: rgba(89, 112, 185, 0.12); }
        .sidebar-toggle { display: none; position: fixed; top: 14px; left: 14px; width: 44px; height: 44px; border: none; border-radius: 13px; background: white; color: var(--accent-blue); font-size: 1.3rem; box-shadow: var(--shadow-md); cursor: pointer; z-index: 200; }
        .main-wrapper { width: 100%; min-width: 0; padding: 28px 32px 40px; }
        .main-wrapper.with-sidebar { width: calc(100% - 285px); margin-left: 285px; }
        .container { width: 100%; min-width: 0; max-width: 1500px; margin: 0 auto; }
        .login-wrapper { min-height: calc(100vh - 56px); display: flex; align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 410px; padding: 42px 38px; background: var(--card-bg); backdrop-filter: blur(20px); border: 1px solid var(--border-color); border-radius: 28px; box-shadow: var(--shadow-lg); }
        .login-logo { width: 58px; height: 58px; margin: 0 auto 18px; display: flex; align-items: center; justify-content: center; border-radius: 18px; color: white; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); }
        .login-logo svg { width: 32px; height: 32px; fill: white; }
        .login-title { font-size: 1.7rem; font-weight: 800; text-align: center; color: var(--text-primary); }
        .login-subtitle { margin-top: 8px; margin-bottom: 30px; color: var(--text-secondary); text-align: center; font-size: 0.94rem; }
        .login-area { display: flex; flex-direction: column; gap: 18px; }
        .login-label { display: block; margin-bottom: 8px; color: var(--text-primary); font-size: 0.9rem; font-weight: 700; }
        .login-input { width: 100%; padding: 14px 16px; border: 1px solid var(--border-color); border-radius: 13px; background: rgba(255, 255, 255, 0.55); color: var(--text-primary); outline: none; transition: border-color 0.2s, box-shadow 0.2s, background 0.2s; }
        body.dark-mode .login-input { background: rgba(0, 0, 0, 0.12); }
        .login-input:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 4px rgba(53, 103, 201, 0.12); }
        .login-btn { width: 100%; margin-top: 4px; padding: 14px; border: none; border-radius: 14px; color: white; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); font-weight: 750; font-size: 1rem; cursor: pointer; box-shadow: 0 8px 20px rgba(66, 89, 180, 0.25); transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(66, 89, 180, 0.32); }
        .login-error { min-height: 1.2em; text-align: center; color: var(--accent-red); font-size: 0.9rem; font-weight: 600; }
        .top-bar { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 26px; flex-wrap: wrap; }
        .welcome-block h1 { font-size: clamp(1.7rem, 3vw, 2.25rem); font-weight: 850; letter-spacing: -0.03em; }
        .welcome-block p { margin-top: 7px; color: var(--text-secondary); font-size: 0.98rem; }
        .quick-links-container { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .quick-link-btn { min-width: 145px; display: inline-flex; align-items: center; justify-content: center; gap: 9px; padding: 13px 20px; border-radius: 15px; text-decoration: none; font-weight: 750; transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s; }
        .quick-link-btn:hover { transform: translateY(-2px); }
        .zoom-btn { color: var(--accent-blue); background: rgba(255, 255, 255, 0.70); border: 1px solid rgba(53, 103, 201, 0.18); box-shadow: var(--shadow-sm); }
        .board-btn { color: var(--accent-purple); background: rgba(255, 255, 255, 0.70); border: 1px solid rgba(109, 84, 199, 0.18); box-shadow: var(--shadow-sm); }
        .page { display: none; }
        .page.active { display: block; }
        .section-title { margin-bottom: 20px; font-size: 1.35rem; font-weight: 800; }
        .calendar-wrapper { padding: 26px; background: var(--card-bg); backdrop-filter: blur(16px); border: 1px solid var(--border-color); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); }
        .calendar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; flex-wrap: wrap; gap: 12px; }
        .calendar-title { display: flex; align-items: center; gap: 12px; }
        .calendar-icon { width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; border-radius: 13px; color: var(--accent-blue); background: rgba(53, 103, 201, 0.09); }
        .calendar-icon svg { width: 22px; height: 22px; stroke: var(--accent-blue); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .calendar-title-text { display: flex; flex-direction: column; gap: 2px; }
        .calendar-title-text span:first-child { font-size: 1.05rem; font-weight: 800; }
        .month-year { color: var(--text-secondary); font-size: 0.88rem; font-weight: 650; }
        .nav-buttons { display: flex; gap: 8px; }
        .nav-buttons button { width: 40px; height: 40px; border: 1px solid var(--border-color); border-radius: 12px; background: rgba(255, 255, 255, 0.55); color: var(--text-primary); font-size: 0.95rem; font-weight: 750; cursor: pointer; transition: transform 0.2s, background 0.2s, color 0.2s; }
        body.dark-mode .nav-buttons button { background: rgba(255, 255, 255, 0.04); }
        .nav-buttons button:hover { transform: translateY(-2px); background: rgba(53, 103, 201, 0.09); color: var(--accent-blue); }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
        .weekday { padding: 9px 0; color: var(--text-muted); text-align: center; font-size: 0.78rem; font-weight: 750; }
        .day { position: relative; min-height: 66px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 14px; color: var(--text-primary); font-weight: 650; background: rgba(255, 255, 255, 0.36); border: 1px solid transparent; transition: transform 0.2s, background 0.2s, box-shadow 0.2s; }
        body.dark-mode .day { background: rgba(255, 255, 255, 0.035); }
        .day.other-month { opacity: 0.28; }
        .day.has-lesson { cursor: pointer; color: white; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); box-shadow: 0 7px 16px rgba(65, 88, 180, 0.20); }
        body.dark-mode .day.has-lesson { background: linear-gradient(135deg, #4a6fd6, #7b68d6); border: 1px solid rgba(150, 170, 255, 0.3); }
        .day.has-lesson:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 12px 24px rgba(65, 88, 180, 0.28); }
        .day.today:not(.has-lesson) { border-color: var(--accent-blue); color: var(--accent-blue); font-weight: 800; }
        .day.today.has-lesson { border: 2px solid white; box-shadow: 0 0 0 3px var(--accent-blue), 0 7px 16px rgba(65, 88, 180, 0.20); }
        .day .dot { width: 5px; height: 5px; margin-top: 5px; border-radius: 50%; background: white; }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
        .hw-card, .mat-card { min-height: 210px; display: flex; flex-direction: column; padding: 21px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease; }
        .hw-card:hover, .mat-card:hover { transform: translateY(-4px); background: var(--card-hover); box-shadow: var(--shadow-md); }
        .card-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .card-date { padding: 7px 11px; border-radius: 10px; color: var(--accent-blue); background: rgba(53, 103, 201, 0.09); font-size: 0.86rem; font-weight: 800; }
        .card-status { padding: 7px 10px; border-radius: 10px; font-size: 0.78rem; font-weight: 750; white-space: nowrap; }
        .card-status.pending { color: #c0392b; background: rgba(216, 92, 92, 0.15); }
        .card-status.done { color: var(--accent-blue); background: rgba(53, 103, 201, 0.10); }
        .card-status.checked { color: #1e8449; background: rgba(47, 157, 104, 0.18); }
        .card-topic { margin-top: 18px; flex: 1; color: var(--text-primary); font-size: 1rem; font-weight: 750; line-height: 1.45; }
        .card-btn { width: 100%; display: block; margin-top: 18px; padding: 12px; border-radius: 12px; text-align: center; text-decoration: none; color: white; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); font-size: 0.9rem; font-weight: 750; box-shadow: 0 5px 14px rgba(65, 88, 180, 0.18); transition: transform 0.2s, box-shadow 0.2s; }
        .card-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(65, 88, 180, 0.28); }
        .show-more-btn { display: block; width: 100%; max-width: 300px; margin: 24px auto 0; padding: 13px 20px; border: 1px solid rgba(53, 103, 201, 0.20); border-radius: 14px; background: rgba(255, 255, 255, 0.55); color: var(--accent-blue); font-weight: 750; cursor: pointer; box-shadow: var(--shadow-sm); transition: transform 0.2s, background 0.2s; }
        .show-more-btn:hover { transform: translateY(-2px); background: rgba(53, 103, 201, 0.08); }
        .progress-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; margin-bottom: 22px; }
        .stat-card { position: relative; overflow: hidden; padding: 24px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); transition: transform 0.2s, box-shadow 0.2s; }
        .stat-card::after { content: ""; position: absolute; width: 100px; height: 100px; border-radius: 50%; right: -35px; top: -45px; background: rgba(84, 106, 210, 0.06); }
        .stat-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
        .stat-value { position: relative; z-index: 1; margin-bottom: 8px; color: var(--accent-blue); font-size: 2.45rem; font-weight: 850; line-height: 1; }
        .stat-label { position: relative; z-index: 1; margin-bottom: 5px; color: var(--text-primary); font-size: 1rem; font-weight: 750; }
        .stat-sublabel { position: relative; z-index: 1; color: var(--text-secondary); font-size: 0.84rem; }
        .charts-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .chart-card { padding: 24px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); }
        .chart-card h3 { margin-bottom: 20px; color: var(--text-primary); font-size: 1rem; font-weight: 800; }
        .modal-overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(23, 30, 52, 0.45); backdrop-filter: blur(7px); z-index: 1000; }
        .modal-overlay.active { display: flex; }
        .modal-card { position: relative; width: 100%; max-width: 470px; padding: 30px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 25px; box-shadow: var(--shadow-lg); animation: modalShow 0.25s ease; }
        @keyframes modalShow { from { opacity: 0; transform: translateY(14px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .close-btn { position: absolute; top: 15px; right: 17px; width: 36px; height: 36px; border: none; border-radius: 10px; background: rgba(80, 95, 140, 0.08); color: var(--text-secondary); font-size: 1.3rem; cursor: pointer; transition: all 0.2s; }
        .close-btn:hover { color: var(--accent-red); transform: rotate(90deg); }
        .modal-date { margin-bottom: 10px; color: var(--text-secondary); font-size: 0.9rem; font-weight: 650; }
        .modal-time { color: var(--accent-blue); font-size: 1.25rem; font-weight: 850; }
        .modal-topic { margin: 13px 0 22px; color: var(--text-primary); font-size: 1.12rem; font-weight: 750; line-height: 1.45; }
        .modal-links { display: flex; flex-wrap: wrap; gap: 10px; }
        .modal-links a { display: inline-flex; align-items: center; justify-content: center; padding: 11px 17px; border-radius: 12px; text-decoration: none; color: white; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); font-size: 0.9rem; font-weight: 750; transition: transform 0.2s, box-shadow 0.2s; }
        .modal-links a:hover { transform: translateY(-2px); }
        .modal-links a.secondary { color: var(--accent-blue); background: rgba(53, 103, 201, 0.10); }
        .empty-message { grid-column: 1 / -1; padding: 35px 20px; text-align: center; color: var(--text-secondary); background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-md); }
        @media (max-width: 950px) {
            .sidebar { transform: translateX(-120%); }
            .sidebar.open { transform: translateX(0); }
            .sidebar-toggle { display: flex; align-items: center; justify-content: center; }
            .main-wrapper { width: 100%; margin-left: 0; padding: 78px 18px 30px; }
            .main-wrapper.with-sidebar { width: 100%; margin-left: 0; }
            .sidebar { top: 10px; left: 10px; bottom: 10px; }
            .math-symbol { font-size: 80px; }
        }
        @media (max-width: 700px) {
            .top-bar { flex-direction: column; gap: 18px; }
            .quick-links-container { width: 100%; }
            .quick-link-btn { flex: 1; min-width: 0; }
            .calendar-wrapper { padding: 18px 12px; }
            .calendar-header { padding: 0 6px; }
            .calendar-title-text span:first-child { font-size: 0.95rem; }
            .day { min-height: 52px; font-size: 0.9rem; }
            .calendar-grid { gap: 5px; }
            .weekday { font-size: 0.68rem; }
            .math-symbol { display: none; }
        }
        @media (max-width: 500px) {
            .main-wrapper { padding-left: 10px; padding-right: 10px; }
            .login-card { padding: 35px 22px; }
            .quick-link-btn { padding: 12px 10px; font-size: 0.88rem; }
            .calendar-title { gap: 8px; }
            .calendar-icon { width: 36px; height: 36px; }
            .day { min-height: 45px; border-radius: 10px; font-size: 0.82rem; }
            .charts-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <!-- Математические символы на фоне -->
    <div class="math-symbol math-1">π</div>
    <div class="math-symbol math-2">∫</div>
    <div class="math-symbol math-3">e</div>
    <div class="math-symbol math-4">x²</div>
    <div class="math-symbol math-5">D</div>
    <div class="math-symbol math-6">∑</div>
    <div class="math-symbol math-7">√</div>
    <div class="math-symbol math-8"></div>
    <div class="math-symbol math-9">Δ</div>
    <div class="math-symbol math-10">∂</div>
    <div class="math-symbol math-11">±</div>
    <div class="math-symbol math-12">≈</div>
    <div class="math-symbol math-13">≠</div>
    
    <button class="sidebar-toggle" id="sidebarToggle" title="Меню">☰</button>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg>
            </div>
            <div class="logo-text">Личный<br>кабинет</div>
        </div>
        <div class="nav-list">
            <button class="nav-item active" data-page="schedule">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                </span>
                Расписание
            </button>
            <button class="nav-item" data-page="homework">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                </span>
                Домашки
            </button>
            <button class="nav-item" data-page="materials">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
                </span>
                Материалы
            </button>
            <button class="nav-item" data-page="progress">

        const passwords = { 'valeriya': 'der44', 'amina': '5678', 'denis': '1234', 'alina': '121212' };

        let currentStudentId = null, currentDate = new Date(), currentMonth = currentDate.getMonth(), currentYear = currentDate.getFullYear();
        let lessonsData = [], testsData = [], currentPage = 'schedule', showAllHomework = false, showAllMaterials = false, charts = {};
        const nameInput = document.getElementById('nameInput'), passwordInput = document.getElementById('passwordInput'), loginBtn = document.getElementById('loginBtn'), loginError = document.getElementById('loginError'), loginWrapper = document.getElementById('loginWrapper'), mainContent = document.getElementById('mainContent'), mainWrapper = document.getElementById('mainWrapper'), sidebar = document.getElementById('sidebar'), sidebarToggle = document.getElementById('sidebarToggle'), monthYear = document.getElementById('monthYear'), calendarGrid = document.getElementById('calendarGrid'), homeworkCards = document.getElementById('homeworkCards'), materialsCards = document.getElementById('materialsCards'), progressStats = document.getElementById('progressStats'), chartsContainer = document.getElementById('chartsContainer'), prevMonthBtn = document.getElementById('prevMonth'), nextMonthBtn = document.getElementById('nextMonth'), modalOverlay = document.getElementById('modalOverlay'), modalClose = document.getElementById('modalClose'), modalDate = document.getElementById('modalDate'), modalTime = document.getElementById('modalTime'), modalTopic = document.getElementById('modalTopic'), modalLinks = document.getElementById('modalLinks'), pageTitle = document.getElementById('pageTitle'), pageSubtitle = document.getElementById('pageSubtitle'), zoomBtn = document.getElementById('zoomBtn'), boardBtn = document.getElementById('boardBtn'), quickLinks = document.getElementById('quickLinks'), themeToggle = document.getElementById('themeToggle'), showAllHomeworkBtn = document.getElementById('showAllHomework'), showAllMaterialsBtn = document.getElementById('showAllMaterials');

        function updateWelcome() {

            if (!studentName) return;

            const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
            
            const todaysLessons = lessonsData

                if (futureLessons.length > 0) {
                    const nextLesson = futureLessons[0];

            };

            if (page === 'schedule') {
                updateWelcome();
                renderCalendar(currentYear, currentMonth);
            } else if (page === 'homework') {
                pageTitle.textContent = titles.homework.title;
                pageSubtitle.textContent = titles.homework.subtitle;
                renderHomeworkCards();
            } else if (page === 'materials') {
                pageTitle.textContent = titles.materials.title;
                pageSubtitle.textContent = titles.materials.subtitle;
                renderMaterialsCards();
            } else if (page === 'progress') {
                pageTitle.textContent = titles.progress.title;
                pageSubtitle.textContent = titles.progress.subtitle;
                renderProgressPage();
            }
        }

        function updateQuickLinks() { 
            if (!currentStudentId || !lessonsData.length) { quickLinks.style.display = 'none'; return; } 
            quickLinks.style.display = 'flex'; 
            const today = new Date(), todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`; 
            let todaysLesson = lessonsData.find(l => l.date === todayStr) || lessonsData.filter(l => l.date < todayStr).sort((a, b) => b.date.localeCompare(a.date))[0]; 
            if (todaysLesson) { 
                zoomBtn.href = todaysLesson.zoomLink || '#'; 
                zoomBtn.style.opacity = todaysLesson.zoomLink ? '1' : '0.45'; 
                boardBtn.href = todaysLesson.boardLink || '#'; 
                boardBtn.style.opacity = todaysLesson.boardLink ? '1' : '0.45'; 
            } else { 
                zoomBtn.href = '#'; boardBtn.href = '#'; 
                zoomBtn.style.opacity = '0.45'; boardBtn.style.opacity = '0.45'; 
            } 
        }

        async function renderProgressPage() { 
            if (!lessonsData.length) { progressStats.innerHTML = '<div class="empty-message">Нет данных</div>'; chartsContainer.innerHTML = ''; return; } 
            const today = new Date(), todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`, pastLessons = lessonsData.filter(l => l.date <= todayStr && l.topic && l.topic.trim() !== ''), hwLessons = pastLessons.filter(l => l.homework && l.homework.trim() !== ''); 
            let completedHw = 0; 
            hwLessons.forEach(l => { if (l.hwStatus === 'done' || l.hwStatus === 'checked' || l.hwStatus === 'Проверено' || l.hwStatus === 'Не проверено') completedHw++; }); 
            const currentMonthStr = String(currentMonth + 1).padStart(2, '0'), currentYearStr = String(currentYear), monthCompleted = pastLessons.filter(l => l.date.startsWith(`${currentYearStr}-${currentMonthStr}`)).length; 
            if (currentStudentId === 'denis') { try { const res = await fetch(`config/denis_tests.json?t=${Date.now()}`); if (res.ok) testsData = await res.json(); else testsData = []; } catch (e) { testsData = []; } } 
            let statsHTML = `<div class="stat-card"><div class="stat-value">${pastLessons.length}</div><div class="stat-label">Тем пройдено</div><div class="stat-sublabel">из них ${monthCompleted} в этом месяце</div></div><div class="stat-card"><div class="stat-value">${completedHw}</div><div class="stat-label">ДЗ выполнено</div><div class="stat-sublabel">из ${hwLessons.length} всего</div></div>`; 
            if (currentStudentId === 'denis' && testsData.length > 0) { 
                const avg = Math.round(testsData.reduce((sum, t) => sum + (t.score || 0), 0) / testsData.length); 
                statsHTML += `<div class="stat-card"><div class="stat-value">${testsData.length}</div><div class="stat-label">Пробников решено</div><div class="stat-sublabel">средний балл: ${avg}</div></div>`; 
            } 
            progressStats.innerHTML = statsHTML; 
            chartsContainer.innerHTML = `<div class="chart-card"><h3>Выполнение домашних заданий</h3><canvas id="hwChart"></canvas></div><div class="chart-card"><h3>Прогресс по темам</h3><canvas id="topicsChart"></canvas></div>`; 
            if (currentStudentId === 'denis' && testsData.length > 0) chartsContainer.innerHTML += `<div class="chart-card" style="grid-column: 1 / -1;"><h3>Результаты пробников</h3><canvas id="testsChart"></canvas></div>`; 
            const styles = getComputedStyle(document.body), textPrimary = styles.getPropertyValue('--text-primary').trim(), textSecondary = styles.getPropertyValue('--text-secondary').trim(), borderColor = styles.getPropertyValue('--border-color').trim(); 
            const hwCtx = document.getElementById('hwChart').getContext('2d'); 
            if (charts.hw) charts.hw.destroy(); 
            charts.hw = new Chart(hwCtx, { 
                type: 'doughnut', 
                data: { labels: ['Выполнено', 'Осталось'], datasets: [{ data: [completedHw, Math.max(0, hwLessons.length - completedHw)], backgroundColor: ['#2f9d68', '#d85c5c'], hoverBackgroundColor: ['#2f9d68', '#d85c5c'], borderWidth: 0, hoverBorderWidth: 0 }] }, 
                options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: textPrimary, font: { size: 12, weight: '600' } } } }, cutout: '65%' } 
            }); 
            const topicsByDate = {}; 
            pastLessons.forEach(l => { if (!topicsByDate[l.date]) topicsByDate[l.date] = 0; topicsByDate[l.date]++; }); 
            const sortedDates = Object.keys(topicsByDate).sort(); 
            let cumulative = 0; 
            const cumData = sortedDates.map(d => { cumulative += topicsByDate[d]; return cumulative; }); 
            const topCtx = document.getElementById('topicsChart').getContext('2d'); 
            if (charts.topics) charts.topics.destroy(); 
            charts.topics = new Chart(topCtx, { 
                type: 'line', 
                data: { labels: sortedDates.map(d => d.split('-').slice(1).reverse().join('.')), datasets: [{ label: 'Тем', data: cumData, borderColor: '#3567c9', backgroundColor: 'rgba(53, 103, 201, 0.10)', borderWidth: 3, fill: true, tension: 0.4, pointRadius: 4, pointBackgroundColor: '#3567c9', pointBorderColor: '#ffffff', pointBorderWidth: 2 }] }, 
                options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1, color: textSecondary, font: { weight: '600' } }, grid: { color: borderColor } }, x: { ticks: { color: textSecondary, font: { weight: '600' } }, grid: { display: false } } } }

                const testCtx = document.getElementById('testsChart').getContext('2d');

                    type: 'bar', 
                    data: { labels: testsData.map((t, index) => t.name || `Пробник ${index + 1}`), datasets: [{ label: 'Балл', data: testsData.map(t => t.score || 0), backgroundColor: 'rgba(109, 84, 199, 0.70)', borderColor: '#6d54c7', borderWidth: 2, borderRadius: 8 }] }, 
                    options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, max: 100, ticks: { stepSize: 10, color: textSecondary, font: { weight: '600' } }, grid: { color: borderColor } }, x: { ticks: { color: textSecondary, font: { weight: '600' } }, grid: { display: false } } } } 
                }); 
            } 
        }

        function renderHomeworkCards() { 
            if (!lessonsData.length) { homeworkCards.innerHTML = '<div class="empty-message">Нет домашних заданий</div>'; showAllHomeworkBtn.style.display = 'none'; return; } 
            const today = new Date(), todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`, sorted = lessonsData.filter(l => l.topic && l.topic.trim() !== '' && l.homework && l.homework.trim() !== '' && l.date <= todayStr).sort((a, b) => new Date(a.date) - new Date(b.date)), items = sorted.slice(0, showAllHomework ? sorted.length : Math.min(6, sorted.length)); 
            if (!items.length) { homeworkCards.innerHTML = '<div class="empty-message">Нет домашних заданий</div>'; showAllHomeworkBtn.style.display = 'none'; return; } 
            showAllHomeworkBtn.style.display = sorted.length > 6 ? 'block' : 'none'; 
            showAllHomeworkBtn.textContent = showAllHomework ? 'Скрыть' : 'Показать все'; 
            let html = ''; 
            items.forEach(l => { 
                const d = l.date.split('-'), status = (l.hwStatus || 'pending').toLowerCase(); 
                let statusText = '⏳ Не решено', statusClass = 'pending'; 
                if (status.includes('проверен') || status === 'checked') { statusText = l.hwScore ? `✅ ${l.hwScore}` : '✅ Проверено'; statusClass = 'checked'; } 
                else if (status.includes('не проверен') || status === 'done') { statusText = '📝 Не проверено'; statusClass = 'done'; } 
                else if (status.includes('не решен') || status === 'pending') { statusText = '⏳ Не решено'; statusClass = 'pending'; } 
                html += `<div class="hw-card"><div class="card-header"><span class="card-date">${d[2]}.${d[1]}</span><span class="card-status ${statusClass}">${statusText}</span></div><div class="card-topic">${l.topic}</div><a href="${buildHomeworkLink(l.homework, currentStudentId, l)}" target="_blank" class="card-btn">Открыть задание</a></div>`; 
            }); 
            homeworkCards.innerHTML = html; 
            showAllHomeworkBtn.onclick = () => { showAllHomework = !showAllHomework; renderHomeworkCards(); }; 
        }

        function renderMaterialsCards() { 
            if (!lessonsData.length) { materialsCards.innerHTML = '<div class="empty-message">Нет материалов</div>'; showAllMaterialsBtn.style.display = 'none'; return; } 
            const today = new Date(), todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`, sorted = lessonsData.filter(l => l.topic && l.topic.trim() !== '' && l.material && l.material.trim() !== '' && l.date <= todayStr).sort((a, b) => new Date(b.date) - new Date(a.date)), items = sorted.slice(0, showAllMaterials ? sorted.length : Math.min(6, sorted.length)); 
            if (!items.length) { materialsCards.innerHTML = '<div class="empty-message">Нет материалов</div>'; showAllMaterialsBtn.style.display = 'none'; return; } 
            showAllMaterialsBtn.style.display = sorted.length > 6 ? 'block' : 'none'; 
            showAllMaterialsBtn.textContent = showAllMaterials ? 'Скрыть' : 'Показать все'; 
            let html = ''; 
            items.forEach(l => { const d = l.date.split('-'); html += `<div class="mat-card"><div class="card-header"><span class="card-date">${d[2]}.${d[1]}</span></div><div class="card-topic">${l.topic}</div><a href="${l.material}" target="_blank" class="card-btn">Открыть материал</a></div>`; }); 
            materialsCards.innerHTML = html; 
            showAllMaterialsBtn.onclick = () => { showAllMaterials = !showAllMaterials; renderMaterialsCards(); };

        function buildHomeworkLink(basePath, studentId, lesson) { if (!basePath) return '#'; return basePath + '?' + new URLSearchParams({ student: studentId, date: lesson.date, topic: lesson.topic || '', start: lesson.start || '', end: lesson.end || '' }).toString(); }
        async function loadLessons(studentId) { try { const res = await fetch(`config/${studentId}.json`); if (!res.ok) throw new Error(); lessonsData = await res.json(); return true; } catch { lessonsData = []; return false; } }
        
        async function handleLogin() { 
            const raw = nameInput.value.trim(), password = passwordInput.value.trim(); 
            if (!raw) { loginError.textContent = 'Введите имя'; return; } 
            if (!password) { loginError.textContent = 'Введите пароль'; return; } 
            const id = nameMap[raw.toLowerCase()]; 
            if (!id) { loginError.textContent = 'Ученик не найден'; return; } 
            if (passwords[id] !== password) { loginError.textContent = 'Неверный пароль'; return; } 
            if (id === 'alina') { localStorage.setItem('teacherSession', JSON.stringify({ name: 'alina', time: Date.now() })); window.location.href = 'teacher.html'; return; } 
            loginError.textContent = ''; 
            currentStudentId = id; 
            if (!(await loadLessons(id))) { loginError.textContent = 'Нет расписания'; return; } 
            loginWrapper.style.display = 'none'; 
            mainContent.style.display = 'block'; 
            sidebar.style.display = 'flex'; 
            mainWrapper.classList.add('with-sidebar'); 
            switchPage('schedule'); 
            updateQuickLinks(); 
        }
        
        loginBtn.addEventListener('click', handleLogin);
        nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
        passwordInput.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
        
        function renderCalendar(year, month) { 
            const firstDay = new Date(year, month, 1).getDay(), startDay = firstDay === 0 ? 6 : firstDay - 1, daysInMonth = new Date(year, month + 1, 0).getDate(), today = new Date(), monthNames = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь']; 
            monthYear.textContent = `${monthNames[month]} ${year}`; 
            const lessonDates = new Set(lessonsData.map(item => item.date)), weekdays = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс']; 
            let html = weekdays.map(w => `<div class="weekday">${w}</div>`).join(''); 
            for (let i = 0; i < startDay; i++) html += '<div class="day other-month"></div>'; 
            for (let d = 1; d <= daysInMonth; d++) { 
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`, hasLesson = lessonDates.has(dateStr); 
                let cls = 'day'; 
                if (hasLesson) cls += ' has-lesson'; 
                if (d === today.getDate() && month === today.getMonth() && year === today.getFullYear()) cls += ' today'; 
                html += `<div class="${cls}" ${hasLesson ? `data-date="${dateStr}"` : ''}>${d}${hasLesson ? '<span class="dot"></span>' : ''}</div>`; 
            } 
            calendarGrid.innerHTML = html; 
            document.querySelectorAll('.day.has-lesson').forEach(el => { el.addEventListener('click', function () { const lessons = lessonsData.filter(item => item.date === this.dataset.date); if (lessons.length) showModal(this.dataset.date, lessons); }); }); 
        }
        
        function showModal(dateStr, lessons) { 
            const [y, m, d] = dateStr.split('-').map(Number), dateObj = new Date(y, m - 1, d); 
            modalDate.textContent = dateObj.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); 
            if (lessons.length === 1) { 
                const l = lessons[0]; 
                modalTime.textContent = `${l.start}–${l.end}`; 
                modalTopic.textContent = l.topic; 
                let html = '';

                if (l.homework) html += `<a href="${buildHomeworkLink(l.homework, currentStudentId, l)}" target="_blank">📝 Домашка</a>`; 
                modalLinks.innerHTML = html || '<span style="color: var(--text-secondary)">Нет ссылок</span>'; 
            } else { 
                let time = '', topic = '', links = ''; 
                lessons.forEach((l, i) => { 
                    time += `${l.start}–${l.end}` + (i < lessons.length - 1 ? ', ' : ''); 
                    topic += l.topic + (i < lessons.length - 1 ? ', ' : ''); 
                    if (l.material) links += `<a href="${l.material}" target="_blank" class="secondary">📖 Материал ${i + 1}</a>`; 
                    if (l.homework) links += `<a href="${buildHomeworkLink(l.homework, currentStudentId, l)}" target="_blank">📝 Домашка ${i + 1}</a>`; 
                }); 
                modalTime.textContent = time; 
                modalTopic.textContent = topic; 
                modalLinks.innerHTML = links || '<span style="color: var(--text-secondary)">Нет ссылок</span>'; 
            } 
            modalOverlay.classList.add('active'); 
        }
        
        modalClose.addEventListener('click', () => modalOverlay.classList.remove('active'));
        modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) modalOverlay.classList.remove('active'); });
        
        function changeMonth(delta) { 
            currentMonth += delta; 
            if (currentMonth < 0) { currentMonth = 11; currentYear--; } 
            if (currentMonth > 11) { currentMonth = 0; currentYear++; } 
            if (currentPage === 'schedule') renderCalendar(currentYear, currentMonth); 
            if (currentPage === 'progress') renderProgressPage(); 
        }
        
        prevMonthBtn.addEventListener('click', () => changeMonth(-1));
        nextMonthBtn.addEventListener('click', () => changeMonth(1));
        window.addEventListener('DOMContentLoaded', () => { const s = new URLSearchParams(window.location.search).get('student'); if (s && nameMap[s.toLowerCase()]) nameInput.value = s; });
    </script>
</body>
</html>
