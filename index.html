<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расписание занятий</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #f0f5fe 0%, #e8eefa 100%);
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 16px;
            color: #1a2a3a;
        }

        .container {
            max-width: 860px;
            width: 100%;
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            box-shadow: 0 16px 32px rgba(0, 20, 40, 0.06), 0 4px 12px rgba(0, 0, 0, 0.03);
            padding: 18px 18px 22px;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0b2a44;
            margin-bottom: 14px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #4a627a;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        /* ----- Вход ----- */
        .login-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: white;
            padding: 18px 22px 22px;
            border-radius: 28px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            margin-bottom: 16px;
            border: 1px solid #e9eff6;
            max-width: 360px;
            margin-left: auto;
            margin-right: auto;
        }

        .login-area label {
            font-weight: 600;
            font-size: 0.95rem;
            color: #1f4970;
            margin-bottom: 4px;
            width: 100%;
            text-align: left;
        }

        .login-area input {
            width: 100%;
            padding: 8px 14px;
            border: 2px solid #dce5ef;
            border-radius: 24px;
            font-size: 0.95rem;
            background: #f9fcff;
            outline: none;
            transition: 0.2s;
            text-align: center;
            margin-bottom: 6px;
        }

        .login-area input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.08);
        }

        .login-area .password-field {
            display: none;
        }

        .login-area .password-field.show {
            display: block;
        }

        .login-area button {
            background: #1e4663;
            border: none;
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 8px 24px;
            border-radius: 24px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 4px;
            width: 100%;
        }

        .login-area button:hover {
            background: #0f3550;
        }

        .login-error {
            color: #dc2626;
            font-size: 0.8rem;
            margin-top: 4px;
            min-height: 1.2em;
        }

        .login-hint {
            color: #6c86a3;
            font-size: 0.75rem;
            margin-top: 2px;
        }

        /* ----- Календарь ----- */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0 0 4px;
            flex-wrap: wrap;
            gap: 2px;
        }

        .calendar-header .month-year {
            font-size: 0.85rem;
            font-weight: 700;
            color: #0b2a44;
        }

        .calendar-header .nav-buttons {
            display: flex;
            gap: 4px;
        }

        .calendar-header .nav-buttons button {
            background: white;
            border: 1px solid #dce5ef;
            border-radius: 16px;
            padding: 2px 12px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            color: #1f4970;
            transition: 0.15s;
        }

        .calendar-header .nav-buttons button:hover {
            background: #f0f7ff;
            border-color: #3b82f6;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            background: #f8fafc;
            border-radius: 10px;
            padding: 4px 4px;
            border: 1px solid #e9eff6;
        }

        .calendar-grid .weekday {
            font-weight: 600;
            font-size: 0.5rem;
            text-align: center;
            color: #4a627a;
            padding: 2px 0 1px;
            border-bottom: 1px solid #e2e8f0;
            text-transform: uppercase;
            letter-spacing: 0.2px;
        }

        .calendar-grid .day {
            aspect-ratio: 1/0.7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-size: 0.55rem;
            font-weight: 500;
            background: white;
            cursor: default;
            border: 1px solid transparent;
            position: relative;
            transition: 0.1s;
        }

        .calendar-grid .day.other-month {
            color: #b8c8da;
            background: transparent;
            box-shadow: none;
        }

        .calendar-grid .day.has-lesson {
            background: #dbeafe;
            border-color: #3b82f6;
            cursor: pointer;
            font-weight: 600;
        }

        .calendar-grid .day.has-lesson:hover {
            background: #bfdbfe;
            transform: scale(1.04);
            box-shadow: 0 2px 6px rgba(59, 130, 246, 0.10);
        }

        .calendar-grid .day .dot {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: #3b82f6;
            margin-top: 1px;
        }

        .calendar-grid .day.today {
            border: 2px solid #1e4663;
        }

        /* ----- Список уроков (с прокруткой) ----- */
        .lessons-list {
            margin-top: 14px;
            background: white;
            border-radius: 14px;
            padding: 10px 12px 12px;
            border: 1px solid #e9eff6;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
            max-height: 460px;
            overflow-y: auto;
        }

        .lessons-list h3 {
            font-size: 0.9rem;
            font-weight: 600;
            color: #0b2a44;
            margin-bottom: 4px;
            border-bottom: 1.5px solid #e2e8f0;
            padding-bottom: 4px;
        }

        .lessons-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.7rem;
            table-layout: fixed;
        }

        .lessons-table th {
            text-align: left;
            padding: 4px 4px 3px 0;
            font-weight: 600;
            color: #4a627a;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .lessons-table td {
            padding: 4px 4px 4px 0;
            border-bottom: 1px solid #f0f4fa;
            vertical-align: middle;
            line-height: 1.3;
        }

        .lessons-table tr:last-child td {
            border-bottom: none;
        }

        /* Ширина колонок */
        .lessons-table .col-date {
            width: 44px;
        }
        .lessons-table .col-day {
            width: 38px;
        }
        .lessons-table .col-student {
            width: 48px;
        }
        .lessons-table .col-time {
            width: 68px;
        }
        .lessons-table .col-topic {
            width: auto;
        }
        .lessons-table .col-links {
            width: 70px;
            text-align: right;
            white-space: nowrap;
        }
        .lessons-table .col-done {
            width: 94px;
            text-align: center;
            white-space: nowrap;
        }

        .lessons-table .topic-cell {
            font-size: 0.65rem;
            line-height: 1.3;
            word-wrap: break-word;
            overflow-wrap: break-word;
            hyphens: auto;
            max-height: 2.6em;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .lessons-table .links-cell {
            display: flex;
            gap: 4px;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: nowrap;
        }

        .lessons-table .links-cell a {
            display: inline-flex;
            align-items: center;
            background: #e6f0ff;
            color: #1e4a76;
            padding: 0 10px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 0.6rem;
            font-weight: 500;
            transition: 0.15s;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .lessons-table .links-cell a:hover {
            background: #bfdbfe;
        }

        /* Галочки: две штуки — ДЗ и Материал */
        .check-cell {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
            flex-wrap: nowrap;
        }

        .check-cell label {
            display: flex;
            align-items: center;
            gap: 2px;
            font-size: 0.6rem;
            color: #1f4970;
            cursor: pointer;
            white-space: nowrap;
        }

        .check-cell input[type="checkbox"] {
            width: 13px;
            height: 13px;
            cursor: pointer;
            accent-color: #3b82f6;
            flex-shrink: 0;
        }

        .check-cell .label-done {
            color: #16a34a;
        }

        .no-lessons-msg {
            color: #6c86a3;
            font-style: italic;
            padding: 8px 0;
            font-size: 0.8rem;
        }

        /* ----- Модалка ----- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 25, 45, 0.30);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 14px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            background: white;
            border-radius: 24px;
            max-width: 320px;
            width: 100%;
            padding: 18px 20px 22px;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.10);
            animation: modalFade 0.2s ease-out;
            position: relative;
        }

        @keyframes modalFade {
            0% {
                opacity: 0;
                transform: translateY(10px) scale(0.97);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-card .close-btn {
            position: absolute;
            top: 6px;
            right: 12px;
            font-size: 1.3rem;
            cursor: pointer;
            color: #7a94b0;
            background: none;
            border: none;
            line-height: 1;
        }

        .modal-card .close-btn:hover {
            color: #1e2f3e;
            transform: rotate(90deg);
        }

        .modal-card .modal-date {
            font-size: 0.8rem;
            color: #4a627a;
            margin-bottom: 2px;
        }

        .modal-card .modal-time {
            font-size: 1rem;
            font-weight: 700;
            color: #0b2a44;
        }

        .modal-card .modal-topic {
            font-size: 0.9rem;
            font-weight: 600;
            margin: 4px 0 10px;
            color: #0f2f4a;
        }

        .modal-card .modal-links {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 2px;
        }

        .modal-card .modal-links a {
            background: #1e4663;
            color: white;
            padding: 5px 14px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: 0.15s;
        }

        .modal-card .modal-links a:hover {
            background: #0f3550;
            transform: scale(1.02);
        }

        .modal-card .modal-links a.secondary {
            background: #e6f0ff;
            color: #1e4a76;
        }

        .modal-card .modal-links a.secondary:hover {
            background: #bfdbfe;
        }

        /* ----- Адаптив ----- */
        @media (max-width: 700px) {
            .container {
                padding: 12px 10px 16px;
                border-radius: 20px;
            }

            h1 {
                font-size: 1.2rem;
                margin-bottom: 10px;
            }

            .login-area {
                padding: 14px 16px 18px;
                max-width: 100%;
            }

            .login-area input {
                font-size: 0.85rem;
                padding: 6px 12px;
            }

            .login-area button {
                font-size: 0.85rem;
                padding: 6px 16px;
            }

            .calendar-grid {
                gap: 1px;
                padding: 3px 2px;
                border-radius: 8px;
            }

            .calendar-grid .day {
                font-size: 0.45rem;
                border-radius: 6px;
                aspect-ratio: 1/0.65;
            }

            .calendar-grid .weekday {
                font-size: 0.4rem;
                padding: 1px 0;
            }

            .calendar-header .month-year {
                font-size: 0.7rem;
            }

            .calendar-header .nav-buttons button {
                padding: 1px 8px;
                font-size: 0.6rem;
            }

            .lessons-list {
                padding: 8px 6px 10px;
                margin-top: 10px;
                border-radius: 10px;
                max-height: 360px;
            }

            .lessons-list h3 {
                font-size: 0.75rem;
            }

            .lessons-table {
                font-size: 0.6rem;
            }

            .lessons-table th,
            .lessons-table td {
                padding: 2px 2px;
            }

            .lessons-table .col-date {
                width: 34px;
            }
            .lessons-table .col-day {
                width: 30px;
            }
            .lessons-table .col-student {
                width: 38px;
            }
            .lessons-table .col-time {
                width: 52px;
            }
            .lessons-table .col-links {
                width: 56px;
            }
            .lessons-table .col-done {
                width: 72px;
            }

            .lessons-table .links-cell a {
                font-size: 0.5rem;
                padding: 0 6px;
            }

            .check-cell {
                gap: 4px;
            }
            .check-cell label {
                font-size: 0.5rem;
            }
            .check-cell input[type="checkbox"] {
                width: 11px;
                height: 11px;
            }

            .modal-card {
                padding: 14px 16px 18px;
                max-width: 280px;
            }
            .modal-card .modal-time {
                font-size: 0.85rem;
            }
            .modal-card .modal-topic {
                font-size: 0.8rem;
            }
            .modal-card .modal-links a {
                font-size: 0.7rem;
                padding: 4px 12px;
            }
        }

        @media (max-width: 450px) {
            .lessons-table .col-date {
                width: 28px;
            }
            .lessons-table .col-day {
                width: 26px;
            }
            .lessons-table .col-student {
                width: 32px;
            }
            .lessons-table .col-time {
                width: 44px;
            }
            .lessons-table .col-links {
                width: 44px;
            }
            .lessons-table .col-done {
                width: 60px;
            }
            .check-cell label {
                font-size: 0.45rem;
            }
            .check-cell input[type="checkbox"] {
                width: 9px;
                height: 9px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📅 Расписание занятий</h1>

    <!-- Вход -->
    <div class="login-area" id="loginArea">
        <label for="nameInput">👤 Ваше имя</label>
        <input type="text" id="nameInput" placeholder="">

        <label for="passwordInput" id="passwordLabel" style="display:none;">🔑 Пароль</label>
        <input type="password" id="passwordInput" class="password-field" placeholder="Введите пароль">

        <button id="loginBtn">Войти</button>
        <div class="login-error" id="loginError"></div>
        <div class="login-hint" id="loginHint"></div>
    </div>

    <!-- Основной контент -->
    <div id="mainContent" style="display: none;">
        <div class="subtitle" id="greeting"></div>
        <div class="calendar-header">
            <span class="month-year" id="monthYear"></span>
            <div class="nav-buttons">
                <button id="prevMonth">◀</button>
                <button id="nextMonth">▶</button>
            </div>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>

        <div class="lessons-list" id="lessonsList">
            <h3 id="listTitle">📋 Все уроки на месяц</h3>
            <div id="lessonsTableContainer"></div>
        </div>
    </div>
</div>

<!-- Модалка -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
        <button class="close-btn" id="modalClose">&times;</button>
        <div class="modal-date" id="modalDate"></div>
        <div class="modal-time" id="modalTime"></div>
        <div class="modal-topic" id="modalTopic"></div>
        <div class="modal-links" id="modalLinks"></div>
    </div>
</div>

<script>
    // ============================================================
    //  🔐  ПАРОЛЬ ДЛЯ АЛИНЫ
    // ============================================================
    const TEACHER_PASSWORD = '12345';

    // ============================================================
    //  НАСТРОЙКА ИМЁН
    // ============================================================
    const nameMap = {
        'валерия': 'valeriya',
        'лера': 'valeriya',
        'амина': 'amina',
        'алексей': 'aleksey',
        'алина': 'alina'
    };

    const studentList = ['valeriya', 'amina', 'aleksey'];

    let currentStudentId = null;
    let currentDate = new Date();
    let currentMonth = currentDate.getMonth();
    let currentYear = currentDate.getFullYear();
    let lessonsData = [];
    let isTeacher = false;

    // DOM
    const nameInput = document.getElementById('nameInput');
    const passwordInput = document.getElementById('passwordInput');
    const passwordLabel = document.getElementById('passwordLabel');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');
    const loginHint = document.getElementById('loginHint');
    const mainContent = document.getElementById('mainContent');
    const loginArea = document.getElementById('loginArea');
    const greeting = document.getElementById('greeting');
    const monthYear = document.getElementById('monthYear');
    const calendarGrid = document.getElementById('calendarGrid');
    const lessonsTableContainer = document.getElementById('lessonsTableContainer');
    const listTitle = document.getElementById('listTitle');
    const prevMonthBtn = document.getElementById('prevMonth');
    const nextMonthBtn = document.getElementById('nextMonth');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalClose = document.getElementById('modalClose');
    const modalDate = document.getElementById('modalDate');
    const modalTime = document.getElementById('modalTime');
    const modalTopic = document.getElementById('modalTopic');
    const modalLinks = document.getElementById('modalLinks');

    // ---------- Показываем поле пароля ----------
    nameInput.addEventListener('input', function() {
        const raw = this.value.trim();
        const isAlina = raw.toLowerCase() === 'алина';
        passwordLabel.style.display = isAlina ? 'block' : 'none';
        passwordInput.classList.toggle('show', isAlina);
        if (!isAlina) {
            passwordInput.value = '';
            loginError.textContent = '';
            loginHint.textContent = '';
        } else {
            loginHint.textContent = '🔑 Введите пароль';
        }
    });

    // ---------- localStorage ----------
    function getCheckKey(studentId, dateStr, type) {
        return `checked_${studentId}_${dateStr}_${type}`;
    }

    function saveCheck(studentId, dateStr, type, value) {
        localStorage.setItem(getCheckKey(studentId, dateStr, type), value);
    }

    function loadCheck(studentId, dateStr, type) {
        return localStorage.getItem(getCheckKey(studentId, dateStr, type)) === 'true';
    }

    // ---------- Загрузка данных ----------
    async function loadLessons(studentId) {
        if (studentId === 'alina') {
            isTeacher = true;
            let allLessons = [];
            for (let s of studentList) {
                try {
                    const response = await fetch(`config/${s}.json`);
                    if (response.ok) {
                        const data = await response.json();
                        data.forEach(item => {
                            allLessons.push({
                                ...item,
                                student: s,
                                studentName: getStudentName(s)
                            });
                        });
                    }
                } catch (e) {
                    console.warn('Не удалось загрузить', s);
                }
            }
            lessonsData = allLessons;
            return true;
        } else {
            isTeacher = false;
            try {
                const response = await fetch(`config/${studentId}.json`);
                if (!response.ok) throw new Error('Файл не найден');
                const data = await response.json();
                lessonsData = data.map(item => ({ ...item, student: studentId }));
                return true;
            } catch {
                lessonsData = [];
                return false;
            }
        }
    }

    function getStudentName(id) {
        const names = {
            'valeriya': 'Валерия',
            'amina': 'Амина',
            'aleksey': 'Алексей',
            'alina': 'Алина'
        };
        return names[id] || id;
    }

    // ---------- Вход ----------
    async function handleLogin() {
        const rawName = nameInput.value.trim();
        if (!rawName) {
            loginError.textContent = 'Введите имя';
            return;
        }

        const id = nameMap[rawName.toLowerCase()];
        if (!id) {
            loginError.textContent = 'Ученик не найден';
            return;
        }

        if (id === 'alina') {
            const password = passwordInput.value.trim();
            if (password !== TEACHER_PASSWORD) {
                loginError.textContent = '❌ Неверный пароль';
                return;
            }
        }

        loginError.textContent = '';
        currentStudentId = id;

        const ok = await loadLessons(id);
        if (!ok) {
            loginError.textContent = 'Нет расписания';
            return;
        }

        loginArea.style.display = 'none';
        mainContent.style.display = 'block';

        if (isTeacher) {
            greeting.textContent = '👩‍🏫 Здравствуйте, Алина! Все занятия учеников:';
        } else {
            greeting.textContent = '👋 Здравствуй, ' + getStudentName(id) + '!';
        }

        renderCalendar(currentYear, currentMonth);
        renderLessonsList(currentYear, currentMonth);
    }

    loginBtn.addEventListener('click', handleLogin);
    nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
    passwordInput.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });

    // ---------- Календарь ----------
    function getLessonsForDate(dateStr) {
        return lessonsData.filter(item => item.date === dateStr);
    }

    function getLessonsForMonth(year, month) {
        const result = [];
        const days = new Date(year, month + 1, 0).getDate();
        for (let d = 1; d <= days; d++) {
            const dateObj = new Date(year, month, d);
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            const dayLessons = lessonsData.filter(item => item.date === dateStr);
            if (dayLessons.length) {
                result.push({ date: dateObj, lessons: dayLessons });
            }
        }
        return result;
    }

    function renderCalendar(year, month) {
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const today = new Date();
        const monthNames = ['Янв', 'Фев', 'Мар', 'Апр', 'Май', 'Июн', 'Июл', 'Авг', 'Сен', 'Окт', 'Ноя', 'Дек'];
        monthYear.textContent = `${monthNames[month]} ${year}`;
        const lessonDates = new Set(lessonsData.map(item => item.date));
        const weekdays = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
        let html = weekdays.map(w => `<div class="weekday">${w}</div>`).join('');
        for (let i = 0; i < firstDay; i++) html += `<div class="day other-month"></div>`;
        for (let d = 1; d <= daysInMonth; d++) {
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            const hasLesson = lessonDates.has(dateStr);
            let cls = 'day';
            if (hasLesson) cls += ' has-lesson';
            if (d === today.getDate() && month === today.getMonth() && year === today.getFullYear()) cls += ' today';
            const attr = hasLesson ? `data-date="${dateStr}"` : '';
            html += `<div class="${cls}" ${attr}>${d}${hasLesson ? '<span class="dot"></span>' : ''}</div>`;
        }
        calendarGrid.innerHTML = html;
        document.querySelectorAll('.day.has-lesson').forEach(el => {
            el.addEventListener('click', function() {
                const lessons = getLessonsForDate(this.dataset.date);
                if (lessons.length) showModal(this.dataset.date, lessons);
            });
        });
    }

    function showModal(dateStr, lessons) {
        const [y, m, d] = dateStr.split('-').map(Number);
        const dateObj = new Date(y, m - 1, d);
        modalDate.textContent = dateObj.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long',
            year: 'numeric' });
        if (lessons.length === 1) {
            const l = lessons[0];
            const studentLabel = isTeacher ? ` (${l.studentName || getStudentName(l.student)})` : '';
            modalTime.textContent = `${l.start}–${l.end}`;
            modalTopic.textContent = l.topic + studentLabel;
            let html = '';
            if (l.material) html += `<a href="${l.material}" target="_blank" class="secondary">📖 Материал</a>`;
            if (l.homework) {
                const hwLink = buildHomeworkLink(l.homework, l.student || currentStudentId, l);
                html += `<a href="${hwLink}" target="_blank">📝 Домашка</a>`;
            }
            modalLinks.innerHTML = html || '<span style="color:#6c86a3;">Нет ссылок</span>';
        } else {
            let time = '',
                topic = '',
                links = '';
            lessons.forEach((l, i) => {
                const studentLabel = isTeacher ? ` (${l.studentName || getStudentName(l.student)})` : '';
                time += `${l.start}–${l.end}` + (i < lessons.length - 1 ? ', ' : '');
                topic += l.topic + studentLabel + (i < lessons.length - 1 ? ', ' : '');
                if (l.material) links += `<a href="${l.material}" target="_blank" class="secondary">📖 ${i + 1}</a>`;
                if (l.homework) {
                    const hwLink = buildHomeworkLink(l.homework, l.student || currentStudentId, l);
                    links += `<a href="${hwLink}" target="_blank">📝 ${i + 1}</a>`;
                }
            });
            modalTime.textContent = time;
            modalTopic.textContent = topic;
            modalLinks.innerHTML = links || '<span style="color:#6c86a3;">Нет ссылок</span>';
        }
        modalOverlay.classList.add('active');
    }

    modalClose.addEventListener('click', () => modalOverlay.classList.remove('active'));
    modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) modalOverlay.classList.remove('active'); });

    function buildHomeworkLink(basePath, studentId, lesson) {
        if (!basePath) return '';
        const params = new URLSearchParams({
            student: studentId,
            date: lesson.date,
            topic: lesson.topic || '',
            start: lesson.start || '',
            end: lesson.end || ''
        });
        return basePath + '?' + params.toString();
    }

    // ---------- Список уроков ----------
    function renderLessonsList(year, month) {
        const data = getLessonsForMonth(year, month);
        if (!data.length) {
            lessonsTableContainer.innerHTML = '<div class="no-lessons-msg">На этот месяц уроков нет.</div>';
            return;
        }

        let html = `
            <table class="lessons-table">
                <thead>
                    <tr>
                        <th class="col-date">Дата</th>
                        <th class="col-day">День</th>
                        ${isTeacher ? '<th class="col-student">Уч-к</th>' : ''}
                        <th class="col-time">Время</th>
                        <th class="col-topic">Тема</th>
                        <th class="col-links">Ссылки</th>
                        ${isTeacher ? '<th class="col-done">Готово</th>' : ''}
                    </tr>
                </thead>
                <tbody>
        `;

        data.forEach(item => {
            const dateObj = item.date;
            const day = String(dateObj.getDate()).padStart(2, '0');
            const monthNum = String(dateObj.getMonth() + 1).padStart(2, '0');
            const displayDate = `${day}.${monthNum}`;
            const dayName = dateObj.toLocaleDateString('ru-RU', { weekday: 'short' });

            item.lessons.forEach((l, idx) => {
                const studentId = l.student || currentStudentId;
                const rowspan = idx === 0 ? item.lessons.length : 0;

                // Две галочки для Алины: ДЗ и Материал
                let checkHtml = '';
                if (isTeacher) {
                    const hwChecked = loadCheck(studentId, l.date, 'homework');
                    const matChecked = loadCheck(studentId, l.date, 'material');
                    checkHtml = `
                        <td class="col-done">
                            <div class="check-cell">
                                <label>
                                    <input type="checkbox" class="check-done" data-student="${studentId}" data-date="${l.date}" data-type="homework" ${hwChecked ? 'checked' : ''} />
                                    ДЗ
                                </label>
                                <label>
                                    <input type="checkbox" class="check-done" data-student="${studentId}" data-date="${l.date}" data-type="material" ${matChecked ? 'checked' : ''} />
                                    📚
                                </label>
                            </div>
                        </td>
                    `;
                }

                const studentName = isTeacher ?
                    `<td class="col-student" style="font-size:0.6rem;">${getStudentName(studentId)}</td>` :
                    '';

                let links = '';
                if (l.material) links += `<a href="${l.material}" target="_blank">📖</a>`;
                if (l.homework) {
                    const hwLink = buildHomeworkLink(l.homework, studentId, l);
                    links += `<a href="${hwLink}" target="_blank">📝</a>`;
                }

                html += `<tr>
                    ${rowspan ? `<td rowspan="${rowspan}" class="col-date">${displayDate}</td><td rowspan="${rowspan}" class="col-day">${dayName}</td>` : ''}
                    ${studentName}
                    <td class="col-time">${l.start}–${l.end}</td>
                    <td class="col-topic topic-cell">${l.topic || '—'}</td>
                    <td class="col-links links-cell">${links || '—'}</td>
                    ${checkHtml}
                </tr>`;
            });
        });

        html += '</tbody></table>';
        lessonsTableContainer.innerHTML = html;

        // Обработчики для галочек
        if (isTeacher) {
            document.querySelectorAll('.check-done').forEach(cb => {
                cb.addEventListener('change', function() {
                    const student = this.dataset.student;
                    const date = this.dataset.date;
                    const type = this.dataset.type;
                    saveCheck(student, date, type, this.checked);
                });
            });
        }
    }

    function changeMonth(delta) {
        currentMonth += delta;
        if (currentMonth < 0) {
            currentMonth = 11;
            currentYear--;
        }
        if (currentMonth > 11) {
            currentMonth = 0;
            currentYear++;
        }
        renderCalendar(currentYear, currentMonth);
        renderLessonsList(currentYear, currentMonth);
    }

    prevMonthBtn.addEventListener('click', () => changeMonth(-1));
    nextMonthBtn.addEventListener('click', () => changeMonth(1));

    window.addEventListener('DOMContentLoaded', async () => {
        const p = new URLSearchParams(window.location.search);
        const s = p.get('student');
        if (s) {
            const id = nameMap[s.toLowerCase()];
            if (id) {
                nameInput.value = s;
                if (id === 'alina') {
                    passwordLabel.style.display = 'block';
                    passwordInput.classList.add('show');
                    loginHint.textContent = '🔑 Введите пароль';
                }
                await handleLogin();
            }
        }
    });
</script>
