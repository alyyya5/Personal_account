<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Личный кабинет</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #f0f5fe 0%, #e8eefa 100%);
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px 12px;
            color: #1a2a3a;
        }
        .container {
            max-width: 680px;
            width: 100%;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            box-shadow: 0 16px 32px rgba(0, 20, 40, 0.06), 0 4px 12px rgba(0, 0, 0, 0.03);
            padding: 18px 18px 22px;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #0b2a44;
            margin-bottom: 14px;
            text-align: center;
        }

        .login-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: white;
            padding: 16px 20px 20px;
            border-radius: 28px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            margin-bottom: 16px;
            border: 1px solid #e9eff6;
            max-width: 340px;
            margin-left: auto;
            margin-right: auto;
        }
        .login-area label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #1f4970;
            margin-bottom: 6px;
        }
        .login-area input {
            width: 100%;
            padding: 8px 14px;
            border: 2px solid #dce5ef;
            border-radius: 24px;
            font-size: 0.9rem;
            background: #f9fcff;
            outline: none;
            transition: 0.2s;
            text-align: center;
        }
        .login-area input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.08);
        }
        .login-area button {
            background: #1e4663;
            border: none;
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 8px 24px;
            border-radius: 24px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
            width: 100%;
        }
        .login-area button:hover { background: #0f3550; }
        .login-error { color: #dc2626; font-size: 0.8rem; margin-top: 4px; }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0 0 4px;
            flex-wrap: wrap;
            gap: 2px;
        }
        .calendar-header .month-year { font-size: 0.8rem; font-weight: 700; color: #0b2a44; }
        .calendar-header .nav-buttons { display: flex; gap: 3px; }
        .calendar-header .nav-buttons button {
            background: white;
            border: 1px solid #dce5ef;
            border-radius: 16px;
            padding: 1px 8px;
            font-size: 0.65rem;
            font-weight: 600;
            cursor: pointer;
            color: #1f4970;
            transition: 0.15s;
        }
        .calendar-header .nav-buttons button:hover {
            background: #f0f7ff;
            border-color: #3b82f6;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1.5px;
            background: #f8fafc;
            border-radius: 10px;
            padding: 4px 3px;
            border: 1px solid #e9eff6;
        }
        .calendar-grid .weekday {
            font-weight: 600;
            font-size: 0.45rem;
            text-align: center;
            color: #4a627a;
            padding: 1px 0 0;
            border-bottom: 1px solid #e2e8f0;
            text-transform: uppercase;
            letter-spacing: 0.1px;
        }
        .calendar-grid .day {
            aspect-ratio: 1/0.7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-size: 0.5rem;
            font-weight: 500;
            background: white;
            cursor: default;
            border: 1px solid transparent;
            position: relative;
            transition: 0.1s;
        }
        .calendar-grid .day.other-month { color: #b8c8da; background: transparent; box-shadow: none; }
        .calendar-grid .day.has-lesson {
            background: #dbeafe;
            border-color: #3b82f6;
            cursor: pointer;
            font-weight: 600;
        }
        .calendar-grid .day.has-lesson:hover {
            background: #bfdbfe;
            transform: scale(1.04);
            box-shadow: 0 2px 6px rgba(59,130,246,0.10);
        }
        .calendar-grid .day .dot { width: 3px; height: 3px; border-radius: 50%; background: #3b82f6; margin-top: 0; }
        .calendar-grid .day.today { border: 2px solid #1e4663; }

        .lessons-list {
            margin-top: 10px;
            background: white;
            border-radius: 14px;
            padding: 8px 10px 10px;
            border: 1px solid #e9eff6;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .lessons-list h3 {
            font-size: 0.8rem;
            font-weight: 600;
            color: #0b2a44;
            margin-bottom: 3px;
            border-bottom: 1.5px solid #e2e8f0;
            padding-bottom: 3px;
        }
        .lessons-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.65rem;
            table-layout: fixed;
        }
        .lessons-table th {
            text-align: left;
            padding: 2px 4px 1px 0;
            font-weight: 600;
            color: #4a627a;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.1px;
        }
        .lessons-table td {
            padding: 2px 4px 2px 0;
            border-bottom: 1px solid #f0f4fa;
            vertical-align: middle;
            line-height: 1.2;
        }
        .lessons-table tr:last-child td { border-bottom: none; }

        .lessons-table .col-date { width: 36px; }
        .lessons-table .col-day { width: 40px; }
        .lessons-table .col-time { width: 58px; }
        .lessons-table .col-topic { width: auto; }
        .lessons-table .col-links { width: 60px; text-align: right; }

        .lessons-table .topic-cell {
            font-size: 0.6rem;
            line-height: 1.2;
            word-wrap: break-word;
            overflow-wrap: break-word;
            hyphens: auto;
            max-height: 2.4em;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .lessons-table .links-cell {
            display: flex;
            gap: 3px;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        .lessons-table .links-cell a {
            display: inline-flex;
            align-items: center;
            background: #e6f0ff;
            color: #1e4a76;
            padding: 0 8px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 0.5rem;
            font-weight: 500;
            transition: 0.15s;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .lessons-table .links-cell a:hover { background: #bfdbfe; }

        .no-lessons-msg { color: #6c86a3; font-style: italic; padding: 6px 0; font-size: 0.75rem; }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10,25,45,0.30);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 14px;
        }
        .modal-overlay.active { display: flex; }
        .modal-card {
            background: white;
            border-radius: 24px;
            max-width: 300px;
            width: 100%;
            padding: 16px 18px 20px;
            box-shadow: 0 24px 48px rgba(0,0,0,0.10);
            animation: modalFade 0.2s ease-out;
            position: relative;
        }
        @keyframes modalFade {
            0% { opacity: 0; transform: translateY(10px) scale(0.97); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .modal-card .close-btn {
            position: absolute;
            top: 6px;
            right: 10px;
            font-size: 1.1rem;
            cursor: pointer;
            color: #7a94b0;
            background: none;
            border: none;
            line-height: 1;
        }
        .modal-card .close-btn:hover { color: #1e2f3e; transform: rotate(90deg); }
        .modal-card .modal-date { font-size: 0.7rem; color: #4a627a; margin-bottom: 2px; }
        .modal-card .modal-time { font-size: 0.9rem; font-weight: 700; color: #0b2a44; }
        .modal-card .modal-topic { font-size: 0.8rem; font-weight: 600; margin: 3px 0 6px; color: #0f2f4a; }
        .modal-card .modal-links {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 2px;
        }
        .modal-card .modal-links a {
            background: #1e4663;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.7rem;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            transition: 0.15s;
        }
        .modal-card .modal-links a:hover { background: #0f3550; transform: scale(1.02); }
        .modal-card .modal-links a.secondary { background: #e6f0ff; color: #1e4a76; }
        .modal-card .modal-links a.secondary:hover { background: #bfdbfe; }

        @media (max-width: 500px) {
            .container { padding: 12px 10px 16px; border-radius: 20px; }
            h1 { font-size: 1.1rem; margin-bottom: 10px; }
            .login-area { padding: 12px 14px 16px; max-width: 100%; }
            .login-area input { font-size: 0.8rem; padding: 6px 12px; }
            .login-area button { font-size: 0.8rem; padding: 6px 16px; }
            .calendar-grid { gap: 1px; padding: 3px 2px; border-radius: 8px; }
            .calendar-grid .day { font-size: 0.4rem; border-radius: 6px; aspect-ratio: 1/0.65; }
            .calendar-grid .weekday { font-size: 0.35rem; padding: 1px 0; }
            .calendar-header .month-year { font-size: 0.65rem; }
            .calendar-header .nav-buttons button { padding: 1px 6px; font-size: 0.55rem; }
            .lessons-list { padding: 6px 6px 8px; margin-top: 8px; border-radius: 10px; }
            .lessons-list h3 { font-size: 0.7rem; }
            .lessons-table { font-size: 0.55rem; }
            .lessons-table th, .lessons-table td { padding: 1px 2px; }
            .lessons-table .links-cell a { font-size: 0.4rem; padding: 0 6px; }
            .lessons-table .col-date { width: 30px; }
            .lessons-table .col-day { width: 34px; }
            .lessons-table .col-time { width: 48px; }
            .lessons-table .col-links { width: 50px; }
            .modal-card { padding: 12px 14px 16px; max-width: 260px; }
            .modal-card .modal-time { font-size: 0.8rem; }
            .modal-card .modal-topic { font-size: 0.7rem; }
            .modal-card .modal-links a { font-size: 0.6rem; padding: 3px 10px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📅 Расписание занятий</h1>

    <div class="login-area" id="loginArea">
        <label for="nameInput">👤 Ваше имя</label>
        <input type="text" id="nameInput" placeholder="" />
        <button id="loginBtn">Войти</button>
        <span class="login-error" id="loginError"></span>
    </div>

    <div id="mainContent" style="display: none;">
        <div class="calendar-header">
            <span class="month-year" id="monthYear"></span>
            <div class="nav-buttons">
                <button id="prevMonth">◀</button>
                <button id="nextMonth">▶</button>
            </div>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>

        <div class="lessons-list" id="lessonsList">
            <h3>📋 Все уроки на месяц</h3>
            <div id="lessonsTableContainer"></div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
        <button class="close-btn" id="modalClose">&times;</button>
        <div class="modal-date" id="modalDate"></div>
        <div class="modal-time" id="modalTime"></div>
        <div class="modal-topic" id="modalTopic"></div>
        <div class="modal-links" id="modalLinks"></div>
    </div>
</div>

<script>
    const nameMap = {
        'валерия': 'valeriya',
        'лера': 'valeriya',
        'амина': 'amina',
        'алексей': 'aleksey',
        'алина': 'alina'
    };

    let currentStudentId = null;
    let currentDate = new Date();
    let currentMonth = currentDate.getMonth();
    let currentYear = currentDate.getFullYear();
    let lessonsData = [];

    const nameInput = document.getElementById('nameInput');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');
    const mainContent = document.getElementById('mainContent');
    const loginArea = document.getElementById('loginArea');
    const monthYear = document.getElementById('monthYear');
    const calendarGrid = document.getElementById('calendarGrid');
    const lessonsTableContainer = document.getElementById('lessonsTableContainer');
    const prevMonthBtn = document.getElementById('prevMonth');
    const nextMonthBtn = document.getElementById('nextMonth');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalClose = document.getElementById('modalClose');
    const modalDate = document.getElementById('modalDate');
    const modalTime = document.getElementById('modalTime');
    const modalTopic = document.getElementById('modalTopic');
    const modalLinks = document.getElementById('modalLinks');

    function buildHomeworkLink(basePath, studentId, lesson) {
        if (!basePath) return '';
        const params = new URLSearchParams({
            student: studentId,
            date: lesson.date,
            topic: lesson.topic || '',
            start: lesson.start || '',
            end: lesson.end || ''
        });
        return basePath + '?' + params.toString();
    }

    async function loadLessons(studentId) {
        try {
            const response = await fetch(`config/${studentId}.json`);
            if (!response.ok) throw new Error('Файл не найден');
            lessonsData = await response.json();
            return true;
        } catch {
            lessonsData = [];
            return false;
        }
    }

    async function handleLogin() {
        const raw = nameInput.value.trim();
        if (!raw) { loginError.textContent = 'Введите имя'; return; }
        const id = nameMap[raw.toLowerCase()];
        if (!id) { loginError.textContent = 'Ученик не найден'; return; }

        if (id === 'alina') {
            window.location.href = 'teacher.html';
            return;
        }

        loginError.textContent = '';
        currentStudentId = id;
        const ok = await loadLessons(id);
        if (!ok) { loginError.textContent = 'Нет расписания'; return; }

        // Скрываем форму входа
        loginArea.style.display = 'none';
        mainContent.style.display = 'block';
        renderCalendar(currentYear, currentMonth);
        renderLessonsList(currentYear, currentMonth);
    }

    loginBtn.addEventListener('click', handleLogin);
    nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });

    function getLessonsForDate(dateStr) {
        return lessonsData.filter(item => item.date === dateStr);
    }

    function getLessonsForMonth(year, month) {
        const result = [];
        const days = new Date(year, month + 1, 0).getDate();
        for (let d = 1; d <= days; d++) {
            const dateObj = new Date(year, month, d);
            const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const dayLessons = lessonsData.filter(item => item.date === dateStr);
            if (dayLessons.length) result.push({ date: dateObj, lessons: dayLessons });
        }
        return result;
    }

    function renderCalendar(year, month) {
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const today = new Date();
        const monthNames = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
        monthYear.textContent = `${monthNames[month]} ${year}`;
        const lessonDates = new Set(lessonsData.map(item => item.date));
        const weekdays = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
        let html = weekdays.map(w => `<div class="weekday">${w}</div>`).join('');
        for (let i = 0; i < firstDay; i++) html += `<div class="day other-month"></div>`;
        for (let d = 1; d <= daysInMonth; d++) {
            const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const hasLesson = lessonDates.has(dateStr);
            let cls = 'day';
            if (hasLesson) cls += ' has-lesson';
            if (d === today.getDate() && month === today.getMonth() && year === today.getFullYear()) cls += ' today';
            const attr = hasLesson ? `data-date="${dateStr}"` : '';
            html += `<div class="${cls}" ${attr}>${d}${hasLesson ? '<span class="dot"></span>' : ''}</div>`;
        }
        calendarGrid.innerHTML = html;
        document.querySelectorAll('.day.has-lesson').forEach(el => {
            el.addEventListener('click', function() {
                const lessons = getLessonsForDate(this.dataset.date);
                if (lessons.length) showModal(this.dataset.date, lessons);
            });
        });
    }

    function showModal(dateStr, lessons) {
        const [y, m, d] = dateStr.split('-').map(Number);
        const dateObj = new Date(y, m-1, d);
        modalDate.textContent = dateObj.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        if (lessons.length === 1) {
            const l = lessons[0];
            modalTime.textContent = `${l.start}–${l.end}`;
            modalTopic.textContent = l.topic;
            let html = '';
            if (l.material) html += `<a href="${l.material}" target="_blank" class="secondary">📖 Материал</a>`;
            if (l.homework) {
                const hwLink = buildHomeworkLink(l.homework, currentStudentId, l);
                html += `<a href="${hwLink}" target="_blank">📝 Домашка</a>`;
            }
            modalLinks.innerHTML = html || '<span style="color:#6c86a3;">Нет ссылок</span>';
        } else {
            let time = '', topic = '', links = '';
            lessons.forEach((l, i) => {
                time += `${l.start}–${l.end}` + (i < lessons.length-1 ? ', ' : '');
                topic += l.topic + (i < lessons.length-1 ? ', ' : '');
                if (l.material) links += `<a href="${l.material}" target="_blank" class="secondary">📖 ${i+1}</a>`;
                if (l.homework) {
                    const hwLink = buildHomeworkLink(l.homework, currentStudentId, l);
                    links += `<a href="${hwLink}" target="_blank">📝 ${i+1}</a>`;
                }
            });
            modalTime.textContent = time;
            modalTopic.textContent = topic;
            modalLinks.innerHTML = links || '<span style="color:#6c86a3;">Нет ссылок</span>';
        }
        modalOverlay.classList.add('active');
    }

    modalClose.addEventListener('click', () => modalOverlay.classList.remove('active'));
    modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) modalOverlay.classList.remove('active'); });

    function renderLessonsList(year, month) {
        const data = getLessonsForMonth(year, month);
        if (!data.length) {
            lessonsTableContainer.innerHTML = '<div class="no-lessons-msg">На этот месяц уроков нет.</div>';
            return;
        }
        let html = `
            <table class="lessons-table">
                <thead>
                    <tr>
                        <th class="col-date">Дата</th>
                        <th class="col-day">День</th>
                        <th class="col-time">Время</th>
                        <th class="col-topic">Тема</th>
                        <th class="col-links">Ссылки</th>
                    </tr>
                </thead>
                <tbody>
        `;
        data.forEach(item => {
            const dateObj = item.date;
            const day = String(dateObj.getDate()).padStart(2, '0');
            const monthNum = String(dateObj.getMonth() + 1).padStart(2, '0');
            const displayDate = `${day}.${monthNum}`;
            const dayName = dateObj.toLocaleDateString('ru-RU', { weekday: 'short' });
            item.lessons.forEach((l, idx) => {
                let links = '';
                if (l.material) links += `<a href="${l.material}" target="_blank">📖</a>`;
                if (l.homework) {
                    const hwLink = buildHomeworkLink(l.homework, currentStudentId, l);
                    links += `<a href="${hwLink}" target="_blank">📝</a>`;
                }
                const rowspan = idx === 0 ? item.lessons.length : 0;
                html += `<tr>
                    ${rowspan ? `<td rowspan="${rowspan}" class="col-date">${displayDate}</td><td rowspan="${rowspan}" class="col-day">${dayName}</td>` : ''}
                    <td class="col-time">${l.start}–${l.end}</td>
                    <td class="col-topic topic-cell">${l.topic}</td>
                    <td class="col-links links-cell">${links || '—'}</td>
                </tr>`;
            });
        });
        html += '</tbody></table>';
        lessonsTableContainer.innerHTML = html;
    }

    function changeMonth(delta) {
        currentMonth += delta;
        if (currentMonth < 0) { currentMonth = 11; currentYear--; }
        if (currentMonth > 11) { currentMonth = 0; currentYear++; }
        renderCalendar(currentYear, currentMonth);
        renderLessonsList(currentYear, currentMonth);
    }

    prevMonthBtn.addEventListener('click', () => changeMonth(-1));
    nextMonthBtn.addEventListener('click', () => changeMonth(1));

    window.addEventListener('DOMContentLoaded', async () => {
        const p = new URLSearchParams(window.location.search);
        const s = p.get('student');
        if (s) {
            const id = nameMap[s.toLowerCase()];
            if (id) {
                nameInput.value = s;
                await handleLogin();
            }
        }
    });
</script>
</body>
</html>
