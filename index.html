<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Личный кабинет</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-gradient-start: #f0f4f8;
            --bg-gradient-end: #d9e2ec;
            --container-bg: rgba(255, 255, 255, 0.95);
            --text-primary: #102a43;
            --text-secondary: #627d98;
            --sidebar-bg: #ffffff;
            --card-bg: #ffffff;
            --border-color: #e1e8ed;
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            --accent-blue: #4361ee;
            --accent-purple: #7209b7;
            --accent-pink: #f72585;
            --accent-green: #06d6a0;
            --accent-red: #ef476f;
            --accent-orange: #f5a623;
        }

        body {
            background: linear-gradient(145deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            padding: 20px;
            color: var(--text-primary);
            overflow-x: hidden;
            position: relative;
        }

        /* Математические элементы на фоне */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(67, 97, 238, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 80% 70%, rgba(114, 9, 183, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 40% 80%, rgba(247, 37, 133, 0.05) 0%, transparent 15%);
            pointer-events: none;
            z-index: 0;
        }

        .math-symbol {
            position: fixed;
            font-size: 120px;
            opacity: 0.03;
            color: var(--accent-blue);
            font-weight: bold;
            pointer-events: none;
            z-index: 0;
            user-select: none;
        }

        /* ---------- Основной контейнер ---------- */
        .main-wrapper {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            gap: 24px;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
        }

        .container {
            flex: 1;
            background: var(--container-bg);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            box-shadow: var(--shadow);
            padding: 32px 36px 36px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            transition: all 0.3s ease;
        }

        /* ---------- Вход ---------- */
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 70vh;
        }

        .login-card {
            background: white;
            border-radius: 24px;
            padding: 48px 56px 44px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            max-width: 420px;
            width: 100%;
            text-align: center;
        }

        .login-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .login-title-icon {
            font-size: 1.8rem;
        }

        .login-area {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .login-input-group {
            text-align: left;
        }

        .login-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .login-input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid var(--border-color);
            border-radius: 14px;
            font-size: 1rem;
            background: #f8fafc;
            outline: none;
            transition: all 0.2s;
            color: var(--text-primary);
        }

        .login-input:focus {
            border-color: var(--accent-blue);
            background: white;
            box-shadow: 0 0 0 4px rgba(67, 97, 238, 0.08);
        }

        .login-btn {
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-purple) 100%);
            border: none;
            color: white;
            font-weight: 700;
            font-size: 1.05rem;
            padding: 14px 28px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
            width: 100%;
            box-shadow: 0 4px 12px rgba(67, 97, 238, 0.25);
        }

        .login-btn:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(67, 97, 238, 0.35);
        }

        .login-error {
            color: var(--accent-red);
            font-size: 0.9rem;
            margin-top: 8px;
            min-height: 1.2em;
            font-weight: 500;
        }

        /* ---------- Сайдбар ---------- */
        .sidebar {
            width: 240px;
            background: var(--sidebar-bg);
            box-shadow: var(--shadow);
            border-radius: 20px;
            padding: 24px 20px;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .sidebar.hidden {
            display: none;
        }

        .sidebar .logo {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 28px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--border-color);
            text-align: center;
        }
        .sidebar .logo span {
            color: var(--accent-blue);
        }
        .sidebar .nav-item {
            display: block;
            width: 100%;
            padding: 12px 16px;
            border: none;
            background: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 8px;
        }
        .sidebar .nav-item:hover {
            background: rgba(67, 97, 238, 0.08);
            color: var(--accent-blue);
        }
        .sidebar .nav-item.active {
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-purple) 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(67, 97, 238, 0.25);
        }
        .sidebar .nav-item .icon {
            margin-right: 10px;
        }

        .sidebar-toggle {
            position: fixed;
            top: 20px;
            left: 20px;
            background: white;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            width: 48px;
            height: 48px;
            cursor: pointer;
            font-size: 1.4rem;
            box-shadow: var(--shadow);
            transition: all 0.2s;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
        }

        .sidebar-toggle:hover {
            transform: scale(1.05);
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        .theme-toggle {
            margin-top: auto;
            padding: 12px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.9rem;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.25);
        }

        .theme-toggle:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.35);
        }

        /* ---------- Заголовок страницы ---------- */
        .page-title-wrapper {
            text-align: center;
            margin-bottom: 24px;
            position: relative;
        }

        h1 {
            font-size: 1.7rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0;
            display: inline-block;
        }

        .title-separator {
            height: 3px;
            background: linear-gradient(90deg, transparent 0%, var(--accent-blue) 20%, var(--accent-purple) 50%, var(--accent-pink) 80%, transparent 100%);
            border-radius: 3px;
            margin-top: 12px;
            opacity: 0.6;
        }

        /* ---------- Быстрые ссылки ---------- */
        .quick-links-container {
            display: none;
            justify-content: flex-end;
            gap: 14px;
            margin-bottom: 24px;
        }
        
        .quick-link-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 28px;
            border-radius: 28px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            min-width: 140px;
        }
        
        .quick-link-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.18);
        }
        
        .zoom-btn { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .board-btn { 
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        /* ---------- Страницы ---------- */
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }

        /* ---------- Карточки ---------- */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 24px;
        }

        .hw-card, .mat-card {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .hw-card:hover, .mat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .card-date {
            font-size: 0.9rem;
            color: var(--text-secondary);
            background: rgba(67, 97, 238, 0.08);
            padding: 6px 14px;
            border-radius: 12px;
            font-weight: 600;
        }

        .card-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .card-status:hover {
            transform: scale(1.05);
        }

        .card-status.done {
            background: #dcfce7;
            color: #16a34a;
        }

        .card-status.pending {
            background: #fef3c7;
            color: #d97706;
        }

        .card-status.checked {
            background: #dbeafe;
            color: #2563eb;
        }

        .card-topic {
            font-size: 1.05rem;
            color: var(--text-primary);
            line-height: 1.5;
            flex: 1;
            font-weight: 600;
        }

        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .card-btn {
            flex: 1;
            padding: 11px 18px;
            border: none;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .card-btn.primary {
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-purple) 100%);
            color: white;
            box-shadow: 0 3px 10px rgba(67, 97, 238, 0.25);
        }

        .card-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 16px rgba(67, 97, 238, 0.35);
        }

        .show-more-btn {
            display: block;
            width: 100%;
            max-width: 320px;
            margin: 32px auto 0;
            padding: 14px 32px;
            background: transparent;
            border: 2px solid var(--accent-blue);
            border-radius: 14px;
            color: var(--accent-blue);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .show-more-btn:hover {
            background: var(--accent-blue);
            color: white;
            transform: translateY(-2px);
        }

        /* ---------- Календарь ---------- */
        .calendar-wrapper {
            background: white;
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            border: 1px solid var(--border-color);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .calendar-header .month-year { 
            font-size: 1.2rem; 
            font-weight: 700; 
            color: var(--text-primary); 
        }
        
        .calendar-header .nav-buttons { display: flex; gap: 10px; }
        
        .calendar-header .nav-buttons button {
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-purple) 100%);
            border: none;
            border-radius: 12px;
            padding: 8px 18px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            color: white;
            transition: all 0.2s;
            box-shadow: 0 3px 10px rgba(67, 97, 238, 0.25);
        }
        
        .calendar-header .nav-buttons button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 16px rgba(67, 97, 238, 0.35);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }
        
        .calendar-grid .weekday {
            font-weight: 700;
            font-size: 0.8rem;
            text-align: center;
            color: var(--text-secondary);
            padding: 12px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .calendar-grid .day {
            aspect-ratio: 1/0.95;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            background: #f8fafc;
            cursor: default;
            border: 2px solid transparent;
            position: relative;
            transition: all 0.2s;
            color: var(--text-primary);
        }
        
        .calendar-grid .day.other-month { opacity: 0.3; }
        
        .calendar-grid .day.has-lesson {
            background: linear-gradient(135deg, rgba(67, 97, 238, 0.15) 0%, rgba(114, 9, 183, 0.15) 100%);
            border-color: var(--accent-blue);
            cursor: pointer;
            color: var(--accent-blue);
        }
        
        .calendar-grid .day.has-lesson:hover {
            transform: scale(1.08);
            box-shadow: 0 4px 12px rgba(67, 97, 238, 0.2);
        }
        
        .calendar-grid .day .dot { 
            width: 6px; 
            height: 6px; 
            border-radius: 50%; 
            background: var(--accent-blue); 
            margin-top: 4px; 
        }
        
        .calendar-grid .day.today { 
            border: 2px solid var(--accent-blue);
            font-weight: 700;
        }

        /* ---------- Прогресс ---------- */
        .progress-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: white;
            border-radius: 18px;
            padding: 28px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            text-align: center;
        }

        .stat-value {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            line-height: 1;
        }

        .stat-label {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 600;
        }

        .stat-sublabel {
            font-size: 0.9rem;
            color: var(--text-secondary);
            opacity: 0.8;
        }

        .charts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
            margin-top: 28px;
        }

        .chart-card {
            background: white;
            border-radius: 18px;
            padding: 28px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }

        .chart-card h3 {
            font-size: 1.15rem;
            color: var(--text-primary);
            margin-bottom: 20px;
            font-weight: 700;
            text-align: center;
        }

        /* ---------- Модалка ---------- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(16, 42, 67, 0.6);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        
        .modal-card {
            background: white;
            border-radius: 24px;
            max-width: 400px;
            width: 100%;
            padding: 28px 32px 32px;
            box-shadow: 0 24px 64px rgba(0,0,0,0.2);
            animation: modalFade 0.3s ease-out;
            position: relative;
        }
        
        @keyframes modalFade {
            0% { opacity: 0; transform: translateY(20px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        .modal-card .close-btn {
            position: absolute;
            top: 16px;
            right: 20px;
            font-size: 1.6rem;
            cursor: pointer;
            color: var(--text-secondary);
            background: none;
            border: none;
            line-height: 1;
        }
        
        .modal-card .close-btn:hover { 
            color: var(--text-primary); 
            transform: rotate(90deg); 
        }
        
        .modal-card .modal-date { 
            font-size: 0.95rem; 
            color: var(--text-secondary); 
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .modal-card .modal-time { 
            font-size: 1.2rem; 
            font-weight: 700; 
            color: var(--text-primary);
        }
        
        .modal-card .modal-topic { 
            font-size: 1.15rem; 
            font-weight: 700; 
            margin: 12px 0 16px; 
            color: var(--text-primary);
            line-height: 1.4;
        }
        
        .modal-card .modal-links {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 8px;
        }
        
        .modal-card .modal-links a {
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-purple) 100%);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            box-shadow: 0 3px 10px rgba(67, 97, 238, 0.25);
        }
        
        .modal-card .modal-links a:hover { 
            transform: translateY(-2px);
            box-shadow: 0 5px 16px rgba(67, 97, 238, 0.35);
        }
        
        .modal-card .modal-links a.secondary { 
            background: rgba(67, 97, 238, 0.12); 
            color: var(--accent-blue);
            box-shadow: none;
        }
        
        .modal-card .modal-links a.secondary:hover { 
            background: rgba(67, 97, 238, 0.2);
        }

        /* ---------- Адаптивность ---------- */
        @media (max-width: 900px) {
            .main-wrapper { flex-direction: column; }
            .sidebar { 
                width: 100%; 
                position: relative;
                top: 0;
            }
            .sidebar.hidden { display: none; }
            .sidebar-toggle {
                position: relative;
                top: 0;
                left: 0;
                margin-bottom: 16px;
            }
            .cards-grid { grid-template-columns: 1fr; }
            .charts-container { grid-template-columns: 1fr; }
        }

        @media (max-width: 600px) {
            body { padding: 12px; }
            .container { padding: 24px 20px 28px; border-radius: 20px; }
            .login-card { padding: 40px 32px 36px; }
            .login-title { font-size: 1.4rem; }
            .login-input { font-size: 0.95rem; padding: 12px 16px; }
            .login-btn { font-size: 1rem; padding: 13px 24px; }
            .quick-links-container { justify-content: center; flex-wrap: wrap; }
            .quick-link-btn { padding: 10px 20px; font-size: 0.9rem; min-width: 120px; }
            .calendar-wrapper { padding: 20px; }
            .calendar-grid { gap: 4px; }
            .calendar-grid .day { font-size: 0.85rem; }
            .calendar-grid .weekday { font-size: 0.7rem; padding: 8px 0; }
            .modal-card { padding: 24px 26px 28px; max-width: 340px; }
            .progress-stats { grid-template-columns: 1fr; }
            .cards-grid { gap: 16px; }
            h1 { font-size: 1.4rem; }
            .math-symbol { display: none; }
        }
    </style>
</head>
<body>
    <!-- Математические символы на фоне -->
    <div class="math-symbol" style="top: 10%; left: 5%;">∑</div>
    <div class="math-symbol" style="top: 60%; right: 8%;">∫</div>
    <div class="math-symbol" style="bottom: 15%; left: 10%;">π</div>
    <div class="math-symbol" style="top: 30%; right: 3%;">√</div>
    <div class="math-symbol" style="bottom: 40%; right: 12%;">∞</div>

    <div class="sidebar-toggle" id="sidebarToggle" title="Показать меню"></div>

    <div class="main-wrapper">
        <!-- Сайдбар -->
        <div class="sidebar hidden" id="sidebar">
            <div class="logo">📚 Личный <span>кабинет</span></div>
            <button class="nav-item active" data-page="schedule">📋 Расписание</button>
            <button class="nav-item" data-page="homework">📝 Домашки</button>
            <button class="nav-item" data-page="materials">📚 Материалы</button>
            <button class="nav-item" data-page="progress">📊 Прогресс</button>
            <button class="theme-toggle" id="themeToggle"> Тема</button>
        </div>

        <div class="container">
            <!-- Вход -->
            <div class="login-wrapper" id="loginWrapper">
                <div class="login-card">

                    <div class="cards-grid" id="materialsCards"></div>
                    <button class="show-more-btn" id="showAllMaterials" style="display: none;">Показать все</button>

<script>
    // ============================================================
    //    ПАРОЛИ УЧЕНИКОВ
    // ============================================================
    const passwords = {
        'valeriya': 'der44',
        'amina': '5678',
        'denis': '1234',
        'alina': '121212'
    };

    const nameMap = {
        'валерия': 'valeriya',
        'лера': 'valeriya',
        'амина': 'amina',
        'денис': 'denis',
        'ден': 'denis',
        'алина': 'alina'
    };

    let currentStudentId = null;
    let currentStudentName = '';
    let currentDate = new Date();
    let currentMonth = currentDate.getMonth();
    let currentYear = currentDate.getFullYear();
    let lessonsData = [];
    let testsData = [];
    let currentPage = 'schedule';
    let showAllHomework = false;
    let showAllMaterials = false;
    let charts = {};

    // DOM
    const nameInput = document.getElementById('nameInput');
    const passwordInput = document.getElementById('passwordInput');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');
    const loginWrapper = document.getElementById('loginWrapper');
    const mainContent = document.getElementById('mainContent');
    const sidebar = document.getElementById('sidebar');
    const sidebarToggle = document.getElementById('sidebarToggle');
    const monthYear = document.getElementById('monthYear');
    const calendarGrid = document.getElementById('calendarGrid');
    const homeworkCards = document.getElementById('homeworkCards');
    const materialsCards = document.getElementById('materialsCards');
    const progressStats = document.getElementById('progressStats');
    const chartsContainer = document.getElementById('chartsContainer');
    const prevMonthBtn = document.getElementById('prevMonth');
    const nextMonthBtn = document.getElementById('nextMonth');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalClose = document.getElementById('modalClose');
    const modalDate = document.getElementById('modalDate');
    const modalTime = document.getElementById('modalTime');
    const modalTopic = document.getElementById('modalTopic');
    const modalLinks = document.getElementById('modalLinks');
    const pageTitle = document.getElementById('pageTitle');
    const zoomBtn = document.getElementById('zoomBtn');
    const boardBtn = document.getElementById('boardBtn');
    const quickLinks = document.getElementById('quickLinks');
    const themeToggle = document.getElementById('themeToggle');
    const showAllHomeworkBtn = document.getElementById('showAllHomework');
    const showAllMaterialsBtn = document.getElementById('showAllMaterials');

    // ============================================================
    //  🌓  ТЕМНАЯ ТЕМА
    // ============================================================
    const savedTheme = localStorage.getItem('darkMode');
    if (savedTheme === 'true') {
        document.body.classList.add('dark-mode');
    }

    themeToggle.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
        if (currentPage === 'progress') {
            setTimeout(() => renderProgressPage(), 100);
        }
    });

    // ============================================================
    //  ◀▶  САЙДБАР
    // ============================================================
    sidebarToggle.addEventListener('click', () => {
        sidebar.classList.toggle('hidden');
        sidebarToggle.textContent = sidebar.classList.contains('hidden') ? '☰' : '◀';
        sidebarToggle.title = sidebar.classList.contains('hidden') ? 'Показать меню' : 'Скрыть меню';
    });

    document.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', function() {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            this.classList.add('active');
            switchPage(this.dataset.page);
        });
    });

    function switchPage(page) {
        currentPage = page;
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        const target = document.getElementById(`page-${page}`);
        if (target) target.classList.add('active');

        const titles = {
            'schedule': '📅 Расписание занятий',
            'homework': '📝 Домашние задания',
            'materials': '📚 Материалы',
            'progress': ' Мой прогресс'
        };
        pageTitle.textContent = titles[page] || ' Личный кабинет';

        if (page === 'homework') renderHomeworkCards();
        if (page === 'materials') renderMaterialsCards();
        if (page === 'progress') renderProgressPage();
        if (page === 'schedule') {
            renderCalendar(currentYear, currentMonth);
        }
    }

    // ============================================================
    //  🔗  БЫСТРЫЕ ССЫЛКИ
    // ============================================================
    function updateQuickLinks() {
        if (!currentStudentId || !lessonsData.length) {
            quickLinks.style.display = 'none';
            return;
        }
        quickLinks.style.display = 'flex';

        const today = new Date();
        const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
        let todaysLesson = lessonsData.find(l => l.date === todayStr);

        if (!todaysLesson) {
            const pastLessons = lessonsData.filter(l => l.date < todayStr);
            if (pastLessons.length > 0) {
                pastLessons.sort((a, b) => b.date.localeCompare(a.date));
                todaysLesson = pastLessons[0];
            }
        }

        if (todaysLesson) {
            const zoomLink = todaysLesson.zoomLink || '';
            const boardLink = todaysLesson.boardLink || '';
            zoomBtn.href = zoomLink || '#';
            zoomBtn.style.opacity = zoomLink ? '1' : '0.4';
            zoomBtn.style.cursor = zoomLink ? 'pointer' : 'not-allowed';
            boardBtn.href = boardLink || '#';
            boardBtn.style.opacity = boardLink ? '1' : '0.4';
            boardBtn.style.cursor = boardLink ? 'pointer' : 'not-allowed';
        } else {
            zoomBtn.href = '#';
            boardBtn.href = '#';
            zoomBtn.style.opacity = '0.4';
            boardBtn.style.opacity = '0.4';
        }
    }

    // ============================================================
    //    ПРОГРЕСС
    // ============================================================
    async function renderProgressPage() {
        if (!lessonsData || lessonsData.length === 0) {
            progressStats.innerHTML = '<p style="color:var(--text-secondary); text-align:center; grid-column: 1/-1; font-size: 1.1rem;">Нет данных</p>';
            chartsContainer.innerHTML = '';
            return;
        }

        const today = new Date();
        const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

        // Фильтруем только прошедшие уроки с темой
        const pastLessons = lessonsData.filter(l => {
            return l.date <= todayStr && l.topic && l.topic.trim() !== '';
        });

        // Фильтруем домашки (только прошедшие с темой)
        const homeworkLessons = lessonsData.filter(l => {
            return l.date <= todayStr && l.topic && l.topic.trim() !== '' && l.homework && l.homework.trim() !== '';
        });

        // Подсчитаем выполненные домашки
        let completedHomework = 0;
        homeworkLessons.forEach(l => {
            const status = localStorage.getItem(`hw_status_${currentStudentId}_${l.date}`);
            if (status === 'done' || status === 'checked') {
                completedHomework++;
            }
        });

        const totalHomework = homeworkLessons.length;
        const completedTopics = pastLessons.length;

        // Статистика за месяц
        const currentMonthStr = String(currentMonth + 1).padStart(2, '0');
        const currentYearStr = String(currentYear);
        const monthLessons = pastLessons.filter(item => {
            const dateParts = item.date.split('-');
            return dateParts[0] === currentYearStr && dateParts[1] === currentMonthStr;
        });
        const monthCompleted = monthLessons.length;

        // Для Дениса загружаем пробники
        if (currentStudentId === 'denis') {
            try {
                const response = await fetch(`config/denis_tests.json?t=${Date.now()}`);
                if (response.ok) {
                    testsData = await response.json();
                }
            } catch(e) {
                testsData = [];
            }
        }

        // Статистика
        let statsHTML = `
            <div class="stat-card">
                <div class="stat-value">${completedTopics}</div>
                <div class="stat-label">Тем пройдено</div>
                <div class="stat-sublabel">из них ${monthCompleted} в этом месяце</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">${completedHomework}</div>
                <div class="stat-label">Домашек выполнено</div>
                <div class="stat-sublabel">из ${totalHomework} всего</div>
            </div>
        `;

        if (currentStudentId === 'denis' && testsData.length > 0) {
            const totalTests = testsData.length;
            const avgScore = Math.round(testsData.reduce((sum, t) => sum + (t.score || 0), 0) / totalTests);
            statsHTML += `
                <div class="stat-card">
                    <div class="stat-value">${totalTests}</div>
                    <div class="stat-label">Пробников решено</div>
                    <div class="stat-sublabel">средний балл: ${avgScore}</div>
                </div>
            `;
        }

        progressStats.innerHTML = statsHTML;

        // Графики
        chartsContainer.innerHTML = `
            <div class="chart-card">
                <h3>📋 Выполнение домашних заданий</h3>
                <canvas id="homeworkChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>📈 Прогресс по темам</h3>
                <canvas id="topicsChart"></canvas>
            </div>
        `;

        if (currentStudentId === 'denis' && testsData.length > 0) {
            chartsContainer.innerHTML += `
                <div class="chart-card" style="grid-column: 1 / -1;">
                    <h3>📊 Результаты пробников</h3>
                    <canvas id="testsChart"></canvas>
                </div>
            `;
        }

        // График домашних заданий (красный/зелёный)
        const hwCtx = document.getElementById('homeworkChart').getContext('2d');
        if (charts.homework) charts.homework.destroy();
        charts.homework = new Chart(hwCtx, {
            type: 'doughnut',
            data: {
                labels: ['Выполнено', 'Осталось'],
                datasets: [{
                    data: [completedHomework, totalHomework - completedHomework],
                    backgroundColor: ['#06d6a0', '#ef476f'],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            color: getComputedStyle(document.body).getPropertyValue('--text-primary'),
                            padding: 15,
                            font: { size: 13, weight: '600' }
                        }
                    }
                },
                cutout: '65%'
            }
        });

        // График прогресса по темам (линейный)
        const topicsByDate = {};
        pastLessons.forEach(l => {
            if (!topicsByDate[l.date]) topicsByDate[l.date] = 0;
            topicsByDate[l.date]++;
        });

        const sortedDates = Object.keys(topicsByDate).sort();
        let cumulative = 0;
        const cumulativeData = sortedDates.map(date => {
            cumulative += topicsByDate[date];
            return cumulative;
        });

        const topicsCtx = document.getElementById('topicsChart').getContext('2d');
        if (charts.topics) charts.topics.destroy();
        charts.topics = new Chart(topicsCtx, {
            type: 'line',
            data: {
                labels: sortedDates.map(d => {
                    const parts = d.split('-');
                    return `${parts[2]}.${parts[1]}`;
                }),
                datasets: [{
                    label: 'Пройдено тем',
                    data: cumulativeData,
                    borderColor: '#4361ee',
                    backgroundColor: 'rgba(67, 97, 238, 0.1)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.4,
                    pointBackgroundColor: '#4361ee',
                    pointBorderColor: '#fff',
                    pointBorderWidth: 2,
                    pointRadius: 5,
                    pointHoverRadius: 7
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            stepSize: 1,
                            color: getComputedStyle(document.body).getPropertyValue('--text-secondary'),
                            font: { weight: '600' }
                        },
                        grid: {
                            color: getComputedStyle(document.body).getPropertyValue('--border-color')
                        }
                    },
                    x: {
                        ticks: {
                            color: getComputedStyle(document.body).getPropertyValue('--text-secondary'),
                            font: { weight: '600' }
                        },
                        grid: { display: false }
                    }
                }
            }
        });

        // Для Дениса - график пробников
        if (currentStudentId === 'denis' && testsData.length > 0) {
            const testsCtx = document.getElementById('testsChart').getContext('2d');
            if (charts.tests) charts.tests.destroy();
            charts.tests = new Chart(testsCtx, {
                type: 'bar',
                data: {
                    labels: testsData.map(t => t.name || `Пробник ${testsData.indexOf(t) + 1}`),
                    datasets: [{
                        label: 'Балл',
                        data: testsData.map(t => t.score || 0),
                        backgroundColor: 'rgba(114, 9, 183, 0.7)',
                        borderColor: 'rgba(114, 9, 183, 1)',
                        borderWidth: 2,
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            ticks: {
                                stepSize: 10,
                                color: getComputedStyle(document.body).getPropertyValue('--text-secondary'),
                                font: { weight: '600' }
                            },
                            grid: {
                                color: getComputedStyle(document.body).getPropertyValue('--border-color')
                            }
                        },
                        x: {
                            ticks: {
                                color: getComputedStyle(document.body).getPropertyValue('--text-secondary'),
                                font: { weight: '600' }
                            },
                            grid: { display: false }
                        }
                    }
                }
            });
        }
    }

    // ============================================================
    //    ДОМАШКИ (КАРТОЧКИ)
    // ============================================================
    function renderHomeworkCards() {
        if (!lessonsData || lessonsData.length === 0) {
            homeworkCards.innerHTML = '<p style="color:var(--text-secondary); text-align:center; grid-column: 1/-1; font-size: 1.1rem;">Нет домашних заданий.</p>';
            showAllHomeworkBtn.style.display = 'none';
            return;
        }

        const today = new Date();
        const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

        // Фильтруем: только с темой, с домашкой и прошедшие даты
        const sorted = [...lessonsData].filter(l => {
            return l.topic && l.topic.trim() !== '' && 
                   l.homework && l.homework.trim() !== '' && 
                   l.date <= todayStr;
        });
        
        sorted.sort((a, b) => new Date(a.date) - new Date(b.date));

        const displayCount = showAllHomework ? sorted.length : Math.min(6, sorted.length);
        const items = sorted.slice(0, displayCount);

        if (items.length === 0) {
            homeworkCards.innerHTML = '<p style="color:var(--text-secondary); text-align:center; grid-column: 1/-1; font-size: 1.1rem;">Нет домашних заданий.</p>';
            showAllHomeworkBtn.style.display = 'none';
            return;
        }

        if (sorted.length > 6) {
            showAllHomeworkBtn.style.display = 'block';
            showAllHomeworkBtn.textContent = showAllHomework ? 'Скрыть' : 'Показать все';
        } else {
            showAllHomeworkBtn.style.display = 'none';
        }

        let html = '';
        items.forEach(l => {
            const dateParts = l.date.split('-');
            const displayDate = `${dateParts[2]}.${dateParts[1]}`;
            const hwKey = `hw_status_${currentStudentId}_${l.date}`;
            const status = localStorage.getItem(hwKey) || 'pending';
            const statusMap = {
                'pending': { text: '⏳ Не сделано', class: 'pending' },
                'done': { text: '✅ Сделано', class: 'done' },
                'checked': { text: '📝 Проверено', class: 'checked' }
            };
            const hwLink = buildHomeworkLink(l.homework, currentStudentId, l);

            html += `
                <div class="hw-card">
                    <div class="card-header">
                        <span class="card-date">${displayDate}</span>
                        <span class="card-status ${statusMap[status].class} status-toggle" data-date="${l.date}" data-status="${status}">${statusMap[status].text}</span>
                    </div>
                    <div class="card-topic">${l.topic}</div>
                    <div class="card-actions">
                        <a href="${hwLink}" target="_blank" class="card-btn primary">📄 Открыть</a>
                    </div>
                </div>
            `;
        });

        homeworkCards.innerHTML = html;

        document.querySelectorAll('.status-toggle').forEach(btn => {
            btn.addEventListener('click', function() {
                const date = this.dataset.date;
                const currentStatus = this.dataset.status;
                const key = `hw_status_${currentStudentId}_${date}`;
                
                let newStatus = 'done';
                if (currentStatus === 'done' || currentStatus === 'checked') {
                    newStatus = 'pending';
                }
                
                localStorage.setItem(key, newStatus);
                renderHomeworkCards();
            });
        });

        showAllHomeworkBtn.onclick = () => {
            showAllHomework = !showAllHomework;
            renderHomeworkCards();
        };
    }

    // ============================================================
    //  📚  МАТЕРИАЛЫ (КАРТОЧКИ)
    // ============================================================
    function renderMaterialsCards() {
        if (!lessonsData || lessonsData.length === 0) {
            materialsCards.innerHTML = '<p style="color:var(--text-secondary); text-align:center; grid-column: 1/-1; font-size: 1.1rem;">Нет материалов.</p>';
            showAllMaterialsBtn.style.display = 'none';
            return;
        }

        const today = new Date();
        const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

        // Фильтруем: только с темой, с материалом и прошедшие даты
        const sorted = [...lessonsData].filter(l => {
            return l.topic && l.topic.trim() !== '' && 
                   l.material && l.material.trim() !== '' && 
                   l.date <= todayStr;
        });
        
        sorted.sort((a, b) => new Date(b.date) - new Date(a.date));

        const displayCount = showAllMaterials ? sorted.length : Math.min(6, sorted.length);
        const items = sorted.slice(0, displayCount);

        if (items.length === 0) {
            materialsCards.innerHTML = '<p style="color:var(--text-secondary); text-align:center; grid-column: 1/-1; font-size: 1.1rem;">Нет материалов.</p>';
            showAllMaterialsBtn.style.display = 'none';
            return;
        }

        if (sorted.length > 6) {
            showAllMaterialsBtn.style.display = 'block';
            showAllMaterialsBtn.textContent = showAllMaterials ? 'Скрыть' : 'Показать все';
        } else {
            showAllMaterialsBtn.style.display = 'none';
        }

        let html = '';
        items.forEach(l => {
            const dateParts = l.date.split('-');
            const displayDate = `${dateParts[2]}.${dateParts[1]}`;

            html += `
                <div class="mat-card">
                    <div class="card-header">
                        <span class="card-date">${displayDate}</span>
                    </div>
                    <div class="card-topic">${l.topic}</div>
                    <div class="card-actions">
                        <a href="${l.material}" target="_blank" class="card-btn primary"> Открыть материал</a>
                    </div>
                </div>
            `;
        });

        materialsCards.innerHTML = html;

        showAllMaterialsBtn.onclick = () => {
            showAllMaterials = !showAllMaterials;
            renderMaterialsCards();
        };
    }

    // ============================================================
    //  🛠  ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
    // ============================================================
    function buildHomeworkLink(basePath, studentId, lesson) {
        if (!basePath) return '';
        const params = new URLSearchParams({
            student: studentId,
            date: lesson.date,
            topic: lesson.topic || '',
            start: lesson.start || '',
            end: lesson.end || ''
        });
        return basePath + '?' + params.toString();
    }

    async function loadLessons(studentId) {
        try {
            const response = await fetch(`config/${studentId}.json`);
            if (!response.ok) throw new Error('Файл не найден');
            lessonsData = await response.json();
            return true;
        } catch {
            lessonsData = [];
            return false;
        }
    }

    // ============================================================
    //  🔑  ВХОД
    // ============================================================
    async function handleLogin() {
        const raw = nameInput.value.trim();
        const password = passwordInput.value.trim();
        if (!raw) { loginError.textContent = 'Введите имя'; return; }
        if (!password) { loginError.textContent = 'Введите пароль'; return; }
        const id = nameMap[raw.toLowerCase()];
        if (!id) { loginError.textContent = 'Ученик не найден'; return; }
        if (passwords[id] !== password) {
            loginError.textContent = '❌ Неверный пароль';
            return;
        }
        if (id === 'alina') {
            localStorage.setItem('teacherSession', JSON.stringify({ name: 'alina', time: Date.now() }));
            window.location.href = 'teacher.html';
            return;
        }
        loginError.textContent = '';
        currentStudentId = id;
        currentStudentName = raw;
        const ok = await loadLessons(id);
        if (!ok) { loginError.textContent = 'Нет расписания'; return; }

        loginWrapper.style.display = 'none';
        mainContent.style.display = 'block';
        sidebar.classList.remove('hidden');
        sidebarToggle.textContent = '◀';

        switchPage('schedule');
        updateQuickLinks();
    }

    loginBtn.addEventListener('click', handleLogin);
    nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
    passwordInput.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });

    // ============================================================
    //  📅  КАЛЕНДАРЬ
    // ============================================================
    function getLessonsForDate(dateStr) {
        return lessonsData.filter(item => item.date === dateStr);
    }

    function renderCalendar(year, month) {
        const firstDay = new Date(year, month, 1).getDay();
        const startDay = (firstDay === 0) ? 6 : firstDay - 1;
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const today = new Date();
        const monthNames = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
        monthYear.textContent = `${monthNames[month]} ${year}`;
        const lessonDates = new Set(lessonsData.map(item => item.date));
        const weekdays = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
        let html = weekdays.map(w => `<div class="weekday">${w}</div>`).join('');
        for (let i = 0; i < startDay; i++) html += `<div class="day other-month"></div>`;
        for (let d = 1; d <= daysInMonth; d++) {
            const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const hasLesson = lessonDates.has(dateStr);
            let cls = 'day';
            if (hasLesson) cls += ' has-lesson';
            if (d === today.getDate() && month === today.getMonth() && year === today.getFullYear()) cls += ' today';
            const attr = hasLesson ? `data-date="${dateStr}"` : '';
            html += `<div class="${cls}" ${attr}>${d}${hasLesson ? '<span class="dot"></span>' : ''}</div>`;
        }
        calendarGrid.innerHTML = html;
        document.querySelectorAll('.day.has-lesson').forEach(el => {
            el.addEventListener('click', function() {
                const lessons = getLessonsForDate(this.dataset.date);
                if (lessons.length) showModal(this.dataset.date, lessons);
            });
        });
    }

    function showModal(dateStr, lessons) {
        const [y, m, d] = dateStr.split('-').map(Number);
        const dateObj = new Date(y, m-1, d);
        modalDate.textContent = dateObj.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        if (lessons.length === 1) {
            const l = lessons[0];
            modalTime.textContent = `${l.start}–${l.end}`;
            modalTopic.textContent = l.topic;
            let html = '';
            if (l.material) html += `<a href="${l.material}" target="_blank" class="secondary">📖 Материал</a>`;
            if (l.homework) {
                const hwLink = buildHomeworkLink(l.homework, currentStudentId, l);
                html += `<a href="${hwLink}" target="_blank"> Домашка</a>`;
            }
            modalLinks.innerHTML = html || '<span style="color:var(--text-secondary);">Нет ссылок</span>';
        } else {
            let time = '', topic = '', links = '';
            lessons.forEach((l, i) => {
                time += `${l.start}–${l.end}` + (i < lessons.length-1 ? ', ' : '');
                topic += l.topic + (i < lessons.length-1 ? ', ' : '');
                if (l.material) links += `<a href="${l.material}" target="_blank" class="secondary"> ${i+1}</a>`;
                if (l.homework) {
                    const hwLink = buildHomeworkLink(l.homework, currentStudentId, l);
                    links += `<a href="${hwLink}" target="_blank">📝 ${i+1}</a>`;
                }
            });
            modalTime.textContent = time;
            modalTopic.textContent = topic;
            modalLinks.innerHTML = links || '<span style="color:var(--text-secondary);">Нет ссылок</span>';
        }
        modalOverlay.classList.add('active');
    }

    modalClose.addEventListener('click', () => modalOverlay.classList.remove('active'));
    modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) modalOverlay.classList.remove('active'); });

    function changeMonth(delta) {
        currentMonth += delta;
        if (currentMonth < 0) { currentMonth = 11; currentYear--; }
        if (currentMonth > 11) { currentMonth = 0; currentYear++; }
        if (currentPage === 'schedule') {
            renderCalendar(currentYear, currentMonth);
        }
        if (currentPage === 'progress') renderProgressPage();
    }

    prevMonthBtn.addEventListener('click', () => changeMonth(-1));
    nextMonthBtn.addEventListener('click', () => changeMonth(1));

    window.addEventListener('DOMContentLoaded', async () => {
        const p = new URLSearchParams(window.location.search);
        const s = p.get('student');
        if (s) {
            const id = nameMap[s.toLowerCase()];
            if (id) {
                nameInput.value = s;
            }
        }
    });
</script>
</body>
</html>
