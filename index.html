<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Технические работы</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #0b0d15 0%, #1a1f2e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 1.5rem;
        }

        .card {
            background: rgba(22, 28, 46, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 48px;
            padding: 4rem 3.5rem;
            max-width: 560px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05) inset;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .icon {
            font-size: 4.5rem;
            margin-bottom: 1.8rem;
            display: block;
            filter: drop-shadow(0 0 20px rgba(255, 180, 50, 0.2));
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            color: #f0f4ff;
            margin-bottom: 0.8rem;
            letter-spacing: -0.02em;
        }

        .sub {
            font-size: 1.15rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.6;
            margin-bottom: 1.2rem;
        }

        .divider {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #f59e0b, #f97316);
            border-radius: 10px;
            margin: 1.5rem auto;
        }

        .message {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 24px;
            padding: 1.2rem 1.8rem;
            border-left: 4px solid #f59e0b;
            text-align: left;
        }

        .message p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1rem;
            line-height: 1.6;
        }

        .message strong {
            color: #fbbf24;
            font-weight: 500;
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 0.3px;
        }

        /* адаптив */
        @media (max-width: 480px) {
            .card {
                padding: 2.8rem 1.8rem;
                border-radius: 32px;
            }
            h1 {
                font-size: 1.8rem;
            }
            .icon {
                font-size: 3.5rem;
            }
        }
    </style>
</head>
<body>

<div class="card">
    <span class="icon">🛠️</span>

    <h1>Технические работы</h1>
    <p class="sub">
        Сайт временно недоступен
    </p>

    <div class="divider"></div>

    <div class="message">
        <p>
            <strong>⏳ Зайдите позже</strong><br />
            Мы уже работаем над улучшениями.<br />
            Скоро всё восстановится.
        </p>
    </div>

    <div class="footer">
        Приносим извинения за неудобства
    </div>
</div>

</body>
</html>
